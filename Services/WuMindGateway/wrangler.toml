name = "wumind-billing-gateway"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "wumind-billing-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[triggers]
crons = ["*/15 * * * *"]

[vars]
# Optional default welcome trial balance in Yuan for newly registered users (e.g. "0" or "1.0")
WELCOME_BALANCE_YUAN = "0"
# Safety default: pause ALL automated crediting (/v1/iap/verify, /v1/webhooks/epay, /v1/webhooks/payment)
# until you complete Apple Sandbox cryptographic verification & explicitly enable production.
AUTO_CREDIT_PAUSED = "true"
# Enable ONLY during Apple Sandbox / TestFlight QA; credits ONLY isolated sandbox_balance_micros (never production balance_micros).
ALLOW_APPLE_SANDBOX_TEST = "false"
# Keep "false" until App Store Production launch & full sandbox sign-off.
ALLOW_APPLE_PRODUCTION_IAP = "false"
# Maximum isolated sandbox test balance per user (Yuan) when ALLOW_APPLE_SANDBOX_TEST = "true".
SANDBOX_BALANCE_CAP_YUAN = "50"
# Set to "true" to also require live Apple App Store Server API v1 cross-check in addition to Apple Root CA - G3 x5c JWS verification.
REQUIRE_APPLE_SERVER_API = "false"
# AIHubMix unified supply model allowlist (comma-separated, fail-closed: empty blocks AIHubMix pass-through, "*" wildcard is rejected).
# Example: AIHUBMIX_ALLOWED_MODELS = "gpt-4o,gpt-4o-mini,claude-sonnet-4-20250514,gemini-2.5-pro,deepseek-reasoner,deepseek-chat"
AIHUBMIX_ALLOWED_MODELS = ""

# Set secrets via `npx wrangler secret put <NAME>`:
# - ADMIN_SECRET           (Required: your strong admin password/token for Settings -> Admin Billing)
# - AIHUBMIX_API_KEY       (Recommended unified supply: routes ONLY to https://aihubmix.com/v1/chat/completions for AIHUBMIX_ALLOWED_MODELS; NEVER put this into OPENAI_API_KEY!)
# - AIHUBMIX_APP_CODE      (Optional: your AIHubMix APP-Code header if applicable)
# - DEEPSEEK_API_KEY       (Optional: direct official DeepSeek API key -> api.deepseek.com)
# - OPENAI_API_KEY         (Optional: direct official OpenAI API key -> api.openai.com; NEVER paste AIHubMix keys here!)
# - GEMINI_API_KEY         (Optional: direct official Google Gemini API key -> generativelanguage.googleapis.com)
# - CLAUDE_API_KEY         (Optional: direct official Anthropic Claude API key -> api.anthropic.com)
# - GROK_API_KEY           (Optional: direct official xAI Grok API key -> api.x.ai)
# - TAVILY_API_KEY         (Optional: Tavily Deep Research search API key)
# - BRAVE_SEARCH_API_KEY   (Optional: Brave Web Search API key)
# - SERPER_API_KEY         (Optional: Serper.dev Google Search API key)
# - SMS_WEBHOOK_URL        (Optional: HTTPS SMS OTP delivery webhook for external phone registration)
# - SMS_WEBHOOK_SECRET     (Optional: Bearer secret sent to SMS_WEBHOOK_URL)
# - WECHAT_APP_ID          (Optional: WeChat Open Platform AppID for external WeChat login)
# - WECHAT_APP_SECRET      (Optional: WeChat Open Platform AppSecret for external WeChat login)
# - PAYMENT_WEBHOOK_SECRET (Optional: HMAC-SHA256 secret for automated payment webhooks — NEVER charge TestFlight testers!)
# - EPAY_API_URL           (Optional: Epay gateway base URL — NEVER enable for TestFlight beta testers!)
# - EPAY_PID               (Optional: Epay merchant PID)
# - EPAY_KEY               (Optional: Epay merchant MD5 key for /v1/webhooks/epay)
# - PAYMENT_CHECKOUT_URL   (Optional: custom HTTPS checkout template using {orderID},{amount},{userID},{channel})
# - APPLE_BUNDLE_ID        (Optional: defaults to com.kriswu.shiftreminder for StoreKit 2 IAP checks)
# - APPLE_IAP_ISSUER_ID    (Optional: App Store Connect In-App Purchase API Issuer ID for live server-to-server cross-check)
# - APPLE_IAP_KEY_ID       (Optional: App Store Connect In-App Purchase API Key ID)
# - APPLE_IAP_PRIVATE_KEY  (Optional: App Store Connect In-App Purchase API PKCS#8 PEM private key)
