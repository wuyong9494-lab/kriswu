name = "wumind-billing-gateway"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "wumind-billing-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[triggers]
crons = ["*/15 * * * *"]

[vars]
# Optional default welcome trial balance in Yuan for newly registered users (e.g. "0" or "1.0")
WELCOME_BALANCE_YUAN = "0"

# Set secrets via `npx wrangler secret put <NAME>`:
# - ADMIN_SECRET      (Required: your strong admin password/token for Settings -> Admin Billing)
# - DEEPSEEK_API_KEY  (Your upstream DeepSeek API key)
# - OPENAI_API_KEY    (Optional: your upstream OpenAI API key)
# - GEMINI_API_KEY    (Optional: your upstream Google Gemini API key)
# - CLAUDE_API_KEY         (Optional: your upstream Anthropic Claude API key)
# - GROK_API_KEY           (Optional: your upstream xAI Grok API key)
# - TAVILY_API_KEY         (Optional: Tavily Deep Research search API key)
# - BRAVE_SEARCH_API_KEY   (Optional: Brave Web Search API key)
# - SERPER_API_KEY         (Optional: Serper.dev Google Search API key)
# - PAYMENT_WEBHOOK_SECRET (Optional: HMAC-SHA256 secret for automated payment webhooks)
# - EPAY_API_URL           (Optional: Epay / 彩虹易支付 gateway base URL, e.g. https://pay.example.com)
# - EPAY_PID               (Optional: Epay merchant PID for automated WeChat/Alipay checkout)
# - EPAY_KEY               (Optional: Epay merchant MD5 key for /v1/webhooks/epay auto-crediting)
# - PAYMENT_CHECKOUT_URL   (Optional: custom HTTPS checkout template using {orderID},{amount},{userID},{channel})
# - APPLE_BUNDLE_ID        (Optional: defaults to com.kriswu.shiftreminder for StoreKit 2 IAP checks)
