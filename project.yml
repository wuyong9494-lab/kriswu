# 用 XcodeGen 生成 Xcode 工程：brew install xcodegen && xcodegen
name: ShiftReminder
options:
  bundleIdPrefix: com.kriswu
  deploymentTarget:
    iOS: "16.2"
  developmentLanguage: zh-Hans
settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # 界面文字集中到 App/Localizable.xcstrings（中文为基础语言）：在 Xcode 里编译一次就会把代码里的文字收集进去，以后翻译、改字都在那里
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  ShiftReminder:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Resources/*.arenapack
      # Scan the existing directory: only an installed private pack is copied.
      # The broad App source above excludes this file to avoid duplicate copies.
      - path: App
        type: group
        includes:
          - Resources/arena-original-resources.arenapack
        buildPhase: resources
      - path: Sources/ShiftCore
      - path: Shared
    dependencies:
      - target: ShiftWidget
    entitlements:
      path: App/ShiftReminder.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kriswu.shiftreminder
        # 通讯通知：推送左边的大图显示那天的班（见 ShiftNotificationAvatar）
        com.apple.developer.usernotifications.communication: true
        # 时效性通知：值遥测的提醒在勿扰、睡眠专注时也会弹出（见 NotificationService）
        com.apple.developer.usernotifications.time-sensitive: true
        # 小游戏的远程对战、轮流下（见 GameRoom、GomokuTurns）
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kriswu.shiftreminder
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 把 IconA…IconE、IconRest 也编进去，供每天切换图标
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # iPhone 和 iPad 都能装（iPad 上内容限宽居中，可以横着用）
        TARGETED_DEVICE_FAMILY: "1,2"
        # 完整的并发检查（Swift 5 模式下是警告，CI 会列出来）
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - SiteTests

  # 模拟器里对着仿值班网站（Tests/MockSite）跑同步流程，只在 CI 用
  SiteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SiteTests
    dependencies:
      - target: ShiftReminder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kriswu.shiftreminder.sitetests
        TARGETED_DEVICE_FAMILY: "1,2"

  # Production resource algorithms only; no App lifecycle, widgets or business UI.
  ArenaResourceRuntime:
    type: framework.static
    platform: iOS
    sources:
      - path: App/Services/GLTFModel.swift
      - path: Sources/ShiftCore/BoneSampler.swift
      - path: Sources/ShiftCore/ArenaResourcePack.swift
      - path: App/Services/ArenaResourcePackArchive.swift
      - path: App/Services/ArenaFaceScene.swift
      - path: App/Services/ArenaColorGrade.swift
    settings:
      base:
        PRODUCT_MODULE_NAME: ArenaResourceRuntime
        PRODUCT_BUNDLE_IDENTIFIER: com.kriswu.arenaresourceruntime
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        ENABLE_TESTABILITY: YES
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  ArenaResourceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SiteTests/GLTFMaterialTests.swift
      - path: Tests/SiteTests/ArenaResourcePackTests.swift
      - path: Tests/SiteTests/ArenaImportedFaceTests.swift
    dependencies:
      - target: ArenaResourceRuntime
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kriswu.arenaresourcetests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ARENA_RESOURCE_RUNTIME_TESTS"
        SWIFT_EMIT_LOC_STRINGS: NO

  # 主屏幕 / 锁屏小组件：显示今天、明天的分工
  ShiftWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
      - path: Shared
    entitlements:
      path: Widget/ShiftWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kriswu.shiftreminder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kriswu.shiftreminder.widget
        INFOPLIST_FILE: Widget/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  ArenaFlowTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ArenaFlowTests
    dependencies:
      - target: ShiftReminder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kriswu.shiftreminder.arenaflowtests
        TEST_TARGET_NAME: ShiftReminder
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  ArenaResourceValidation:
    build:
      targets:
        ArenaResourceRuntime: [test]
        ArenaResourceTests: [test]
    test:
      config: Debug
      targets:
        - ArenaResourceTests
  ArenaFlow:
    build:
      targets:
        ShiftReminder: all
        ArenaFlowTests: [test]
    test:
      targets:
        - ArenaFlowTests
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
      preferredScreenCaptureFormat: screenshots
