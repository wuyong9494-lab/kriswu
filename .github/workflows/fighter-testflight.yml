name: Fighter TestFlight promotion (external eligible)
run-name: Upload verified TestFlight build

on:
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths: ['.github/releases/fighter-testflight.json']

permissions:
  contents: read
  actions: read

# Serialize the entire check/upload/Apple-processing sequence, including retries.
concurrency:
  group: testflight-com-kriswu-shiftreminder
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'wuyong9494-lab/kriswu' && github.ref == 'refs/heads/codex/fighter-visual-acceptance-20261113-1200' && github.event_name == 'push' && github.event.before == '81a870bdf1c92dff668ee0b1c9a87b82465257c2' && github.event.head_commit.message == 'Promote verified fighter 1.2 (705) to external TestFlight'
    environment: fighter-private-assets
    outputs:
      upload_required: ${{ steps.verify.outputs.upload_required }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      build_number: ${{ steps.verify.outputs.build_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare Apple API access
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID"
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          grep -q 'BEGIN PRIVATE KEY' "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          python3 -m pip install --quiet --user --break-system-packages pyjwt cryptography
      - name: Check source CI and prevent duplicate upload
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_asc_promote.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_fighter_promote.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_fighter_external_testflight.py' -v
          python3 .github/scripts/fighter_promote.py preflight .github/releases/fighter-testflight.json
      - name: Remove local Apple key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-preflight
          path: |
            promotion-preflight.json
            promotion-external-preflight.json
          if-no-files-found: warn

  testflight:
    needs: verify
    if: needs.verify.outputs.upload_required == 'true'
    environment: fighter-private-assets
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TARGET_BUILD: ${{ needs.verify.outputs.build_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.source_sha }}
          path: source
      - uses: actions/checkout@v5
        with:
          ref: 36878beef5d9c8d86193b7eea04e5e381042691d
          path: music-cipher
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Prepare existing signing credentials
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$APPLE_TEAM_ID" && test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID"
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          grep -q 'BEGIN PRIVATE KEY' "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          python3 -m pip install --quiet --user --break-system-packages pyjwt cryptography
      - name: Select validated Xcode 26.6
        run: |
          test -d /Applications/Xcode_26.6.app
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Generate project with the verified source identity
        run: |
          brew install xcodegen
          python3 .github/scripts/fighter_promote.py stamp .github/releases/fighter-testflight.json --path source
          cd source
          xcodegen generate
      - name: Stage the validated actual Liu model (never a public artifact)
        working-directory: source
        env:
          FIGHTER_LIU_MODEL_KEY: ${{ secrets.FIGHTER_LIU_MODEL_KEY }}
        run: |
          brew install openssl@3
          python3 .github/scripts/fighter_private_model.py stage
          # The current fighter branch uses distinct encrypted body, weapon,
          # animation and scene assets. A signed build must stage all of them.
          python3 .github/scripts/fighter_sf3_assets.py
          python3 .github/scripts/fighter_sf3_assets.py --original-rig
          python3 .github/scripts/fighter_sf3_distinct.py
          xcodegen generate
      - name: Authenticate and stage the tested presentation and source skin resources
        working-directory: source
        env:
          FIGHTER_PRESENTATION_KEY: ${{ secrets.FIGHTER_PRESENTATION_KEY }}
        run: |
          python3 .github/scripts/fighter_presentation_assets.py stage
          python3 .github/scripts/fighter_source_trails.py stage
          xcodegen generate
      - name: Stage pinned independently encrypted music and provenance
        env:
          FIGHTER_LIU_MODEL_KEY: ${{ secrets.FIGHTER_MUSIC_PACKAGE_KEY }}
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/fighter_acceptance_music.py" "$GITHUB_WORKSPACE/music-cipher" "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP"
          cd source
          xcodegen generate
      - name: Archive the requested build with automatic signing
        working-directory: source
        shell: bash -eo pipefail {0}
        run: |
          xcodebuild archive \
            -project ShiftReminder.xcodeproj \
            -scheme ShiftReminder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ShiftReminder.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEFAULT_SITE_URL="$SITE_URL" \
            CURRENT_PROJECT_VERSION="$TARGET_BUILD" 2>&1 | tail -80
      - name: Verify signed app, extension, version, source and all private assets
        env:
          FIGHTER_LIU_MODEL_KEY: ${{ secrets.FIGHTER_LIU_MODEL_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          codesign --verify --deep --strict source/build/ShiftReminder.xcarchive/Products/Applications/ShiftReminder.app
          APP=source/build/ShiftReminder.xcarchive/Products/Applications/ShiftReminder.app
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/fighter-signed-entitlements.plist" 2>/dev/null
          python3 - <<'PYCODE'
          import os, plistlib
          from pathlib import Path
          e=plistlib.loads((Path(os.environ['RUNNER_TEMP'])/'fighter-signed-entitlements.plist').read_bytes())
          team=os.environ['APPLE_TEAM_ID']
          assert e.get('com.apple.developer.team-identifier') == team, 'Signed team mismatch'
          assert e.get('application-identifier') == team+'.com.kriswu.shiftreminder', 'Signed application mismatch'
          assert e.get('com.apple.developer.game-center') is True, 'Signed Game Center entitlement missing'
          PYCODE
          python3 .github/scripts/fighter_promote.py archive .github/releases/fighter-testflight.json --path source/build/ShiftReminder.xcarchive --source source
          python3 .github/scripts/fighter_promote.py guard .github/releases/fighter-testflight.json
      - name: Persist upload intent before any Apple upload
        uses: actions/upload-artifact@v4
        with:
          name: fighter-upload-attempt-${{ needs.verify.outputs.build_number }}
          path: promotion-archive.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload exactly this build to TestFlight
        id: upload
        working-directory: source
        shell: bash -eo pipefail {0}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ShiftReminder.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -80
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Uploaded build $TARGET_BUILD; Apple processing is checked separately."
      - name: Remove local signing and model material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          rm -rf source/App/Resources/FighterPrivate source/build
          rm -f "$RUNNER_TEMP/music-clear.musicpack" "$RUNNER_TEMP/fighter-signed-entitlements.plist"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-archive-identity
          path: promotion-archive.json
          if-no-files-found: warn

  apple-status:
    needs: [verify, testflight]
    if: >-
      always() && needs.verify.result == 'success' &&
      needs.testflight.result == 'success' && needs.testflight.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    environment: fighter-private-assets
    timeout-minutes: 35
    env:
      UPLOADED_THIS_RUN: ${{ needs.testflight.outputs.uploaded }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check Apple processing, submit external review and enable tester notifications
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          export ASC_KEY_PATH="$KEY"
          python3 -m pip install --quiet --user --break-system-packages pyjwt cryptography
          ARGS=()
          if [ "$UPLOADED_THIS_RUN" = true ]; then ARGS+=(--uploaded); fi
          python3 .github/scripts/fighter_promote.py finish .github/releases/fighter-testflight.json "${ARGS[@]}"
      - name: Remove local Apple key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-apple-status
          path: |
            promotion-status.json
            promotion-external-preflight.json
            promotion-external-status.json
          if-no-files-found: warn
