name: Fighter TestFlight promotion (internal only)
run-name: Upload verified TestFlight build

on:
  push:
    branches: [codex/plan-fighter-recovery-20261108]
    paths: ['.github/releases/fighter-testflight.json']

permissions:
  contents: read
  actions: read

# Serialize the entire check/upload/Apple-processing sequence, including retries.
concurrency:
  group: testflight-com-kriswu-shiftreminder
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/codex/plan-fighter-recovery-20261108'
    outputs:
      upload_required: ${{ steps.verify.outputs.upload_required }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      build_number: ${{ steps.verify.outputs.build_number }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Apple API access
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID"
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          grep -q 'BEGIN PRIVATE KEY' "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          python3 -m pip install --quiet --user --break-system-packages pyjwt cryptography
      - name: Check source CI and prevent duplicate upload
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_asc_promote.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_fighter_promote.py' -v
          python3 .github/scripts/fighter_promote.py preflight .github/releases/fighter-testflight.json
      - name: Remove local Apple key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-preflight
          path: promotion-preflight.json
          if-no-files-found: warn

  testflight:
    needs: verify
    if: needs.verify.outputs.upload_required == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TARGET_BUILD: ${{ needs.verify.outputs.build_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          path: source
      - name: Prepare existing signing credentials
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$APPLE_TEAM_ID" && test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID"
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          grep -q 'BEGIN PRIVATE KEY' "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          python3 -m pip install --quiet --user --break-system-packages pyjwt cryptography
      - name: Select validated Xcode 26.6
        run: |
          test -d /Applications/Xcode_26.6.app
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Generate project with the verified source identity
        run: |
          brew install xcodegen
          python3 .github/scripts/fighter_promote.py stamp .github/releases/fighter-testflight.json --path source
          cd source
          xcodegen generate
      - name: Stage the validated actual Liu model (never a public artifact)
        working-directory: source
        env:
          FIGHTER_LIU_MODEL_KEY: ${{ secrets.FIGHTER_LIU_MODEL_KEY }}
        run: |
          brew install openssl@3
          python3 .github/scripts/fighter_private_model.py stage
          xcodegen generate
      - name: Archive the requested build with automatic signing
        working-directory: source
        shell: bash -eo pipefail {0}
        run: |
          xcodebuild archive \
            -project ShiftReminder.xcodeproj \
            -scheme ShiftReminder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ShiftReminder.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEFAULT_SITE_URL="$SITE_URL" \
            CURRENT_PROJECT_VERSION="$TARGET_BUILD" 2>&1 | tail -80
      - name: Verify signed app, extension, version, source and actual Liu asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          codesign --verify --deep --strict source/build/ShiftReminder.xcarchive/Products/Applications/ShiftReminder.app
          python3 .github/scripts/fighter_promote.py archive .github/releases/fighter-testflight.json --path source/build/ShiftReminder.xcarchive
          python3 .github/scripts/fighter_promote.py guard .github/releases/fighter-testflight.json
      - name: Persist upload intent before any Apple upload
        uses: actions/upload-artifact@v4
        with:
          name: fighter-upload-attempt-${{ needs.verify.outputs.build_number }}
          path: promotion-archive.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload exactly this build to TestFlight
        id: upload
        working-directory: source
        shell: bash -eo pipefail {0}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ShiftReminder.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -80
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Uploaded build $TARGET_BUILD; Apple processing is checked separately."
      - name: Remove local signing and model material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          rm -rf source/App/Resources/FighterPrivate source/build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-archive-identity
          path: promotion-archive.json
          if-no-files-found: warn

  apple-status:
    needs: [verify, testflight]
    if: >-
      always() && needs.verify.result == 'success' &&
      needs.testflight.result == 'success' && needs.testflight.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UPLOADED_THIS_RUN: ${{ needs.testflight.outputs.uploaded }}
    steps:
      - uses: actions/checkout@v5
      - name: Check Apple processing and save verified testing notes
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          export ASC_KEY_PATH="$KEY"
          python3 -m pip install --quiet --user --break-system-packages pyjwt cryptography
          ARGS=()
          if [ "$UPLOADED_THIS_RUN" = true ]; then ARGS+=(--uploaded); fi
          python3 .github/scripts/fighter_promote.py finish .github/releases/fighter-testflight.json "${ARGS[@]}"
      - name: Remove local Apple key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-apple-status
          path: promotion-status.json
          if-no-files-found: warn
