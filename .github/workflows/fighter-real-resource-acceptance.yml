name: Private fighter real-resource acceptance (unsigned only)
'on':
  workflow_dispatch:
    inputs:
      tooling_sha:
        description: Exact reviewed commit containing this workflow and helpers; must equal run SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: fighter-real-resource-acceptance
  cancel-in-progress: false
jobs:
  real_resources:
    if: github.repository == 'wuyong9494-lab/kriswu' && github.ref == 'refs/heads/codex/fighter-lab-compile-only-20261111' && inputs.tooling_sha
      == github.sha
    runs-on: macos-26
    timeout-minutes: 100
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      FIGHTER_PERSONAL_ASSETS: 'true'
      FIGHTER_ORIGINAL_ASSETS: 'true'
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.tooling_sha }}
        path: tooling
        persist-credentials: false
        lfs: false
        submodules: false
    - uses: actions/checkout@v5
      with:
        ref: d5ed4cdbf8cf6157c2c5bdb0d80139ed236ca4f6
        path: source
        persist-credentials: false
        lfs: false
        submodules: false
    - uses: actions/checkout@v5
      with:
        ref: 36878beef5d9c8d86193b7eea04e5e381042691d
        path: music-cipher
        persist-credentials: false
        lfs: false
        submodules: false
    - name: Initialize private evidence area
      run: |-
        umask 077
        mkdir -p fighter-evidence
        printf "%s\n" "source=d5ed4cdbf8cf6157c2c5bdb0d80139ed236ca4f6" > fighter-evidence/identity.txt
    - name: Stage verified private character
      env:
        FIGHTER_LIU_MODEL_KEY: ${{ secrets.FIGHTER_LIU_MODEL_KEY }}
      run: |-
        (
        brew install openssl@3
        python3 .github/scripts/fighter_private_model.py stage
        if [ "$FIGHTER_PERSONAL_ASSETS" = "true" ]; then
          python3 .github/scripts/fighter_sf3_assets.py
        fi
        if [ "$FIGHTER_ORIGINAL_ASSETS" = "true" ]; then
          python3 .github/scripts/fighter_sf3_assets.py --original-rig
          python3 .github/scripts/fighter_sf3_distinct.py
        fi

        ) > fighter-evidence/phase-4.log 2>&1
    - name: Authenticate and stage independently encrypted music
      env:
        FIGHTER_LIU_MODEL_KEY: ${{ secrets.FIGHTER_MUSIC_PACKAGE_KEY }}
      run: python3 ../tooling/.github/scripts/fighter_acceptance_music.py ../music-cipher . "$RUNNER_TEMP"
    - name: Select Xcode and generate existing app
      run: |-
        (
        sudo xcode-select -s /Applications/Xcode_26.6.app
        brew install xcodegen openssl@3
        python3 .github/scripts/build_identity.py
        # Use the App's existing demo path for the hosted unit tests, as the
        # UI tests already do. Production reminder permissions are unchanged.
        python3 - <<'PY'
        from pathlib import Path
        p = Path('project.yml')
        source = p.read_text()
        target = '    scheme:\n      testTargets:\n        - SiteTests'
        assert source.count(target) == 1
        p.write_text(source.replace(target, target + '\n      commandLineArguments:\n        "-demo": true'))
        PY
        xcodegen generate

        ) > fighter-evidence/phase-6.log 2>&1
    - name: Build native and UI test bundles
      id: test_build
      timeout-minutes: 15
      shell: bash -eo pipefail {0}
      run: |-
        (
        # Keep cold compilation outside the XCTest time budgets. Both schemes
        # are replayed below from these same Debug simulator products.
        for SCHEME in ShiftReminder ArenaFlow; do
          xcodebuild build-for-testing -project ShiftReminder.xcodeproj -scheme "$SCHEME" \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath fighter-native CODE_SIGNING_ALLOWED=NO 2>&1 | tee "fighter-build-$SCHEME.log"
        done

        ) > fighter-evidence/phase-7.log 2>&1
    - name: Verify music bytes inside compiled native app
      run: |
        python3 - <<'PYCODE'
        import hashlib, sys
        from pathlib import Path
        sys.path.insert(0, '../tooling/.github/scripts')
        import music_package
        app=Path('fighter-native/Build/Products/Debug-iphonesimulator/ShiftReminder.app')
        assert app.is_dir(), 'Compiled app missing'
        for name,size,sha in music_package.FILES:
            matches=list(app.rglob(name))
            assert len(matches)==1, 'Expected exactly one music/provenance resource in app'
            data=matches[0].read_bytes()
            assert len(data)==size and hashlib.sha256(data).hexdigest()==sha, 'Compiled resource identity mismatch'
        print('Verified all three pinned music resources in compiled native app')
        PYCODE
    - name: Prepare iPhone 17 Pro Max simulator
      id: simulator
      timeout-minutes: 20
      shell: bash -eo pipefail {0}
      run: |-
        (
        python3 -u .github/scripts/prepare_star_simulator.py 2>&1 | tee fighter-simulator.log
        python3 -u .github/scripts/prepare_star_simulator.py --ready --retry-cold-boot 2>&1 | tee -a fighter-simulator.log

        ) > fighter-evidence/phase-8.log 2>&1
    - name: Check interruption, input and SceneKit resource lifetime
      timeout-minutes: 25
      shell: bash -eo pipefail {0}
      run: |-
        (
        DEVICE=$(python3 -c "import json; print(json.load(open('star-test-device.json'))['udid'])")
        PERSONAL_TESTS=()
        if [ "$FIGHTER_PERSONAL_ASSETS" = "true" ]; then
          PERSONAL_TESTS=("-only-testing:SiteTests/DuelPersonalAssetTests")
        fi
        if [ "$FIGHTER_ORIGINAL_ASSETS" = "true" ]; then
          PERSONAL_TESTS+=("-only-testing:SiteTests/DuelOriginalRigAssetTests" "-only-testing:SiteTests/DuelOriginalRigAdapterTests" "-only-testing:SiteTests/DuelOriginalCombatTests" "-only-testing:SiteTests/DuelSourceControlsTests" "-only-testing:SiteTests/DuelSourceEffectsTests" "-only-testing:SiteTests/DuelWeaponEffectsTests" "-only-testing:SiteTests/DuelWeaponAssetTests" "-only-testing:SiteTests/DuelWeaponGameplayTests" "-only-testing:SiteTests/DuelShadowPresentationTests")
        fi
        xcodebuild test-without-building -project ShiftReminder.xcodeproj -scheme ShiftReminder \
          -configuration Debug -destination "id=$DEVICE" -parallel-testing-enabled NO \
          -only-testing:SiteTests/GLTFMaterialTests -only-testing:SiteTests/DuelLifecycleTests -only-testing:SiteTests/DuelCharacterTests \
          "${PERSONAL_TESTS[@]}" \
          -derivedDataPath fighter-native -resultBundlePath fighter-lifecycle.xcresult \
          CODE_SIGNING_ALLOWED=NO 2>&1 | tee fighter-lifecycle.log

        ) > fighter-evidence/phase-9.log 2>&1
    - name: Play both characters and restore portrait app
      if: ${{ !cancelled() && steps.test_build.outcome == 'success' && steps.simulator.outcome == 'success' }}
      timeout-minutes: 24
      shell: bash -eo pipefail {0}
      run: |-
        (
        DEVICE=$(python3 -c "import json; print(json.load(open('star-test-device.json'))['udid'])")
        FLOW_TESTS=("-only-testing:ArenaFlowTests/DuelFlowTests")
        if [ "$FIGHTER_ORIGINAL_ASSETS" = "true" ]; then
          FLOW_TESTS+=("-only-testing:ArenaFlowTests/DuelWeaponFlowTests")
        fi
        # One recording covers both the explicit legacy regression and the
        # new source-controls/equipped-character UI flow.
        # The complete native-motion directory is sealed with the portrait evidence below.
        bash .github/scripts/fighter_native_video.sh "$DEVICE" -- \
          xcodebuild test-without-building -project ShiftReminder.xcodeproj -scheme ArenaFlow \
          -configuration Debug -destination "id=$DEVICE" -parallel-testing-enabled NO \
          "${FLOW_TESTS[@]}" \
          -derivedDataPath fighter-native -resultBundlePath fighter-flow.xcresult \
          CODE_SIGNING_ALLOWED=NO 2>&1 | tee fighter-flow.log

        ) > fighter-evidence/phase-10.log 2>&1
    - name: Export rendered evidence
      if: always()
      timeout-minutes: 8
      shell: bash
      run: |-
        (
        failed=0
        for result in fighter-lifecycle fighter-flow; do
          if [ -d "$result.xcresult" ]; then
            mkdir -p "fighter-evidence/$result"
            if ! xcrun xcresulttool export attachments --path "$result.xcresult" --output-path "fighter-evidence/$result" >"fighter-export-$result.log" 2>&1; then
              echo "::warning::Could not export $result attachments; preserving diagnostic log"
              failed=1
            fi
          fi
        done
        exit "$failed"

        ) > fighter-evidence/phase-11.log 2>&1
    - name: Seal all private screenshots video and logs
      id: seal
      if: always()
      env:
        FIGHTER_LIU_MODEL_KEY: ${{ secrets.FIGHTER_MUSIC_PACKAGE_KEY }}
      run: |
        umask 077
        # No model, app, IPA, raw xcresult, raw log or screenshot is uploaded.
        for f in fighter-*.log star-test-device.json; do
          if [ -f "$f" ]; then cp "$f" fighter-evidence/; fi
        done
        python3 .github/scripts/fighter_evidence_archive.py fighter-evidence "$RUNNER_TEMP/acceptance-evidence.zip" >/dev/null
        python3 .github/scripts/fighter_private_model.py seal evidence "$RUNNER_TEMP/acceptance-evidence.zip" fighter-evidence.enc >/dev/null
        shasum -a 256 fighter-evidence.enc > fighter-evidence.enc.sha256
    - uses: actions/upload-artifact@v4
      if: always() && steps.seal.outcome == 'success'
      with:
        name: fighter-real-resource-evidence-encrypted
        path: |-
          source/fighter-evidence.enc
          source/fighter-evidence.enc.sha256
        retention-days: 3
        compression-level: 0
        if-no-files-found: error
    environment: fighter-private-assets
    defaults:
      run:
        working-directory: source
        shell: bash -eo pipefail {0}
