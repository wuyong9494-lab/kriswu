name: Private fighter real-resource acceptance (unsigned only)
'on':
  push:
    branches:
    - codex/fighter-lab-compile-only-20261111
    paths:
    - .github/workflows/fighter-real-resource-acceptance.yml
permissions:
  contents: read
concurrency:
  group: fighter-real-resource-acceptance
  cancel-in-progress: false
jobs:
  real_resources:
    if: github.repository == 'wuyong9494-lab/kriswu' && github.ref == 'refs/heads/codex/fighter-lab-compile-only-20261111'
      && github.event_name == 'push' && github.event.before == '3a2651a054cd8b54b96fcb92c6495185b5a956e6' && github.event.head_commit.message
      == 'Run approved grouped fighter visual and lifecycle acceptance'
    runs-on: macos-26
    timeout-minutes: 100
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      FIGHTER_PERSONAL_ASSETS: 'true'
      FIGHTER_ORIGINAL_ASSETS: 'true'
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        path: tooling
        persist-credentials: false
        lfs: false
        submodules: false
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        path: source
        persist-credentials: false
        lfs: false
        submodules: false
    - uses: actions/checkout@v5
      with:
        ref: 36878beef5d9c8d86193b7eea04e5e381042691d
        path: music-cipher
        persist-credentials: false
        lfs: false
        submodules: false
    - name: Initialize private evidence area
      run: 'umask 077

        mkdir -p fighter-evidence

        printf "%s\n" "source=${{ github.sha }}" > fighter-evidence/identity.txt'
    - name: Stage verified private character
      env:
        FIGHTER_LIU_MODEL_KEY: ${{ secrets.FIGHTER_LIU_MODEL_KEY }}
      run: "(\nbrew install openssl@3\npython3 .github/scripts/fighter_private_model.py stage\nif [ \"$FIGHTER_PERSONAL_ASSETS\"\
        \ = \"true\" ]; then\n  python3 .github/scripts/fighter_sf3_assets.py\nfi\nif [ \"$FIGHTER_ORIGINAL_ASSETS\" = \"\
        true\" ]; then\n  python3 .github/scripts/fighter_sf3_assets.py --original-rig\n  python3 .github/scripts/fighter_sf3_distinct.py\n\
        fi\n\n) > fighter-evidence/phase-4.log 2>&1"
    - name: Authenticate and stage independently encrypted music
      env:
        FIGHTER_LIU_MODEL_KEY: ${{ secrets.FIGHTER_MUSIC_PACKAGE_KEY }}
      run: python3 "$GITHUB_WORKSPACE/tooling/.github/scripts/fighter_acceptance_music.py" "$GITHUB_WORKSPACE/music-cipher"
        "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP"
    - name: Select Xcode and generate existing app
      run: '(

        sudo xcode-select -s /Applications/Xcode_26.6.app

        brew install xcodegen openssl@3

        python3 .github/scripts/build_identity.py

        # Use the App''s existing demo path for the hosted unit tests, as the

        # UI tests already do. Production reminder permissions are unchanged.

        python3 - <<''PY''

        from pathlib import Path

        p = Path(''project.yml'')

        source = p.read_text()

        target = ''    scheme:\n      testTargets:\n        - SiteTests''

        assert source.count(target) == 1

        p.write_text(source.replace(target, target + ''\n      commandLineArguments:\n        "-demo": true''))

        PY

        swift test --filter DuelLobbyFramingTests

        xcodegen generate


        ) > fighter-evidence/phase-6.log 2>&1'
    - name: Build native and UI test bundles
      id: test_build
      timeout-minutes: 15
      shell: bash -eo pipefail {0}
      run: "(\n# Keep cold compilation outside the XCTest time budgets. Both schemes\n# are replayed below from these same\
        \ Debug simulator products.\nfor SCHEME in ShiftReminder ArenaFlow; do\n  xcodebuild build-for-testing -project ShiftReminder.xcodeproj\
        \ -scheme \"$SCHEME\" \\\n    -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'\
        \ \\\n    -derivedDataPath fighter-native CODE_SIGNING_ALLOWED=NO 2>&1 | tee \"fighter-build-$SCHEME.log\"\ndone\n\
        \n) > fighter-evidence/phase-7.log 2>&1"
    - name: Verify music bytes inside compiled native app
      run: "python3 - <<'PYCODE'\nimport hashlib, sys\nfrom pathlib import Path\nsys.path.insert(0, '../tooling/.github/scripts')\n\
        import music_package\napp=Path('fighter-native/Build/Products/Debug-iphonesimulator/ShiftReminder.app')\nassert app.is_dir(),\
        \ 'Compiled app missing'\nfor name,size,sha in music_package.FILES:\n    matches=list(app.rglob(name))\n    assert\
        \ len(matches)==1, 'Expected exactly one music/provenance resource in app'\n    data=matches[0].read_bytes()\n   \
        \ assert len(data)==size and hashlib.sha256(data).hexdigest()==sha, 'Compiled resource identity mismatch'\nprint('Verified\
        \ all three pinned music resources in compiled native app')\nPYCODE\n"
    - name: Prepare iPhone 17 Pro Max simulator
      id: simulator
      timeout-minutes: 20
      shell: bash -eo pipefail {0}
      run: '(

        python3 -u .github/scripts/prepare_star_simulator.py 2>&1 | tee fighter-simulator.log

        python3 -u .github/scripts/prepare_star_simulator.py --ready --retry-cold-boot 2>&1 | tee -a fighter-simulator.log


        ) > fighter-evidence/phase-8.log 2>&1'
    - name: Check interruption, input and SceneKit resource lifetime
      timeout-minutes: 25
      shell: bash -eo pipefail {0}
      run: "(\nDEVICE=$(python3 -c \"import json; print(json.load(open('star-test-device.json'))['udid'])\")\nPERSONAL_TESTS=()\n\
        if [ \"$FIGHTER_PERSONAL_ASSETS\" = \"true\" ]; then\n  PERSONAL_TESTS=(\"-only-testing:SiteTests/DuelPersonalAssetTests\"\
        )\nfi\nif [ \"$FIGHTER_ORIGINAL_ASSETS\" = \"true\" ]; then\n  PERSONAL_TESTS+=(\"-only-testing:SiteTests/DuelOriginalRigAssetTests\"\
        \ \"-only-testing:SiteTests/DuelOriginalRigAdapterTests\" \"-only-testing:SiteTests/DuelOriginalCombatTests\" \"-only-testing:SiteTests/DuelSourceControlsTests\"\
        \ \"-only-testing:SiteTests/DuelSourceEffectsTests\" \"-only-testing:SiteTests/DuelWeaponEffectsTests\" \"-only-testing:SiteTests/DuelWeaponAssetTests\"\
        \ \"-only-testing:SiteTests/DuelWeaponGameplayTests\" \"-only-testing:SiteTests/DuelShadowPresentationTests\")\nfi\n\
        xcodebuild test-without-building -project ShiftReminder.xcodeproj -scheme ShiftReminder \\\n  -configuration Debug\
        \ -destination \"id=$DEVICE\" -parallel-testing-enabled NO \\\n  -only-testing:SiteTests/GLTFMaterialTests -only-testing:SiteTests/DuelLifecycleTests\
        \ -only-testing:SiteTests/DuelCharacterTests \\\n  \"${PERSONAL_TESTS[@]}\" \\\n  -derivedDataPath fighter-native\
        \ -resultBundlePath fighter-lifecycle.xcresult \\\n  CODE_SIGNING_ALLOWED=NO 2>&1 | tee fighter-lifecycle.log\n\n\
        ) > fighter-evidence/phase-9.log 2>&1"
    - name: Play both characters and restore portrait app
      if: ${{ !cancelled() && steps.test_build.outcome == 'success' && steps.simulator.outcome == 'success' }}
      timeout-minutes: 24
      shell: bash -eo pipefail {0}
      run: "(\nDEVICE=$(python3 -c \"import json; print(json.load(open('star-test-device.json'))['udid'])\")\nFLOW_TESTS=(\"\
        -only-testing:ArenaFlowTests/DuelFlowTests\")\nif [ \"$FIGHTER_ORIGINAL_ASSETS\" = \"true\" ]; then\n  FLOW_TESTS+=(\"\
        -only-testing:ArenaFlowTests/DuelWeaponFlowTests\")\nfi\n# One recording covers both the explicit legacy regression\
        \ and the\n# new source-controls/equipped-character UI flow.\n# The complete native-motion directory is sealed with\
        \ the portrait evidence below.\nbash .github/scripts/fighter_native_video.sh \"$DEVICE\" -- \\\n  xcodebuild test-without-building\
        \ -project ShiftReminder.xcodeproj -scheme ArenaFlow \\\n  -configuration Debug -destination \"id=$DEVICE\" -parallel-testing-enabled\
        \ NO \\\n  \"${FLOW_TESTS[@]}\" \\\n  -derivedDataPath fighter-native -resultBundlePath fighter-flow.xcresult \\\n\
        \  CODE_SIGNING_ALLOWED=NO 2>&1 | tee fighter-flow.log\n\n) > fighter-evidence/phase-10.log 2>&1"
    - name: Export rendered evidence
      if: always()
      timeout-minutes: 8
      shell: bash
      run: "(\nfailed=0\nfor result in fighter-lifecycle fighter-flow; do\n  if [ -d \"$result.xcresult\" ]; then\n    mkdir\
        \ -p \"fighter-evidence/$result\"\n    if ! xcrun xcresulttool export attachments --path \"$result.xcresult\" --output-path\
        \ \"fighter-evidence/$result\" >\"fighter-export-$result.log\" 2>&1; then\n      echo \"::warning::Could not export\
        \ $result attachments; preserving diagnostic log\"\n      failed=1\n    fi\n  fi\ndone\nexit \"$failed\"\n\n) > fighter-evidence/phase-11.log\
        \ 2>&1"
    - name: Seal bounded screenshots and failure summaries to private recipient
      id: seal
      if: always()
      run: "umask 077\npython3 - <<'PYCODE'\nimport hashlib, json, os, secrets, subprocess, sys, zipfile\nfrom pathlib import\
        \ Path\nfrom types import SimpleNamespace\nsys.path.insert(0, str(Path('../tooling/.github/scripts').resolve()))\n\
        import fighter_private_model as envelope\nfrom fighter_recover_screenshots import select, PUBLIC_KEY\nroot = Path('fighter-evidence')\n\
        root.mkdir(exist_ok=True)\n# Keep extraction diagnostics private. Failure to summarize is recorded rather\n# than\
        \ hiding the already produced compile/test logs.\nfor name in ['fighter-lifecycle', 'fighter-flow']:\n    result =\
        \ Path(name + '.xcresult')\n    if result.is_dir():\n        output = subprocess.run(['xcrun', 'xcresulttool', 'get',\
        \ 'test-results', 'summary', '--path', str(result)], stdout=subprocess.PIPE, stderr=subprocess.PIPE)\n        (root\
        \ / (name + '-summary.json')).write_bytes(output.stdout[:2*1024**2])\n        (root / (name + '-summary-status.txt')).write_text(str(output.returncode))\n\
        # Adapter lets the reviewed selector sample existing exported attachments\n# without creating or downloading a multi-gigabyte\
        \ intermediate archive.\nclass Folder:\n    def infolist(self):\n        return [SimpleNamespace(filename=str(f.relative_to(root)),\
        \ file_size=f.stat().st_size) for f in root.rglob('*') if f.is_file() and not f.is_symlink()]\n    def read(self,\
        \ info):\n        name = info if isinstance(info, str) else info.filename\n        file = (root / name).resolve()\n\
        \        if not file.is_relative_to(root.resolve()) or file.is_symlink(): raise ValueError('Unsafe evidence path')\n\
        \        return file.read_bytes()\nfolder=Folder()\nchosen, labels, manifests, images=select(folder)\nwork=Path(os.environ['RUNNER_TEMP'])/'grouped-fighter-small-evidence'\n\
        work.mkdir(exist_ok=False)\nclear=work/'sample.zip'\nentries=[]\nwith zipfile.ZipFile(clear, 'w', compression=zipfile.ZIP_DEFLATED)\
        \ as z:\n    for n, info in enumerate(chosen):\n        name=f'{n:02d}'+Path(info.filename).suffix\n        data=folder.read(info)\n\
        \        z.writestr('screenshots/'+name,data)\n        entries.append({'file':'screenshots/'+name,'source':info.filename,'label':labels[info.filename],'sha256':hashlib.sha256(data).hexdigest()})\n\
        \    z.writestr('selection.json',json.dumps({'run':os.environ['GITHUB_RUN_ID'],'source':os.environ['GITHUB_SHA'],'images':entries},ensure_ascii=False))\n\
        \    # At most 16 log tails, 256 KiB each, plus small xcresult summaries.\n    logs=sorted(root.glob('phase-*.log'))+sorted(Path('.').glob('fighter-*.log'))\n\
        \    for n, log in enumerate(logs[:16]):\n        with log.open('rb') as f:\n            f.seek(max(0,log.stat().st_size-262144));\
        \ data=f.read(262144)\n        z.writestr(f'logs/{n:02d}-{log.name}',data)\n    for file in sorted(root.glob('*-summary*')):\n\
        \        z.writestr('summaries/'+file.name,file.read_bytes()[:2*1024**2])\nif clear.stat().st_size > 350*1024**2:\
        \ raise ValueError('Bounded evidence exceeded cap')\nkey=secrets.token_bytes(32)\npublic=work/'recipient.public.pem';public.write_text(PUBLIC_KEY)\n\
        wrapped=subprocess.run(['openssl','pkeyutl','-encrypt','-pubin','-inkey',str(public),'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],input=key,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=True).stdout\n\
        os.environ['FIGHTER_LIU_MODEL_KEY']=key.hex()\nenvelope.seal_evidence_file(clear,Path('fighter-small-evidence.enc'))\n\
        Path('fighter-small-evidence.key.enc').write_bytes(wrapped)\nPath('fighter-small-evidence.SHA256SUMS').write_text(''.join(hashlib.sha256(Path(n).read_bytes()).hexdigest()+'\
        \  '+n+'\\n' for n in ['fighter-small-evidence.enc','fighter-small-evidence.key.enc']))\nprint('Bounded evidence encrypted;\
        \ no plaintext artifact or installation package published.')\nPYCODE"
    - uses: actions/upload-artifact@v4
      if: always() && steps.seal.outcome == 'success'
      with:
        name: fighter-grouped-small-evidence-encrypted
        path: 'source/fighter-small-evidence.enc

          source/fighter-small-evidence.key.enc

          source/fighter-small-evidence.SHA256SUMS'
        retention-days: 3
        compression-level: 0
        if-no-files-found: error
    environment: fighter-private-assets
    defaults:
      run:
        working-directory: source
        shell: bash -eo pipefail {0}
