name: Recover complete stored fighter base
run-name: Recover complete pinned pre-Stun base once

on:
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths:
      - .github/scripts/fighter_base_recovery.py
      - .github/scripts/test_fighter_base_recovery.py
      - .github/workflows/fighter-base-recovery.yml

permissions:
  contents: read

concurrency:
  group: fighter-complete-base-recovery-20261117
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' &&
      github.ref == 'refs/heads/codex/fighter-visual-acceptance-20261113-1200' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.head_commit.message == 'Recover exact stored 302 fighter base resources 20261117' &&
      github.event.deleted == false && github.event.forced == false
    environment: fighter-private-assets
    runs-on: macos-26
    timeout-minutes: 12
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      EXPECTED_RESOURCE_RECOVERY_HELPER_SHA256: "f1b7625ddca710f26a379bbddb4b67d4ef649b1eded2fce85349c7a6fe0ad8d6"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/fighter_base_recovery.py
            /.github/scripts/test_fighter_base_recovery.py
            /.github/workflows/fighter-base-recovery.yml
      - uses: actions/checkout@v5
        with:
          ref: 13e23f617d38180120f48870f206779e9d3c1d32
          path: recovery-source
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/fighter_private_model.py
            /.github/scripts/fighter_sf3_assets.py
            /.github/scripts/fighter_h17_d19_native.py
            /.github/scripts/fighter_shared_root_native.py
            /scripts/stage_h17_shared_root_release.py
            /scripts/stage_h17_floorfall_release.py
            /scripts/source_floorfall_audio.py
            /.github/private/fighter-h17-d19/
            /.github/private/fighter-h17-shared-root/
      - name: Select existing crypto tools and verify the bounded helper
        run: |
          if ! test -x /opt/homebrew/opt/openssl@3/bin/openssl; then brew install openssl@3; fi
          python3 -B -m unittest discover -s .github/scripts -p test_fighter_base_recovery.py -v
          python3 -B .github/scripts/fighter_base_recovery.py prepare
      - name: Authenticate and reconstruct all 302 pinned old base files
        env:
          FIGHTER_H17_D19_KEY: ${{ secrets.FIGHTER_H17_D19_KEY }}
        run: python3 -B .github/scripts/fighter_base_recovery.py stage
      - name: Seal the verified base to the pinned private recipient
        run: python3 -B .github/scripts/fighter_base_recovery.py seal
      - name: Remove temporary plaintext on every outcome
        if: always()
        run: python3 -B .github/scripts/fighter_base_recovery.py cleanup
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fighter-complete-base-recovery-${{ github.run_id }}-encrypted
          path: |
            ${{ runner.temp }}/fighter-base-recovery-20261117/published/recovered-inputs.cms
            ${{ runner.temp }}/fighter-base-recovery-20261117/published/sealed-recovery-report.json
            ${{ runner.temp }}/fighter-base-recovery-20261117/published/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
