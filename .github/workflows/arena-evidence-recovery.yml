name: Recover saved arena evidence
on:
  push:
    branches: [codex/arena-interface-next]
    paths: ['.github/workflows/arena-evidence-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          repository: wuyong9494-lab/kriswu
          run-id: 42143819665
          artifact-ids: 13470400968
          github-token: ${{ github.token }}
          path: recovered
          merge-multiple: true
      - name: Summarize validation stages without disclosing diagnostic payloads
        run: |
          python3 - <<'PYCODE'
          import pathlib, json
          # Output contains only fixed category names and aggregate counts.
          # Never print filenames, device identifiers, paths, log lines or crash payloads.
          patterns = {
              'compile_commands': 'SwiftCompile ',
              'link_commands': 'Ld ',
              'codesign_commands': 'CodeSign ',
              'build_succeeded': '** BUILD SUCCEEDED **',
              'test_suites_started': "Test Suite '",
              'test_cases_started': "Test Case '-[",
              'test_failed': '** TEST FAILED **',
              'test_succeeded': '** TEST SUCCEEDED **',
              'test_cancelled': '** TEST INTERRUPTED **',
              'runner_connection_failed': 'Failed to establish communication with the test runner',
              'simulator_boot': 'Booting',
              'simulator_boot_failed': 'Unable to boot',
              'launch_failed': 'Failed to launch',
              'timeout_mentions': 'timed out',
              'testing_started': 'Testing started',
              'testing_cancelled': 'Testing cancelled',
              'testing_failed': 'Testing failed',
              'destination_unavailable': 'Unable to find a destination',
              'compiler_errors': 'error:',
          }
          totals = {key:0 for key in patterns}
          count = 0
          for p in pathlib.Path('recovered').rglob('animation-tests.log'):
              raw = p.read_text(errors='replace')
              count += 1
              for key, pattern in patterns.items(): totals[key] += raw.count(pattern)
          print(json.dumps({'animation_log_count':count,'categories':totals},sort_keys=True))
          PYCODE
