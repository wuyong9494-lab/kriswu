name: Recover saved arena evidence
on:
  push:
    branches: [codex/arena-interface-next]
    paths: ['.github/workflows/arena-evidence-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          repository: wuyong9494-lab/kriswu
          run-id: 42139137538
          artifact-ids: 13466809702
          github-token: ${{ github.token }}
          path: recovered
          merge-multiple: true
      - name: Read saved crash and simulator diagnostics
        run: |
          python3 - <<'PYCODE'
          import pathlib, json
          for p in sorted(pathlib.Path('recovered').rglob('*')):
              if not p.is_file(): continue
              print('FILE', p.name, p.stat().st_size)
              raw = p.read_text(errors='replace')
              if p.suffix == '.ips':
                  lines = raw.splitlines()
                  try:
                      payload = json.loads('\n'.join(lines[1:]))
                      print(json.dumps({k:payload.get(k) for k in ['exception','termination','faultingThread','asi']},ensure_ascii=False))
                      images = payload.get('usedImages',[])
                      for thread in payload.get('threads',[]):
                          if not thread.get('triggered'): continue
                          for f in thread.get('frames',[])[:40]:
                              i = f.get('imageIndex',-1)
                              name = images[i].get('name') if 0 <= i < len(images) else None
                              print(name, f.get('symbol'), f.get('imageOffset'))
                  except (ValueError,TypeError):
                      print('Unrecognized crash format')
              elif p.suffix == '.log':
                  rows = [line for line in raw.splitlines() if any(s in line.lower() for s in ['error:', 'failed', 'fatal', 'ranger_original', 'abort', 'exception'])]
                  for line in rows[-80:]: print(line[:2000])
          PYCODE
