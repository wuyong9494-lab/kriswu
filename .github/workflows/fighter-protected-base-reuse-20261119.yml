name: Verify reusable fighter base in acceptance (no publication)
on:
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths: ['.github/workflows/fighter-protected-base-reuse-20261119.yml']

permissions:
  contents: read
concurrency:
  group: fighter-protected-base-reuse-20261119
  cancel-in-progress: false

jobs:
  resource-receipt:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' &&
      github.ref == 'refs/heads/codex/fighter-visual-acceptance-20261113-1200' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.before == 'fbe1f97b947df6936eb9a1721510e92a178fb543' &&
      github.event.head_commit.message == 'Verify reusable fighter base in protected acceptance' &&
      github.event.deleted == false && github.event.forced == false
    runs-on: macos-26
    timeout-minutes: 15
    environment: fighter-private-assets
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/recovery/fighter-base-reuse-20261119/
            /.github/workflows/fighter-protected-base-reuse-20261119.yml
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: 73a0cf1ef86e35f40ed99ed9cc0ec467f10f4826
          path: pinned-input
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/fighter_base_recovery.py
            /.github/scripts/fighter_private_model.py
            /.github/scripts/fighter_sf3_assets.py
            /.github/scripts/fighter_h17_d19_native.py
            /.github/scripts/fighter_shared_root_native.py
            /scripts/stage_h17_shared_root_release.py
            /scripts/stage_h17_floorfall_release.py
            /scripts/source_floorfall_audio.py
            /scripts/completion_native_preflight.py
            /.github/private/fighter-h17-d19/
            /.github/private/fighter-h17-shared-root/
            /.github/private/fighter-completion-20261117/completion-compiled-inventory.json
      - name: Verify commit scope and pinned inputs without a resource key
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = fbe1f97b947df6936eb9a1721510e92a178fb543
          test "$(git -C pinned-input rev-parse HEAD)" = 73a0cf1ef86e35f40ed99ed9cc0ec467f10f4826
          source_dir=.github/recovery/fighter-base-reuse-20261119
          filenames=(audit_fighter_resource_reuse.py run_fighter_protected_base_reuse.py verify_fighter_protected_base_reuse.py)
          diff -u <(printf '%s\n' "${filenames[@]/#/$source_dir/}" .github/workflows/fighter-protected-base-reuse-20261119.yml | LC_ALL=C sort) <(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)
          for file in "${filenames[@]}"; do
            test -f "$source_dir/$file" && test ! -L "$source_dir/$file" || exit 1
            test ! -e "pinned-input/scripts/$file" && test ! -L "pinned-input/scripts/$file" || exit 1
            install -m 600 "$source_dir/$file" "pinned-input/scripts/$file"
          done
          python3 -E -s -B pinned-input/scripts/run_fighter_protected_base_reuse.py --preflight
      - name: Authenticate and compare exact resources (metadata only)
        shell: bash
        env:
          FIGHTER_H17_D19_KEY: ${{ secrets.FIGHTER_H17_D19_KEY }}
        run: |
          umask 077
          python3 -E -s -B pinned-input/scripts/run_fighter_protected_base_reuse.py
