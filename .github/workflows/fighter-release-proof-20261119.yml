name: Verify one reconstructed fighter release descriptor
on:
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths: ['.github/workflows/fighter-release-proof-20261119.yml']
permissions:
  contents: read
concurrency:
  group: fighter-release-proof-20261119
  cancel-in-progress: false
jobs:
  release-receipt:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' &&
      github.ref == 'refs/heads/codex/fighter-visual-acceptance-20261113-1200' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.before == '135453277fb7a061e1eaffe26cd340cccf99ac63' &&
      github.event.head_commit.message == 'Run ordered fighter release verifier after preflight fix' &&
      github.event.deleted == false && github.event.forced == false
    runs-on: macos-26
    timeout-minutes: 10
    environment: fighter-private-assets
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/recovery/fighter-release-proof-20261119/
            /.github/workflows/fighter-release-proof-20261119.yml
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: 73a0cf1ef86e35f40ed99ed9cc0ec467f10f4826
          path: pinned-input
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/fighter_base_recovery.py
            /.github/scripts/fighter_shared_root_native.py
            /scripts/completion_native_preflight.py
            /.github/private/fighter-h17-shared-root/
            /.github/private/fighter-completion-20261117/completion-compiled-inventory.json
            /docs/acceptance/fighter-completion-native-plan-20261117.json
      - name: Check exact scope and encrypted source pins
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 135453277fb7a061e1eaffe26cd340cccf99ac63
          test "$(git -C pinned-input rev-parse HEAD)" = 73a0cf1ef86e35f40ed99ed9cc0ec467f10f4826
          d=.github/recovery/fighter-release-proof-20261119
          diff -u <(printf '%s\n' .github/workflows/fighter-release-proof-20261119.yml) <(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)
          PYTHONPATH="$PWD/pinned-input/.github/scripts:$PWD/pinned-input/scripts" python3 -s -B "$d/verify.py" pinned-input
      - name: Authenticate and compare the rebuilt descriptor
        shell: bash
        env:
          FIGHTER_H17_D19_KEY: ${{ secrets.FIGHTER_H17_D19_KEY }}
        run: |
          PYTHONPATH="$PWD/pinned-input/.github/scripts:$PWD/pinned-input/scripts" python3 -s -B .github/recovery/fighter-release-proof-20261119/verify.py pinned-input --protected
