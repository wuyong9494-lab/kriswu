name: Fighter display and network regression
'on':
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths: [App/**, Sources/**, Tests/**, .github/scripts/fighter_display_network_native.py, .github/workflows/fighter-display-network-20261116.yml]
permissions:
  contents: read
jobs:
  native:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: fighter-display-network-20261116
      cancel-in-progress: false
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Prepare exact source-only native regression
        run: python3 .github/scripts/fighter_display_network_native.py prepare
      - name: Run core four-hero and peripheral unit tests
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          swift test --filter "DuelMasterCompletionRuntimeTests|DuelDisplayRenderBudgetTests|DuelPhysicalInputTests|DuelMultiplayerSelectionTests|DuelGameTests"
      - name: Compile App widget and selected native tests once
        run: python3 .github/scripts/fighter_display_network_native.py build
      - name: Prepare installed iPhone 17 Pro Max simulator
        run: python3 .github/scripts/fighter_display_network_native.py simulator
      - name: Run 43 display lifecycle and network tests
        run: python3 .github/scripts/fighter_display_network_native.py test
      - name: Verify native results
        if: always()
        run: python3 .github/scripts/fighter_display_network_native.py export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fighter-display-network-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fighter-display-network-20261116/*.log
            ${{ runner.temp }}/fighter-display-network-20261116/*.json
          retention-days: 3
          if-no-files-found: error
      - name: Remove this run's simulator
        if: always()
        run: python3 .github/scripts/fighter_display_network_native.py cleanup
