name: Plan OCR baseline 516 validation

on:
  push:
    branches: ['codex/plan-ocr-probe']
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  primary-probe:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      PLAN_SOURCE: 154375598308d3583afcf32a9bb667d30967b7e9
      PLAN_WORKFLOW_SHA: ${{ github.workflow_sha }}
    concurrency:
      group: plan-primary-probe-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 154375598308d3583afcf32a9bb667d30967b7e9
      - name: Verify exact product source and record workflow provenance
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          expected = os.environ['PLAN_SOURCE']
          tested = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if tested != expected:
              raise SystemExit(f'Wrong product source: expected {expected}, checked out {tested}')
          manifest = {
              'schemaVersion': 1,
              'workflowSHA': os.environ['PLAN_WORKFLOW_SHA'],
              'triggerSHA': os.environ['GITHUB_SHA'],
              'workflowRef': os.environ.get('GITHUB_WORKFLOW_REF'),
              'runID': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'expectedSourceSHA': expected,
              'testedSourceSHA': tested,
              'testedSourceTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'testTarget': 'SiteTests/PlanReaderTests',
              'expectedTestMethods': 27,
              'fixtures': ['excel_photo', 'excel_scan', 'web_photo', 'long_table'],
          }
          Path('source-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "No Xcode 26 installation"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Generate app and test project
        run: |
          python3 scripts/assets/validate_ranger.py
          python3 scripts/assets/validate_ranger.py --face-sample
          brew install xcodegen
          GITHUB_SHA="$PLAN_SOURCE" python3 .github/scripts/build_identity.py
          python3 - <<'PY'
          import json, os, plistlib
          from pathlib import Path
          identity = plistlib.loads(Path('App/Info.plist').read_bytes())['ArenaCommitSHA']
          if identity != os.environ['PLAN_SOURCE']:
              raise SystemExit('Embedded app identity does not match the verified product source')
          path = Path('source-manifest.json')
          manifest = json.loads(path.read_text())
          manifest['embeddedBuildIdentitySHA'] = identity
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          print(f'Embedded product source: {identity}')
          PY
          xcodegen generate
      - name: Validate all product PlanReaderTests methods and four fixtures
        timeout-minutes: 30
        shell: bash -eo pipefail {0}
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          candidates = [(runtime, item) for runtime, items in sorted(devices.items(), reverse=True) if 'iOS' in runtime for item in items if item['name'].startswith('iPhone')]
          if not candidates:
              sys.exit('No available iPhone simulator')
          runtime, device = next((item for item in candidates if item[1]['name'] == 'iPhone 17 Pro Max'), candidates[0])
          with open('test-device.json', 'w') as stream:
              json.dump({'runtime': runtime, 'name': device['name'], 'udid': device['udid']}, stream, indent=2)
          print(device['udid'])")
          cat test-device.json
          TEST_TARGET=SiteTests/PlanReaderTests
          echo "测试范围：$TEST_TARGET"
          set +e
          xcodebuild test \
            -project ShiftReminder.xcodeproj \
            -scheme ShiftReminder \
            -destination "id=$DEVICE" \
            -only-testing:"$TEST_TARGET" \
            -derivedDataPath build \
            -resultBundlePath site-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          set -e
          grep -E "error:|Test Case .*(passed|failed)|XCTAssert|Executed" test.log || true
          grep -o "OCR|.*" test.log | sed 's/^/::notice::/' || true
          grep -oE "OCR(BOX|ROW|LAYOUT|STRIPS)\|.*" test.log || true
          if [ $status -ne 0 ]; then
            tail -80 test.log
            grep -E "error:" test.log | head -20 | sed 's/^/::error::/' || true
          fi
          exit $status
      - name: Save product source native validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-ocr-baseline-516-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            test.log
            test-device.json
            site-tests.xcresult
            source-manifest.json
          if-no-files-found: warn
