name: Approved Android official client (one launch; private evidence)

'on':
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths:
      - .github/workflows/fighter-android-official-client.yml
      - .github/scripts/fighter_android_official_client.py
      - .github/scripts/fighter_android_sdk_install.py
      - .github/scripts/test_fighter_android_official_client.py

permissions:
  contents: read

jobs:
  official-client:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' &&
      github.ref == 'refs/heads/codex/fighter-visual-acceptance-20261113-1200' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.head_commit.message == 'Repair official Android SDK common schema registration 20261115'
    concurrency:
      group: fighter-android-official-client-20261115
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_ANDROID_CLIENT_HELPER_SHA256: ba2f8b53e8c75d48a29635bdcfe80be075df394e699bcacedf6af8b212e51d67
      EXPECTED_ANDROID_SDK_HELPER_SHA256: bcf812b984dfc17d465875cbedcf4adcdd0bf01948da39d4cfacb38342ebbd6d
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/fighter-android-official-client.yml
            /.github/scripts/fighter_android_official_client.py
            /.github/scripts/fighter_android_sdk_install.py
            /.github/scripts/fighter_private_model.py
            /.github/public/fighter-pangu-native-20261114.public.pem
      - name: Install only the approved fixed SDK and observe one official client launch
        id: observe
        timeout-minutes: 32
        run: python3 .github/scripts/fighter_android_official_client.py run
      - name: Seal original bounded screenshots, logs and ordinary readable cache
        id: seal
        if: always()
        timeout-minutes: 3
        run: python3 .github/scripts/fighter_android_official_client.py seal
      - uses: actions/upload-artifact@v4
        if: always() && steps.seal.outcome == 'success'
        with:
          name: fighter-android-official-client-${{ github.run_id }}-${{ github.run_attempt }}-encrypted
          path: |
            ${{ runner.temp }}/fighter-android-official-client/published/fighter-android-official-client-evidence.enc
            ${{ runner.temp }}/fighter-android-official-client/published/fighter-android-official-client-evidence.key.enc
            ${{ runner.temp }}/fighter-android-official-client/published/fighter-android-official-client-evidence.SHA256SUMS
          if-no-files-found: error
          retention-days: 3
      - name: Remove only owned temporary Android data after sealing
        if: always()
        timeout-minutes: 2
        run: python3 .github/scripts/fighter_android_official_client.py cleanup
