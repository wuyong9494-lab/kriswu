name: Prepared Android crash diagnostics (environment review required)

'on':
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths:
      - .github/workflows/fighter-android-official-client.yml
      - .github/scripts/fighter_android_official_client.py
      - .github/scripts/fighter_android_sdk_install.py
      - .github/scripts/test_fighter_android_official_client.py
      - .github/scripts/test_fighter_android_apk_signature.py
      - .github/scripts/test_fighter_android_headless_probe.py
      - .github/scripts/test_fighter_android_install_abi.py
      - .github/scripts/test_fighter_android_terms_boundary.py
      - .github/scripts/test_fighter_android_terms_continuation.py
      - .github/scripts/test_fighter_android_system_crash.py

permissions:
  contents: read

jobs:
  official-client:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' &&
      github.ref == 'refs/heads/codex/fighter-visual-acceptance-20261113-1200' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.head_commit.message == 'Prepare bounded official client system crash evidence 20261115'
    # Publishing prepares a waiting run. Release only this concrete run after
    # explicit user authorization for the game Terms actions; environment
    # approval itself is not a legal-consent receipt.
    environment: fighter-private-assets
    concurrency:
      group: fighter-android-official-client-20261115
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FIGHTER_REVIEW_ENVIRONMENT: fighter-private-assets
      FIGHTER_GAME_TERMS_ACTION_SCOPE: one_checkbox_then_one_continue_for_official_19221
      EXPECTED_ANDROID_CLIENT_HELPER_SHA256: 561930bff1ade793f99b3a0fef4593cfa037ff77ea68a737c77c6672766e6d84
      EXPECTED_ANDROID_SDK_HELPER_SHA256: bcf812b984dfc17d465875cbedcf4adcdd0bf01948da39d4cfacb38342ebbd6d
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/fighter-android-official-client.yml
            /.github/scripts/fighter_android_official_client.py
            /.github/scripts/fighter_android_sdk_install.py
            /.github/scripts/fighter_private_model.py
            /.github/public/fighter-pangu-native-20261114.public.pem
      - name: Verify the fixed image decoder before any SDK or game download
        timeout-minutes: 2
        run: |
          terms_python_root="$RUNNER_TEMP/fighter-android-terms-python"
          test ! -e "$terms_python_root"
          python3.12 -m venv "$terms_python_root"
          cat > "$terms_python_root/pillow-requirements.txt" <<'REQUIREMENTS'
          Pillow @ https://files.pythonhosted.org/packages/e6/99/fdf65cc539e266ab93546c261bdf98411fe165c6e4e13f9dbf597097192b/pillow-13.0.0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl --hash=sha256:42d63be3af4f9b951b199b0a9d23365d37ab14687e6d77b74940432c8515c4ca
          REQUIREMENTS
          "$terms_python_root/bin/python" -m pip --isolated install --no-index --no-deps --only-binary=:all: --require-hashes --disable-pip-version-check -r "$terms_python_root/pillow-requirements.txt"
          "$terms_python_root/bin/python" -c 'import sys, PIL; assert sys.version_info[:2] == (3,12) and PIL.__version__ == "13.0.0"'
      - name: Observe one fixed client launch with the narrowly reviewed Terms actions
        id: observe
        timeout-minutes: 32
        run: '"$RUNNER_TEMP/fighter-android-terms-python/bin/python" .github/scripts/fighter_android_official_client.py run'
      - name: Seal original bounded screenshots, logs and ordinary readable cache
        id: seal
        if: always()
        timeout-minutes: 3
        run: python3 .github/scripts/fighter_android_official_client.py seal
      - uses: actions/upload-artifact@v4
        if: always() && steps.seal.outcome == 'success'
        with:
          name: fighter-android-official-client-${{ github.run_id }}-${{ github.run_attempt }}-encrypted
          path: |
            ${{ runner.temp }}/fighter-android-official-client/published/fighter-android-official-client-evidence.enc
            ${{ runner.temp }}/fighter-android-official-client/published/fighter-android-official-client-evidence.key.enc
            ${{ runner.temp }}/fighter-android-official-client/published/fighter-android-official-client-evidence.SHA256SUMS
          if-no-files-found: error
          retention-days: 3
      - name: Remove only owned temporary Android data after sealing
        if: always()
        timeout-minutes: 2
        run: python3 .github/scripts/fighter_android_official_client.py cleanup
