name: iOS

on:
  push:
    # A promotion signs an already checked source commit without creating another app build number.
    paths-ignore:
      - '.github/releases/**'
      - '.github/workflows/testflight-promote.yml'
      - '.github/scripts/asc_promote.py'
      - '.github/scripts/test_asc_promote.py'
  pull_request:
  workflow_dispatch:
    inputs:
      extras:
        description: 同时跑截图和模拟器检查（会再占 Mac）
        type: boolean
        default: false

permissions:
  contents: write

# 同一个分支连着推了几次：每一步只做最新的那次，前面还在排队、还在跑的同一步取消（省得排队等 Mac 机器）。
# 按步分开取消：写 TestFlight 测试说明要等苹果处理半小时，不跟着打包一起被取消

env:
  # 装 xcodegen 时不先更新整个 Homebrew（省一两分钟）
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    runs-on: macos-15
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      # 和传 TestFlight 用同一个 Xcode（26 或更新）：新系统才有的功能、新编译器才报的错在这一步就能发现
      - name: 选用最新的 Xcode（26 或更新）
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "::error::这台云端电脑上没有 Xcode 26"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: 核心逻辑单元测试
        shell: bash -eo pipefail {0}
        run: |
          swift test 2>&1 | tee swift-test.log || {
            # 失败的断言也作为注释显示在检查结果里，方便查看
            grep -E "error:" swift-test.log | head -20 | sed 's/^/::error::/'
            exit 1
          }

      - name: 生成 Xcode 工程
        run: |
          python3 scripts/assets/validate_ranger.py
          brew install xcodegen
          python3 .github/scripts/build_identity.py
          xcodegen generate

      - name: 编译 App（未签名）
        shell: bash -eo pipefail {0}
        run: |
          xcodebuild build \
            -project ShiftReminder.xcodeproj \
            -scheme ShiftReminder \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log
          # 这类警告意味着调用了不返回结果的旧接口，功能会悄悄失效，当作错误处理
          if grep -E "always fails|nearly matches optional requirement|no 'async' operations occur within 'await'" build.log; then
            echo "::error::发现可疑警告（见上），请修复"; exit 1
          fi
          # 并发检查的警告：列出来，修到没有
          grep -E "warning:.*(Sendable|concurrency|actor-isolated|nonisolated|data race|global actor|isolated|isolation)" build.log \
            | sort -u | tee concurrency.log | head -60 | sed 's/^/::warning::/' || true
          echo "并发警告 $(wc -l < concurrency.log) 条"
          test ! -s concurrency.log || { echo "::error::并发警告必须清零，不能仅记录后放行"; exit 1; }

      - name: 检查 App 名称（侧载工具注册 App ID 时只接受英文）
        run: |
          APP=build/Build/Products/Release-iphoneos/ShiftReminder.app
          for plist in "$APP/Info.plist" "$APP/PlugIns/ShiftWidget.appex/Info.plist"; do
            for k in CFBundleDisplayName CFBundleName; do
              v=$(/usr/libexec/PlistBuddy -c "Print :$k" "$plist")
              echo "$plist $k=$v"
              echo "$v" | LC_ALL=C grep -q '^[ -~]*$' || { echo "::error::$plist 的 $k 必须是英文"; exit 1; }
            done
          done
          cat "$APP/zh-Hans.lproj/InfoPlist.strings"
          # 图标要编进 App，否则主屏幕上是空白图标
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP/Info.plist"
          for x in A B C D E Rest; do
            /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundleAlternateIcons:Icon$x" "$APP/Info.plist" >/dev/null \
              || { echo "::error::缺少备用图标 Icon$x"; exit 1; }
          done
          ls "$APP"/AppIcon*.png "$APP/Assets.car"

      # 未签名的程序里没有 entitlements，SideStore 就不知道要开 App Group（小组件读不到数据）。
      # 用临时签名（ad-hoc）把 entitlements 写进去，SideStore 安装时会换成你自己的签名。
      - name: 写入 entitlements（ad-hoc 签名）
        run: |
          APP=build/Build/Products/Release-iphoneos/ShiftReminder.app
          # 侧载用的免费账号没有「通讯通知」权限，带着会装不上：去掉（TestFlight 版保留）
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.usernotifications.communication" App/ShiftReminder.entitlements || true
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.usernotifications.time-sensitive" App/ShiftReminder.entitlements || true
          codesign -f -s - --entitlements Widget/ShiftWidget.entitlements "$APP/PlugIns/ShiftWidget.appex"
          codesign -f -s - --entitlements App/ShiftReminder.entitlements "$APP"
          codesign -d --entitlements - "$APP"
          codesign -d --entitlements - "$APP/PlugIns/ShiftWidget.appex"

      - name: 打包未签名 IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ShiftReminder.app Payload/
          zip -qr ShiftReminder.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ShiftReminder-ipa
          path: ShiftReminder.ipa

      # 固定下载地址：https://github.com/<仓库>/releases/latest/download/ShiftReminder.ipa
      - name: 发布到 Releases（最新版）
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref != 'refs/heads/codex/arena-diagnostics-2' && github.ref != 'refs/heads/codex/arena-bush-stability' && github.ref != 'refs/heads/codex/arena-audio-performance'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="值班提醒 最新版（build ${{ github.run_number }}）"
          notes="未签名安装包，用 SideStore / AltStore / Sideloadly 安装。提交：${GITHUB_SHA::7}"
          # SideStore / AltStore 的「源」：在 SideStore › Sources 里添加
          # https://github.com/<仓库>/releases/latest/download/sidestore.json，以后在 SideStore 里直接安装、更新，不用手动下载 ipa
          SIZE=$(stat -f%z ShiftReminder.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE="https://github.com/${GITHUB_REPOSITORY}"
          cat > sidestore.json <<JSON
          {
            "name": "值班提醒",
            "identifier": "com.kriswu.shiftreminder.source",
            "subtitle": "值班提醒的安装源",
            "apps": [{
              "name": "值班提醒",
              "bundleIdentifier": "com.kriswu.shiftreminder",
              "developerName": "Kris Wu",
              "subtitle": "同步值班表、提醒、工作量",
              "localizedDescription": "同步值班网站的排班，按时提醒，统计工作量。",
              "iconURL": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/App/Assets.xcassets/AppIcon.appiconset/AppIcon.png",
              "tintColor": "4F46E5",
              "versions": [{
                "version": "1.0",
                "buildVersion": "${{ github.run_number }}",
                "date": "$DATE",
                "localizedDescription": "build ${{ github.run_number }}（${GITHUB_SHA::7}）",
                "downloadURL": "$BASE/releases/download/app/ShiftReminder.ipa",
                "size": $SIZE,
                "minOSVersion": "16.2"
              }],
              "appPermissions": {"entitlements": ["com.apple.security.application-groups"], "privacy": {}}
            }],
            "news": []
          }
          JSON
          python3 -m json.tool sidestore.json > /dev/null
          if gh release view app >/dev/null 2>&1; then
            # 原地替换安装包，不删发布：避免下载链接中途失效、下载到损坏的文件
            gh release upload app ShiftReminder.ipa --clobber
            gh release upload app sidestore.json --clobber
            git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA:refs/tags/app" || true
            gh release edit app --title "$title" --notes "$notes" --latest
          else
            gh release create app ShiftReminder.ipa sidestore.json --target "$GITHUB_SHA" --title "$title" --notes "$notes" --latest
          fi

  # 核心逻辑（解析、规则、推算）在 Linux 上也跑一遍：几分钟出结果，不用排队等 Mac 机器
  core-tests-linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    concurrency:
      group: linux-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - name: 核心逻辑单元测试（Linux）
        shell: bash
        run: |
          set -o pipefail
          swift --version
          swift test 2>&1 | tee swift-test.log || {
            grep -E "error:" swift-test.log | head -20 | sed 's/^/::error::/'
            exit 1
          }
          # 并发检查的警告（核心逻辑开了完整检查）：列出来，修到没有
          grep -E "warning:.*(Sendable|concurrency|actor-isolated|nonisolated|data race|global actor|isolated|isolation)" swift-test.log \
            | sort -u | tee concurrency.log | head -40 | sed 's/^/::warning::/' || true
          echo "并发警告 $(wc -l < concurrency.log) 条"
          test ! -s concurrency.log || { echo "::error::并发警告必须清零，不能仅记录后放行"; exit 1; }

  # 在 iPhone 模拟器里，用真正的网页浏览器对着仿值班网站跑同步流程（自动登录、电脑版页面、翻页、读各组说明）
  site-tests:
    runs-on: macos-15
    # Shared sync-service fixes can opt into the existing mock-site regression with [site-tests].
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.extras == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[site-tests]'))
    concurrency:
      group: site-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - name: 选用最新的 Xcode（26 或更新）
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "::error::这台云端电脑上没有 Xcode 26"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: 启动仿值班网站
        run: |
          nohup python3 Tests/MockSite/server.py 8765 > mock.log 2>&1 &
          sleep 2
          curl -sf "http://127.0.0.1:8765/api/expected?date=2026-01-01"

      - name: 生成 Xcode 工程
        run: |
          python3 scripts/assets/validate_ranger.py
          brew install xcodegen
          python3 .github/scripts/build_identity.py
          xcodegen generate

      - name: 模拟器里测试同步流程
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print(next(x['udid'] for k, v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "模拟器：$DEVICE"
          set +e
          xcodebuild test \
            -project ShiftReminder.xcodeproj \
            -scheme ShiftReminder \
            -destination "id=$DEVICE" \
            -only-testing:SiteTests \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          status=$?
          grep -E "error:|Test Case .*(passed|failed)|XCTAssert|Executed" test.log
          # 文字识别准确率（PlanReaderTests）：每种认法一行，做成注解
          grep -o "OCR|.*" test.log | sed 's/^/::notice::/' || true
          # 认出的每块字、拼出的每行（虚构数据），查准确率时看
          grep -oE "OCR(BOX|ROW|LAYOUT|STRIPS|IMG)\|.*" test.log || true
          if [ $status -ne 0 ]; then
            tail -80 test.log
            grep -E "error:" test.log | head -20 | sed 's/^/::error::/'
          fi
          exit $status

      - name: 网站访问记录
        if: always()
        run: tail -150 mock.log

  # 用虚构的演示数据（启动参数 -demo）在模拟器里打开各个页面截图，浅色、深色各一套，推到 screenshots 分支方便查看界面
  screenshots:
    runs-on: macos-15
    concurrency:
      group: screenshots-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.extras == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: 选用最新的 Xcode（26 或更新）
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "::error::这台云端电脑上没有 Xcode 26"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: 生成 Xcode 工程
        run: |
          python3 scripts/assets/validate_ranger.py
          brew install xcodegen
          python3 .github/scripts/build_identity.py
          xcodegen generate

      - name: 编译模拟器版本
        shell: bash -eo pipefail {0}
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          phones = [x for k, v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          selected = next((x for x in phones if x['name'] == 'iPhone 17 Pro Max'), phones[0])
          print(selected['udid'])")
          echo "DEVICE=$DEVICE" >> $GITHUB_ENV
          xcodebuild build \
            -project ShiftReminder.xcodeproj \
            -scheme ShiftReminder \
            -configuration Debug \
            -destination "id=$DEVICE" \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || { grep -E "error:" build.log | head -20; exit 1; }

      - name: 编译截图对比工具
        run: swiftc -O scripts/shotdiff.swift -o shotdiff

      - name: 截图
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/ShiftReminder.app
          ID=com.kriswu.shiftreminder
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          # 中文界面
          xcrun simctl spawn "$DEVICE" defaults write -g AppleLanguages -array zh-Hans
          xcrun simctl spawn "$DEVICE" defaults write -g AppleLocale zh_CN
          xcrun simctl shutdown "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          mkdir -p shots
          # 浅色截全部页面；深色只截几个常用的（看配色）。截一张要十几秒，全截两套要二十多分钟
          LIGHT="today calendar stats settings meeting meetingEdit meetingSource meetingTrend todayLayout years passPlan rulesExplain allFeatures game arena arenaPlay arenaShowdown arenaZone arenaBall arenaHeist arenaBoss arenaVersus arenaResult arenaStory arenaTalk arenaSeason tiles gameBoard gomoku gomokuBoard fairness week swap ledger year summary check rest forecast holidays patterns preview worklog manager role onboarding profiles rosterlog rules team leave automation backup diagnostics search day roster holidayduty"
          DARK="today calendar stats settings meeting day arenaPlay"
          for mode in light dark; do
            xcrun simctl ui "$DEVICE" appearance $mode
            if [ $mode = light ]; then SCREENS=$LIGHT; else SCREENS=$DARK; fi
            for s in $SCREENS; do
              xcrun simctl launch "$DEVICE" $ID -demo -screen $s > /dev/null
              # 乱斗对局要转横屏、第一次读 3D 模型和编译着色器，多等一会儿
              case $s in arena?*) sleep 9 ;; *) sleep 4 ;; esac
              xcrun simctl io "$DEVICE" screenshot "shots/$mode-$s.png" > /dev/null 2>&1
              xcrun simctl terminate "$DEVICE" $ID || true
              sips -s format jpeg -s formatOptions 70 -Z 1100 "shots/$mode-$s.png" --out "shots/$mode-$s.jpg" > /dev/null
              rm "shots/$mode-$s.png"
            done
          done
          # 长页面往下再截两屏（-scrollPage n：页面出来后往下翻 n 屏）；翻不动了（和上一屏一样）就不要这张
          xcrun simctl ui "$DEVICE" appearance light
          LONG="today settings allFeatures diagnostics rulesExplain meeting stats"
          for s in $LONG; do
            prev="shots/light-$s.jpg"
            for p in 1 2; do
              out="shots/light-$s-$((p + 1))"
              xcrun simctl launch "$DEVICE" $ID -demo -screen $s -scrollPage $p > /dev/null
              sleep 5
              xcrun simctl io "$DEVICE" screenshot "$out.png" > /dev/null 2>&1
              xcrun simctl terminate "$DEVICE" $ID || true
              sips -s format jpeg -s formatOptions 70 -Z 1100 "$out.png" --out "$out.jpg" > /dev/null
              rm "$out.png"
              if ./shotdiff same "$prev" "$out.jpg"; then rm "$out.jpg"; break; fi
              prev="$out.jpg"
            done
          done
          # iPad 上看几页（内容限宽居中）
          xcrun simctl shutdown "$DEVICE" || true
          IPAD=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print(next((x['udid'] for k, v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPad')), ''))")
          if [ -n "$IPAD" ]; then
            xcrun simctl boot "$IPAD" || true
            xcrun simctl bootstatus "$IPAD" -b
            xcrun simctl spawn "$IPAD" defaults write -g AppleLanguages -array zh-Hans
            xcrun simctl spawn "$IPAD" defaults write -g AppleLocale zh_CN
            xcrun simctl shutdown "$IPAD"
            xcrun simctl boot "$IPAD"
            xcrun simctl bootstatus "$IPAD" -b
            xcrun simctl install "$IPAD" "$APP"
            xcrun simctl status_bar "$IPAD" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            xcrun simctl ui "$IPAD" appearance light
            for s in today meeting settings years; do
              xcrun simctl launch "$IPAD" $ID -demo -screen $s > /dev/null
              sleep 5
              xcrun simctl io "$IPAD" screenshot "shots/ipad-$s.png" > /dev/null 2>&1
              xcrun simctl terminate "$IPAD" $ID || true
              sips -s format jpeg -s formatOptions 70 -Z 1400 "shots/ipad-$s.png" --out "shots/ipad-$s.jpg" > /dev/null
              rm "shots/ipad-$s.png"
            done
          fi
          ls -la shots

      - name: 截图时的闪退记录
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json, os
          files = sorted(glob.glob(os.path.expanduser('~/Library/Logs/DiagnosticReports/ShiftReminder*.ips')))
          if not files:
              print('截图时没有闪退')
          for path in files[:3]:
              print('==', os.path.basename(path))
              with open(path) as f:
                  f.readline()
                  try:
                      body = json.load(f)
                  except Exception as error:
                      print('读不出来', error)
                      continue
              for key in ('exception', 'termination', 'asi'):
                  if body.get(key):
                      print(key + ':', json.dumps(body[key], ensure_ascii=False)[:1500])
              images = body.get('usedImages', [])
              threads = body.get('threads', [])
              k = body.get('faultingThread', 0)
              if k < len(threads):
                  for i, frame in enumerate(threads[k].get('frames', [])[:40]):
                      index = frame.get('imageIndex', -1)
                      image = images[index].get('name', '?') if 0 <= index < len(images) else '?'
                      where = f" {frame.get('sourceFile')}:{frame.get('sourceLine')}" if frame.get('sourceFile') else ''
                      print(f"{i:2} {image} {frame.get('symbol', '?')}{where}")
          PY

      - name: 和上一版截图比
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 --branch screenshots "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prev || mkdir -p prev
          ./shotdiff compare shots prev shots/diff > shots/CHANGES.md
          cat shots/CHANGES.md
          cat shots/CHANGES.md >> "$GITHUB_STEP_SUMMARY"

      - name: 推到 screenshots 分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q
          git checkout -q -b screenshots
          git -c user.name=ci -c user.email=ci@example.com add .
          git -c user.name=ci -c user.email=ci@example.com commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots

  # 乱斗：模拟器里打开大厅和一局团战，截图留底。不上传。
  arena-look:
    runs-on: macos-15
    timeout-minutes: 30
    concurrency:
      group: arena-look-${{ github.ref }}
      # Preserve running visual evidence; a newer capture waits instead of cancelling it.
      cancel-in-progress: false
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.extras == 'true') || (github.event_name == 'push' && (github.ref == 'refs/heads/codex/arena-performance-1' || github.ref == 'refs/heads/codex/arena-diagnostics-2' || github.ref == 'refs/heads/codex/arena-bush-stability' || github.ref == 'refs/heads/codex/arena-audio-performance'))
    steps:
      - uses: actions/checkout@v5

      - name: 选用最新的 Xcode（26 或更新）
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "::error::这台云端电脑上没有 Xcode 26"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: 生成 Xcode 工程
        run: |
          python3 scripts/assets/validate_ranger.py
          brew install xcodegen
          python3 .github/scripts/build_identity.py
          xcodegen generate

      - name: 编译模拟器版本
        shell: bash -eo pipefail {0}
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          phones = [x for k, v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          selected = next((x for x in phones if x['name'] == 'iPhone 17 Pro Max'), phones[0])
          print(selected['udid'])")
          echo "DEVICE=$DEVICE" >> $GITHUB_ENV
          xcodebuild build \
            -project ShiftReminder.xcodeproj \
            -scheme ShiftReminder \
            -configuration Debug \
            -destination "id=$DEVICE" \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || { grep -E "error:" build.log | head -20; exit 1; }

      - name: 角色动画回归测试
        timeout-minutes: 10
        shell: bash -eo pipefail {0}
        run: |
          xcodebuild test \
            -project ShiftReminder.xcodeproj \
            -scheme ShiftReminder \
            -destination "id=$DEVICE" \
            -parallel-testing-enabled NO \
            -only-testing:SiteTests/ArenaAnimationTests \
            -only-testing:SiteTests/ArenaAudioTests \
            -only-testing:SiteTests/ArenaDiagnosticsTests \
            -only-testing:SiteTests/ArenaRangerTests \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO > animation-tests.log 2>&1 || { tail -100 animation-tests.log; exit 1; }
          grep -E "Test Case|Executed" animation-tests.log || true

      - name: 打开大厅和对局并截图
        # Build 397 spent ~6 min in cold simulator services before the first capture.
        # Ten still captures plus video now include two offline room states.
        # Build 409 reached video at 12 min; retain per-command limits and allow
        # final video flush and validation rather than cancelling at the old budget.
        timeout-minutes: 16
        run: |
          set -euo pipefail
          # XCTest may leave a cloned simulator running. Release it before capture.
          simctl() {
            python3 - "$@" <<'PYCODE'
          import subprocess, sys
          print("simctl", *sys.argv[1:], file=sys.stderr, flush=True)
          subprocess.run(["xcrun", "simctl", *sys.argv[1:]], check=True, timeout=150)
          PYCODE
          }
          APP=build/Build/Products/Debug-iphonesimulator/ShiftReminder.app
          ID=com.kriswu.shiftreminder
          swiftc .github/scripts/check_arena_capture.swift -o /tmp/check-arena-capture
          if /tmp/check-arena-capture Tests/Fixtures/arena-launch-placeholder.png; then
            echo "::error::截图检查误接受了 Build 398 的真实白屏"; exit 1
          fi
          wait_lobby() {
            python3 - "$CAPTURE_DATA/Documents/arena-capture-ready.json" "$1" <<'PYCODE'
          import json, pathlib, sys, time
          marker = pathlib.Path(sys.argv[1])
          expected = 'Rogue.glb' if sys.argv[2] == 'YES' else 'Ranger_Original.glb'
          deadline = time.monotonic() + 120
          while time.monotonic() < deadline:
              if marker.exists():
                  evidence = json.loads(marker.read_text())
                  if (evidence.get('scene') == 'rangerLobby' and evidence.get('asset') == expected
                          and evidence.get('viewWidth', 0) > evidence.get('viewHeight', 0) > 0):
                      print(evidence)
                      break
              time.sleep(0.5)
          else:
              raise SystemExit('Ranger lobby never completed model loading and camera layout')
          PYCODE
          }
          simctl shutdown all || true
          # XCTest has already installed/launched the app on DEVICE. Use a fresh
          # simulator for capture so its launch services and app data are isolated.
          SOURCE_DEVICE="$DEVICE"
          export SOURCE_DEVICE
          xcrun simctl list devices available -j > capture-devices.json
          python3 - <<'PYCODE' > capture-device.env
          import json, os, shlex
          devices = json.load(open('capture-devices.json'))['devices']
          for runtime, entries in devices.items():
              for device in entries:
                  if device['udid'] == os.environ['SOURCE_DEVICE']:
                      print('CAPTURE_RUNTIME=' + shlex.quote(runtime))
                      print('CAPTURE_TYPE=' + shlex.quote(device['deviceTypeIdentifier']))
          PYCODE
          source capture-device.env
          DEVICE=$(simctl create "Arena Capture" "$CAPTURE_TYPE" "$CAPTURE_RUNTIME")
          echo "CAPTURE_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          capture_cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              mkdir -p arena-diagnostics
              python3 - "$DEVICE" <<'PYCODE' > arena-diagnostics/launch-services.log 2>&1
          import subprocess, sys
          try:
              subprocess.run(['xcrun', 'simctl', 'spawn', sys.argv[1], 'log', 'show', '--last', '3m', '--style', 'compact', '--predicate', 'process == "ShiftReminder" OR process == "SpringBoard" OR process == "runningboardd"'], timeout=30)
          except subprocess.TimeoutExpired:
              print('Simulator log collection timed out')
          PYCODE
            fi
            simctl shutdown "$DEVICE" || true
            simctl delete "$DEVICE" || true
          }
          trap capture_cleanup EXIT
          simctl boot "$DEVICE"
          simctl bootstatus "$DEVICE" -b
          simctl install "$DEVICE" "$APP"
          mkdir -p shots
          CAPTURE_DATA=$(simctl get_app_container "$DEVICE" "$ID" data)
          before=$(find "$HOME/Library/Logs/DiagnosticReports" -name 'ShiftReminder*' 2>/dev/null | wc -l | tr -d ' ')
          # Early combat checks the asset before the clustered hits obscure it;
          # retain the crowded 1.2 s pair as separate readability evidence.
          for s in rangerLobbyBefore rangerLobbyAfter rangerBattleBefore rangerBattleAfter rangerCombatBefore rangerCombatAfter arenaExitDialog arenaDisconnectedDialog; do
            rm -f "$CAPTURE_DATA/Documents/arena-capture-ready.json"
            simctl terminate "$DEVICE" "$ID" >/dev/null 2>&1 || true
            TARGET_TIME=6
            if [ "$s" = rangerLobbyBefore ] || [ "$s" = rangerLobbyAfter ]; then
              LEGACY=NO; [ "$s" != rangerLobbyBefore ] || LEGACY=YES
              simctl launch "$DEVICE" "$ID" -demo -screen arena -arena.previewRanger YES -arena.rangerStill YES -arena.legacyRanger "$LEGACY"
              wait_lobby "$LEGACY"
              cp "$CAPTURE_DATA/Documents/arena-capture-ready.json" "shots/$s.json"
            else
              LEGACY=NO; [[ "$s" != *Before ]] || LEGACY=YES
              TARGET_TIME=0.25
              [[ "$s" != rangerCombat* ]] || TARGET_TIME=1.2
              DIALOG=none
              [ "$s" != arenaExitDialog ] || DIALOG=exit
              [ "$s" != arenaDisconnectedDialog ] || DIALOG=disconnect
              simctl launch "$DEVICE" "$ID" -demo -screen arenaBenchmark -arena.purpleSample YES -arena.snapshotTime "$TARGET_TIME" -arena.legacyRanger "$LEGACY" -arena.dialogPreview "$DIALOG"
            fi
            if [[ "$s" != rangerLobby* ]]; then
              python3 - "$CAPTURE_DATA/Documents/arena-capture-ready.json" "$TARGET_TIME" <<'PYCODE'
          import json, pathlib, sys, time
          marker = pathlib.Path(sys.argv[1])
          deadline = time.monotonic() + 120
          while time.monotonic() < deadline:
              if marker.exists():
                  evidence = json.loads(marker.read_text())
                  if float(sys.argv[2]) <= evidence['simulationTime'] < float(sys.argv[2]) + 0.04:
                      print(evidence)
                      break
              time.sleep(0.5)
          else:
              raise SystemExit('Snapshot did not reach the required simulation time; refusing mismatched capture')
          PYCODE
              cp "$CAPTURE_DATA/Documents/arena-capture-ready.json" "shots/$s.json"
            fi
            sleep 2
            for attempt in 1 2 3; do
              simctl io "$DEVICE" screenshot "shots/$s.png"
              if /tmp/check-arena-capture "shots/$s.png"; then break; fi
              [ "$attempt" -lt 3 ] || { echo "::error::截图仍是启动页或空白"; exit 1; }
              sleep 2
            done
          done
          # Offline fixtures render the production room view; no discovery or login.
          for s in arenaRoomReady arenaRoomWaiting; do
            simctl terminate "$DEVICE" "$ID" >/dev/null 2>&1 || true
            rm -f "$CAPTURE_DATA/Documents/arena-room-ready.json"
            simctl launch "$DEVICE" "$ID" -demo -screen "$s"
            python3 - "$CAPTURE_DATA/Documents/arena-room-ready.json" <<'PYCODE'
          import json, pathlib, sys, time
          marker = pathlib.Path(sys.argv[1])
          deadline = time.monotonic() + 60
          while time.monotonic() < deadline:
              if marker.exists():
                  evidence = json.loads(marker.read_text())
                  if evidence.get('scene') == 'arenaRoom' and evidence['viewWidth'] > evidence['viewHeight'] > 0:
                      break
              time.sleep(0.5)
          else:
              raise SystemExit('Offline room did not finish landscape layout')
          PYCODE
            cp "$CAPTURE_DATA/Documents/arena-room-ready.json" "shots/$s.json"
            sleep 2
            simctl io "$DEVICE" screenshot "shots/$s.png"
            /tmp/check-arena-capture "shots/$s.png"
          done
          # Record the implemented ranger in the real lobby, including automatic idle/shoot cycles.
          simctl terminate "$DEVICE" "$ID" >/dev/null 2>&1 || true
          rm -f "$CAPTURE_DATA/Documents/arena-capture-ready.json"
          simctl launch "$DEVICE" "$ID" -demo -screen arena -arena.previewRanger YES -arena.rangerStill NO -arena.legacyRanger NO
          wait_lobby NO
          python3 - "$DEVICE" <<'PYCODE'
          import signal, subprocess, sys, time
          video = subprocess.Popen(['xcrun', 'simctl', 'io', sys.argv[1], 'recordVideo', '--codec=h264', 'shots/rangerLobbyMotion.mp4'])
          try:
              time.sleep(12)
          finally:
              video.send_signal(signal.SIGINT)
              video.wait(timeout=20)
          if video.returncode != 0:
              raise SystemExit('Ranger lobby video capture failed')
          PYCODE
          simctl terminate "$DEVICE" "$ID" >/dev/null 2>&1 || true
          after=$(find "$HOME/Library/Logs/DiagnosticReports" -name 'ShiftReminder*' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$after" -gt "$before" ]; then
            echo "::error::模拟器里闪退了"
            find "$HOME/Library/Logs/DiagnosticReports" -name 'ShiftReminder*' -mmin -20
            exit 1
          fi
          for required in rangerLobbyBefore rangerLobbyAfter rangerBattleBefore rangerBattleAfter rangerCombatBefore rangerCombatAfter arenaExitDialog arenaDisconnectedDialog arenaRoomReady arenaRoomWaiting; do
            test -s "shots/$required.png"
            /tmp/check-arena-capture "shots/$required.png"
          done
          python3 - <<'PYCODE'
          import json
          for pair in ['rangerBattle', 'rangerCombat']:
              before = json.load(open('shots/' + pair + 'Before.json'))
              after = json.load(open('shots/' + pair + 'After.json'))
              assert before.pop('rangerAsset') == 'Rogue.glb'
              assert after.pop('rangerAsset') == 'Ranger_Original.glb'
              assert before == after, 'Different simulation state or camera in ' + pair
          PYCODE
          test -s shots/rangerLobbyMotion.mp4
          find shots -type f -name '*.png' -size -20k -print -exec false {} + || { echo "::error::截图是空的"; exit 1; }

      - name: 保存模拟器诊断
        if: always()
        run: |
          xcrun simctl list devices > simulator-devices.log
          mkdir -p arena-diagnostics
          cp animation-tests.log simulator-devices.log arena-diagnostics/ 2>/dev/null || true
          find "$HOME/Library/Logs/DiagnosticReports" -name 'ShiftReminder*.ips' -mmin -30 -exec cp {} arena-diagnostics/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-diagnostics
          path: arena-diagnostics

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-look
          path: shots
          if-no-files-found: warn

  # 手动发布或性能发布分支推送：编译、核心测试和本轮动画/截图检查通过后上传。
  # 需要在仓库 Settings › Secrets and variables › Actions 里配好苹果的密钥。没配就跳过。
  testflight:
    needs: [build, core-tests-linux, arena-look]
    if: >-
      always() && needs.build.result == 'success' && needs.core-tests-linux.result == 'success' &&
      (needs.arena-look.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.arena-look.result == 'skipped')) &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/arena-performance-1'))
    # 苹果要求上传的 App 用 iOS 26 SDK（Xcode 26 或更新）编译。macos-15 上也装了 Xcode 26（下面会挑最新的），
    # 而 macos-26 的机器经常排不上队（GitHub 提示容量不足，排 15 分钟就被取消）
    runs-on: macos-15
    concurrency:
      group: testflight-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
    env:
      # 值班网站地址：只在 TestFlight 版里内置（仓库是公开的，地址不写进代码，也不进公开的安装包）
      SITE_URL: ${{ secrets.SITE_URL }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: 检查密钥
        id: check
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::notice::还没配置 TestFlight 用的密钥，跳过上传"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.skip != '1'

      - name: 选用最新的 Xcode（26 或更新）
        if: steps.check.outputs.skip != '1'
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "::error::这台云端电脑上没有 Xcode 26"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: 生成 Xcode 工程
        if: steps.check.outputs.skip != '1'
        run: |
          brew install xcodegen
          python3 .github/scripts/build_identity.py
          xcodegen generate

      - name: 写入 App Store Connect 密钥
        if: steps.check.outputs.skip != '1'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          grep -q "BEGIN PRIVATE KEY" "$KEY" || { echo "::error::ASC_KEY_P8 不是 .p8 文件的内容（应以 -----BEGIN PRIVATE KEY----- 开头）"; exit 1; }
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: 清理 CI 以前留下的开发证书（苹果限制数量，满了就打不了包）
        if: steps.check.outputs.skip != '1'
        run: |
          python3 -m pip install --quiet --user --break-system-packages pyjwt cryptography || python3 -m pip install --quiet --user pyjwt cryptography
          python3 .github/scripts/asc_dev_certs.py cleanup || echo "::warning::清理开发证书失败，继续打包"

      - name: 在 App Store Connect 里打开 Game Center（小游戏的远程对战、轮流下用；已经开了就跳过）
        if: steps.check.outputs.skip != '1'
        env:
          BUNDLE_ID: com.kriswu.shiftreminder
        run: python3 .github/scripts/asc_game_center.py || echo "::warning::打开 Game Center 失败，继续打包"

      - name: 打包（自动签名）
        if: steps.check.outputs.skip != '1'
        shell: bash -eo pipefail {0}
        run: |
          xcodebuild archive \
            -project ShiftReminder.xcodeproj \
            -scheme ShiftReminder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ShiftReminder.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEFAULT_SITE_URL="$SITE_URL" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tail -80

      - name: 上传到 TestFlight
        id: upload
        if: steps.check.outputs.skip != '1'
        shell: bash -eo pipefail {0}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ShiftReminder.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -80
          echo "::notice::已上传 build ${{ github.run_number }}，App Store Connect 处理完（一般 5–30 分钟）后在 TestFlight 里就能装"
          echo "uploaded=1" >> "$GITHUB_OUTPUT"

      - name: 吊销这次新建的开发证书
        if: always() && steps.check.outputs.skip != '1'
        run: |
          SERIALS=$(security find-certificate -a -c "Apple Development" -p 2>/dev/null \
            | awk '/BEGIN CERT/{n++} {print > ("/tmp/cert" n ".pem")}' ; for f in /tmp/cert*.pem; do [ -s "$f" ] && openssl x509 -in "$f" -noout -serial | cut -d= -f2; done)
          python3 .github/scripts/asc_dev_certs.py cleanup $SERIALS || echo "::warning::吊销开发证书失败"

  # 把「这版改了什么」写进 TestFlight 的测试说明（装之前就能看到）。
  # 苹果处理上传的 build 要几分钟到半小时，在便宜的 Linux 机器上等，不占 Mac 机器
  whats-new:
    needs: testflight
    if: needs.testflight.outputs.uploaded == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # 一个一个来（不取消）：上一版的说明写完，下一版再算从哪开始
    concurrency:
      group: whats-new-${{ github.ref }}
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: com.kriswu.shiftreminder
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 200

      - name: 整理这版改了什么
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 从上一次写成了测试说明的那一版以后的提交里，找以「更新说明：」开头的行
          PREV=""
          for id in $(gh run list --workflow ios.yml --branch "$GITHUB_REF_NAME" --limit 20 --json databaseId --jq '.[].databaseId'); do
            [ "$id" -ge "$GITHUB_RUN_ID" ] && continue
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '.jobs[] | select(.name=="whats-new") | .conclusion' 2>/dev/null || true)
            if [ "$ok" = "success" ]; then PREV=$(gh run view "$id" --json headSha --jq .headSha); break; fi
          done
          echo "上一次写过说明的提交：${PREV:-没有}"
          if [ -n "$PREV" ] && git merge-base --is-ancestor "$PREV" HEAD 2>/dev/null; then RANGE="$PREV..HEAD"; else RANGE="-1"; fi
          # 「（无用户可见变化）」这种整句括起来的不写进去
          git log --format=%B $RANGE | sed -nE 's/^更新说明(：|:)[[:space:]]*//p' | grep -v '^（.*）$' | awk 'NF && !seen[$0]++' > notes.txt || true
          [ -s notes.txt ] || git log --format=%s $RANGE | head -8 > notes.txt
          cat notes.txt

      - name: 写入 TestFlight 测试说明
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          export ASC_KEY_PATH="$KEY"
          python3 -m pip install --quiet --user --break-system-packages pyjwt cryptography || python3 -m pip install --quiet --user pyjwt cryptography
          python3 .github/scripts/asc_whats_new.py "${{ github.run_number }}" notes.txt

