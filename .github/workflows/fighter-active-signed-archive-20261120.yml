name: Verify active fighter signed device archive
on:
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths: ['.github/workflows/fighter-active-signed-archive-20261120.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: testflight-com-kriswu-shiftreminder
  cancel-in-progress: false
jobs:
  signed-archive-no-upload:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' &&
      github.ref == 'refs/heads/codex/fighter-visual-acceptance-20261113-1200' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.before == '7f222b0d7a9249178c12eea96769c94771b86054' &&
      github.event.head_commit.message == 'Verify active fighter signed device archive' &&
      github.event.deleted == false && github.event.forced == false
    runs-on: macos-26
    timeout-minutes: 110
    environment: fighter-private-assets
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/recovery/
            /.github/private/rift-active-local-*.cms.part
            /.github/workflows/fighter-active-signed-archive-20261120.yml
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: 73a0cf1ef86e35f40ed99ed9cc0ec467f10f4826
          path: pinned-input
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Resolve the runner-owned temporary area
        shell: bash
        run: |
          set -euo pipefail
          root="$(cd -- "$RUNNER_TEMP" && pwd -P)"
          test -n "$root"
          physical="$(mktemp -d "$root/rift-active.XXXXXX")"
          chmod 700 "$physical"
          printf '%s\n' "RIFT_ACTIVE_TMP=$physical" "TMPDIR=$physical" >> "$GITHUB_ENV"
      - name: Review exact path set, source patch and native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(cd -- "$RIFT_ACTIVE_TMP" && pwd -P)" = "$RIFT_ACTIVE_TMP"
          test "$TMPDIR" = "$RIFT_ACTIVE_TMP"
          test "$(git rev-parse HEAD^)" = 7f222b0d7a9249178c12eea96769c94771b86054
          test "$(git -C pinned-input rev-parse HEAD)" = 73a0cf1ef86e35f40ed99ed9cc0ec467f10f4826
          d=.github/recovery/fighter-signed-archive-20261120
          diff -u <(printf '%s\n' '.github/recovery/fighter-signed-archive-20261120/package-check-support.patch' '.github/recovery/fighter-signed-archive-20261120/production-source.patch' '.github/recovery/fighter-signed-archive-20261120/verify_candidate_archive.py' '.github/workflows/fighter-active-signed-archive-20261120.yml') <(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)
          printf '%s  %s\n' c6c0ef334cff39e5b8704c116d1650337e7a4e8f147bc5130538f1726c49e711 "$d/package-check-support.patch" | shasum -a 256 -c
          git -C pinned-input apply --check "$PWD/$d/package-check-support.patch"
          git -C pinned-input apply "$PWD/$d/package-check-support.patch"
          printf '%s  %s\n' d7921fa6f7b01cd1a9aedb168ea68dca96aeddbec2dbff7b94d2f821f11a3a13 "$d/production-source.patch" | shasum -a 256 -c
          git -C pinned-input apply --check "$PWD/$d/production-source.patch"
          git -C pinned-input apply "$PWD/$d/production-source.patch"
          printf '%s  %s\n' 39d10431bb07e3cf06d086331b2ea00c6c94dc160c121851ff1b93b9d735bc70 "$d/verify_candidate_archive.py" | shasum -a 256 -c
          test -x /Applications/Xcode_26.6.app/Contents/Developer/usr/bin/xcodebuild || test -d /Applications/Xcode_26.6.app/Contents/Developer
          command -v xcodegen >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen --version | grep -E '(^|[^0-9.])2\.46\.0([^0-9.]|$)'
          python3 -m venv "$RIFT_ACTIVE_TMP/active-venv"
          printf '%s\n' 'numpy==2.3.5 --hash=sha256:ee3888d9ff7c14604052b2ca5535a30216aa0a58e948cdd3eeb8d3415f638769 --hash=sha256:612a95a17655e213502f60cfb9bf9408efdc9eb1d5f50535cc6eb365d11b42b5' > "$RIFT_ACTIVE_TMP/active-requirements.txt"
          "$RIFT_ACTIVE_TMP/active-venv/bin/python" -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes --no-deps -r "$RIFT_ACTIVE_TMP/active-requirements.txt"
      - name: Download the previously pinned encrypted recipient artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          gh api --method GET repos/wuyong9494-lab/kriswu/actions/artifacts/14303639959/zip > "$RIFT_ACTIVE_TMP/active-recipient.zip"
      - name: Authenticate and assemble all 539 active resources
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
          FIGHTER_H17_D19_KEY: ${{ secrets.FIGHTER_H17_D19_KEY }}
          FIGHTER_LIU_MODEL_KEY: ${{ secrets.FIGHTER_LIU_MODEL_KEY }}
          FIGHTER_PRESENTATION_KEY: ${{ secrets.FIGHTER_PRESENTATION_KEY }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/openssl@3/bin:/usr/local/opt/openssl@3/bin:$PATH"
          r="$PWD/.github/recovery"
          a="$r/fighter-active-native-20261119"
          export PYTHONPATH="$a:$r/fighter-final-catalog-20261119:$r/fighter-sun-tracks-20261119:$r/fighter-sun-20261119:$r/fighter-serpent-20261119:$r/fighter-base-reuse-20261119:$r/fighter-four-packs-20261119:$r/fighter-release-proof-20261119:$PWD/pinned-input/.github/scripts:$PWD/pinned-input/scripts"
          "$RIFT_ACTIVE_TMP/active-venv/bin/python" -s -B "$a/stage_protected_active.py" pinned-input .github/private "$a" "$RIFT_ACTIVE_TMP/active-recipient.zip" pinned-input/App/Resources/FighterPrivate --protected
      - name: Check current build number and validate signed device archive
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "$RIFT_ACTIVE_TMP/signed-device.XXXXXX")"
          cleanup() { rm -rf -- "$work"; }
          trap cleanup EXIT
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ && "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ && -n "$ASC_ISSUER_ID" ]]
          key="$work/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          unset ASC_KEY_P8
          grep -q 'BEGIN PRIVATE KEY' "$key"
          export ASC_KEY_PATH="$key"
          py="$RIFT_ACTIVE_TMP/active-venv/bin/python"
          "$py" -m pip --isolated install --quiet --only-binary=:all: 'PyJWT[crypto]==2.10.1'
          # Read only. The previous verified build was 706; also verify the candidate isn't already present.
          build="$(PYTHONPATH="$PWD/.github/scripts" "$py" - <<'PYCODE'
          from asc_whats_new import call
          from urllib.parse import urlencode
          import re
          try:
              apps=call("GET", "/apps?"+urlencode({"filter[bundleId]":"com.kriswu.shiftreminder"}))["data"]
              assert len(apps)==1
              app=apps[0]["id"]
              values=call("GET","/builds?"+urlencode({"filter[app]":app,"sort":"-uploadedDate","limit":200,"fields[builds]":"version"}))["data"]
              assert values
              versions=[v["attributes"]["version"] for v in values]
              assert all(re.fullmatch(r"[1-9][0-9]{0,8}",v) for v in versions)
              build=str(max([706]+[int(v) for v in versions])+1)
              assert not call("GET","/builds?"+urlencode({"filter[app]":app,"filter[version]":build,"limit":1}))["data"]
              print(build)
          except Exception:
              raise SystemExit("App Store Connect build check failed; no archive or upload")
          PYCODE
          )"
          [[ "$build" =~ ^[1-9][0-9]{0,8}$ ]]
          base="$PWD/pinned-input"
          verifier="$PWD/.github/recovery/fighter-signed-archive-20261120/verify_candidate_archive.py"
          test -d "$base/App/Resources/FighterPrivate"
          export USER="$(id -un)"
          cd "$base"
          xcodegen generate --spec "$base/project.yml" --project "$base"
          if ! /usr/bin/xcodebuild archive -project ShiftReminder.xcodeproj -scheme ShiftReminder \
            -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$work/derived" \
            -archivePath "$work/ShiftReminder.xcarchive" -allowProvisioningUpdates \
            -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic DEFAULT_SITE_URL="$SITE_URL" \
            MARKETING_VERSION=1.2 CURRENT_PROJECT_VERSION="$build" \
            FIGHTER_ASSET_RELEASE_SHA256=527e0195b7911e5b532aec92c37057f36a633952768670518565bde65605cbd3 \
            FIGHTER_XUXIAO_PROFILE_SHA256= L12_INTERNAL_PREVIEW_CONDITION= >"$work/archive.log" 2>&1; then
              "$py" - "$work/archive.log" <<'PYCODE'
          from pathlib import Path
          import json, sys
          log=Path(sys.argv[1]).read_text(errors="replace").lower()
          codes=[k for k,p in {"signing":"provisioning profile","swift-compile":"swiftcompile","archive-failed":"** archive failed **"}.items() if p in log]
          print(json.dumps({"signedDeviceArchive":False,"archiveFailureCategories":codes,"uploadPerformed":False}))
          PYCODE
              exit 1
          fi
          PYTHONPATH="$base/scripts" "$py" -s -B "$verifier" "$base" "$work/ShiftReminder.xcarchive" "$build"
      - name: Remove local staged assets
        if: always()
        shell: bash
        run: |
          if [ -n "${RIFT_ACTIVE_TMP:-}" ]; then rm -f -- "$RIFT_ACTIVE_TMP/active-recipient.zip"; fi
          rm -rf -- pinned-input/App/Resources/FighterPrivate pinned-input/Tests/PrivateResourceValidation
          if [ -n "${RIFT_ACTIVE_TMP:-}" ] && [[ "$RIFT_ACTIVE_TMP" == "$RUNNER_TEMP"/rift-active.* || "$RIFT_ACTIVE_TMP" == "$(cd -- "$RUNNER_TEMP" && pwd -P)"/rift-active.* ]]; then rm -rf -- "$RIFT_ACTIVE_TMP"; fi
