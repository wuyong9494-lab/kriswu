name: Prepare protected fighter integration recipient
run-name: Prepare one resource-only native validation recipient

on:
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths:
      - .github/scripts/fighter_integration_recipient.py
      - .github/scripts/test_fighter_integration_recipient.py
      - .github/workflows/fighter-integration-recipient.yml

permissions:
  contents: read

concurrency:
  group: fighter-integration-recipient-20261117
  cancel-in-progress: false

jobs:
  recipient:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' &&
      github.ref == 'refs/heads/codex/fighter-visual-acceptance-20261113-1200' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.head_commit.message == 'Prepare protected fighter integration recipient 20261117' &&
      github.event.deleted == false && github.event.forced == false
    environment: fighter-private-assets
    runs-on: macos-26
    timeout-minutes: 6
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      EXPECTED_RECIPIENT_HELPER_SHA256: '710a35589195f4a2a5f04315ff02eb392cc5bfed43507a6a7e57f13e528bdc27'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/fighter_integration_recipient.py
            /.github/scripts/test_fighter_integration_recipient.py
            /.github/workflows/fighter-integration-recipient.yml
      - name: Verify exact resource-only preparation scope
        run: |
          if ! test -x /opt/homebrew/opt/openssl@3/bin/openssl; then brew install openssl@3; fi
          python3 -B -m unittest discover -s .github/scripts -p test_fighter_integration_recipient.py -v
          python3 -B .github/scripts/fighter_integration_recipient.py prepare
      - name: Create a public recipient protected by the existing resource key
        env:
          FIGHTER_H17_D19_KEY: ${{ secrets.FIGHTER_H17_D19_KEY }}
        run: python3 -B .github/scripts/fighter_integration_recipient.py generate
      - name: Remove temporary plaintext key on every outcome
        if: always()
        run: python3 -B .github/scripts/fighter_integration_recipient.py cleanup
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fighter-native-recipient-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fighter-integration-recipient-20261117/published/recipient-public.crt
            ${{ runner.temp }}/fighter-integration-recipient-20261117/published/recipient-private.pkcs8.enc
            ${{ runner.temp }}/fighter-integration-recipient-20261117/published/recipient-report.json
          retention-days: 3
          if-no-files-found: error
