name: Correct frozen GamesHome byte identity for protected Xu qualification
on:
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths: ['.github/workflows/fighter-xuxiao-protected-qualification-20261120.yml']
permissions:
  contents: read
concurrency:
  group: fighter-xu-preview-539
  cancel-in-progress: false
jobs:
  unsigned-xu-preview-two-devices:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' &&
      github.ref == 'refs/heads/codex/fighter-visual-acceptance-20261113-1200' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.before == '4b4afa46ba1e905075a200cae8e4d807427f1540' &&
      github.event.head_commit.message == 'Correct frozen GamesHome byte identity for protected Xu qualification' &&
      github.event.deleted == false && github.event.forced == false
    runs-on: macos-26
    timeout-minutes: 110
    environment: fighter-private-assets
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/recovery/
            /.github/private/rift-active-local-*.cms.part
            /.github/workflows/fighter-xuxiao-protected-qualification-20261120.yml
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: 73a0cf1ef86e35f40ed99ed9cc0ec467f10f4826
          path: pinned-input
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Resolve the runner-owned temporary area
        shell: bash
        run: |
          set -euo pipefail
          root="$(cd -- "$RUNNER_TEMP" && pwd -P)"
          test -n "$root"
          physical="$(mktemp -d "$root/rift-active.XXXXXX")"
          chmod 700 "$physical"
          printf '%s\n' "RIFT_ACTIVE_TMP=$physical" "TMPDIR=$physical" >> "$GITHUB_ENV"
      - name: Review exact path set, source patch and native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(cd -- "$RIFT_ACTIVE_TMP" && pwd -P)" = "$RIFT_ACTIVE_TMP"
          test "$TMPDIR" = "$RIFT_ACTIVE_TMP"
          test "$(git rev-parse HEAD^)" = 4b4afa46ba1e905075a200cae8e4d807427f1540
          test "$(git -C pinned-input rev-parse HEAD)" = 73a0cf1ef86e35f40ed99ed9cc0ec467f10f4826
          d=.github/recovery/fighter-signed-archive-20261120
          diff -u <(printf '%s\n' '.github/recovery/fighter-xuxiao-protected-qualification-20261120/verify_xuxiao_qualified_ui.py' '.github/workflows/fighter-xuxiao-protected-qualification-20261120.yml') <(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)
          printf '%s  %s\n' c6c0ef334cff39e5b8704c116d1650337e7a4e8f147bc5130538f1726c49e711 "$d/package-check-support.patch" | shasum -a 256 -c
          git -C pinned-input apply --check "$PWD/$d/package-check-support.patch"
          git -C pinned-input apply "$PWD/$d/package-check-support.patch"
          printf '%s  %s\n' d7921fa6f7b01cd1a9aedb168ea68dca96aeddbec2dbff7b94d2f821f11a3a13 "$d/production-source.patch" | shasum -a 256 -c
          git -C pinned-input apply --check "$PWD/$d/production-source.patch"
          git -C pinned-input apply "$PWD/$d/production-source.patch"
          printf '%s  %s\n' 39d10431bb07e3cf06d086331b2ea00c6c94dc160c121851ff1b93b9d735bc70 "$d/verify_candidate_archive.py" | shasum -a 256 -c
          printf '%s  %s\n' 143ff703ee531081a663d51f8fb728ad758ddd7c435ae3287ee24ed40b60bc0b "$PWD/.github/recovery/fighter-xuxiao-internal-preview-20261120/xuxiao-practice.patch" | shasum -a 256 -c
          git -C pinned-input apply --check "$PWD/.github/recovery/fighter-xuxiao-internal-preview-20261120/xuxiao-practice.patch"
          git -C pinned-input apply "$PWD/.github/recovery/fighter-xuxiao-internal-preview-20261120/xuxiao-practice.patch"
          printf '%s  %s\n' f38a3635108b4189c402fc0792e70f7f585462f749f481b7bf03040f81428c36 "$PWD/.github/recovery/fighter-xuxiao-protected-qualification-20261120/verify_xuxiao_qualified_ui.py" | shasum -a 256 -c
          printf '%s  %s\n' ea0d04361889902ddcd81a6bd481fda3effb09cd5d23b0bc1cd5ca6a6f092041 "$PWD/.github/recovery/fighter-xuxiao-protected-qualification-20261120/xuxiao-shipping-accessibility.patch" | shasum -a 256 -c
          git -C pinned-input apply --check "$PWD/.github/recovery/fighter-xuxiao-protected-qualification-20261120/xuxiao-shipping-accessibility.patch"
          git -C pinned-input apply "$PWD/.github/recovery/fighter-xuxiao-protected-qualification-20261120/xuxiao-shipping-accessibility.patch"
          printf '%s  %s\n' 0d6f10bed4eb18d484f7d03cf828bb5cbca7880e279d67087c38b276e80441cc "$PWD/.github/recovery/fighter-xuxiao-protected-qualification-20261120/xuxiao-preview-ui-test.patch" | shasum -a 256 -c
          git -C pinned-input apply --check "$PWD/.github/recovery/fighter-xuxiao-protected-qualification-20261120/xuxiao-preview-ui-test.patch"
          git -C pinned-input apply "$PWD/.github/recovery/fighter-xuxiao-protected-qualification-20261120/xuxiao-preview-ui-test.patch"
          reviewed="$PWD/.github/recovery/fighter-active-native-20261119/active-app-reviewed.patch"
          printf '%s  %s\n' cb1caa47857cba7b082507bc4853f065284c6778634645368635d076ab790464 "$reviewed" | shasum -a 256 -c
          # Protected staging imports this helper. It writes exclusively to the separate Tests area.
          git -C pinned-input apply --include='scripts/stage_completion_bottle_oracle.py' --check "$reviewed"
          git -C pinned-input apply --include='scripts/stage_completion_bottle_oracle.py' "$reviewed"
          test -f pinned-input/scripts/stage_completion_bottle_oracle.py
          test -x /Applications/Xcode_26.6.app/Contents/Developer/usr/bin/xcodebuild || test -d /Applications/Xcode_26.6.app/Contents/Developer
          command -v xcodegen >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen --version | grep -E '(^|[^0-9.])2\.46\.0([^0-9.]|$)'
          python3 -m venv "$RIFT_ACTIVE_TMP/active-venv"
          printf '%s\n' 'numpy==2.3.5 --hash=sha256:ee3888d9ff7c14604052b2ca5535a30216aa0a58e948cdd3eeb8d3415f638769 --hash=sha256:612a95a17655e213502f60cfb9bf9408efdc9eb1d5f50535cc6eb365d11b42b5' > "$RIFT_ACTIVE_TMP/active-requirements.txt"
          "$RIFT_ACTIVE_TMP/active-venv/bin/python" -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes --no-deps -r "$RIFT_ACTIVE_TMP/active-requirements.txt"
      - name: Restore exact encrypted recipient companion from protected environment
        shell: bash
        env:
          FIGHTER_RECIPIENT_ESCROW_ZIP_B64: ${{ secrets.FIGHTER_RECIPIENT_ESCROW_ZIP_B64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYCODE'
          import base64, binascii, hashlib, hmac, os
          from pathlib import Path

          encoded = os.environ.pop("FIGHTER_RECIPIENT_ESCROW_ZIP_B64", "")
          def refuse():
              raise SystemExit("Encrypted companion unavailable or did not match the pinned copy")
          if len(encoded) != 5580:
              refuse()
          try:
              raw = base64.b64decode(encoded, validate=True)
          except (ValueError, binascii.Error):
              refuse()
          wanted = "d92923cbdc2bbb5854b142321ea8e240a483ff6b15edc6a91a8b1b13cb06f7e8"
          if len(raw) != 4184 or not hmac.compare_digest(hashlib.sha256(raw).hexdigest(), wanted):
              refuse()
          folder = Path(os.environ["RIFT_ACTIVE_TMP"])
          if not folder.is_dir() or folder.is_symlink() or folder.stat().st_uid != os.getuid() or folder.stat().st_mode & 0o077:
              raise SystemExit("Encrypted companion requires an account-owned private build directory")
          target = folder / "active-recipient.zip"
          fd = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(fd, "wb") as stream:
              stream.write(raw)
          print("Verified encrypted recipient companion")
          PYCODE
      - name: Authenticate and assemble all 539 active resources
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
          FIGHTER_H17_D19_KEY: ${{ secrets.FIGHTER_H17_D19_KEY }}
          FIGHTER_LIU_MODEL_KEY: ${{ secrets.FIGHTER_LIU_MODEL_KEY }}
          FIGHTER_PRESENTATION_KEY: ${{ secrets.FIGHTER_PRESENTATION_KEY }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/openssl@3/bin:/usr/local/opt/openssl@3/bin:$PATH"
          r="$PWD/.github/recovery"
          a="$r/fighter-active-native-20261119"
          export PYTHONPATH="$a:$r/fighter-final-catalog-20261119:$r/fighter-sun-tracks-20261119:$r/fighter-sun-20261119:$r/fighter-serpent-20261119:$r/fighter-base-reuse-20261119:$r/fighter-four-packs-20261119:$r/fighter-release-proof-20261119:$PWD/pinned-input/.github/scripts:$PWD/pinned-input/scripts"
          trap 'rm -f -- "$RIFT_ACTIVE_TMP/active-recipient.zip"' EXIT
          "$RIFT_ACTIVE_TMP/active-venv/bin/python" -s -B "$a/stage_protected_active.py" pinned-input .github/private "$a" "$RIFT_ACTIVE_TMP/active-recipient.zip" pinned-input/App/Resources/FighterPrivate --protected
      - name: Run standalone Xu replacement combat unit tests
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          set -euo pipefail
          cd pinned-input
          out="$RIFT_ACTIVE_TMP/xu-core.log"
          status=0
          /usr/bin/xcrun swift test --scratch-path "$RIFT_ACTIVE_TMP/xu-swift" -Xswiftc -DL12_INTERNAL_PREVIEW --filter DuelXuXiaoPracticeTests > "$out" 2>&1 || status=$?
          python3 - "$out" "$status" <<'PYCODE'
          import json,re,sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text(errors="replace")
          totals=[tuple(map(int,m)) for m in re.findall(r"Executed (\d+) tests?, with (\d+) failures?",s)]
          ok=int(sys.argv[2])==0 and bool(totals) and totals[-1]==(12,0) and not re.search(r"\b(?:skipped|SKIPPED)\b",s)
          print(json.dumps({"xuUnitTestsPassed":12 if ok else None,"xuUnitTestsVerified":ok,"xuUnitTestsSkipped":0 if ok else None}))
          sys.exit(not ok)
          PYCODE
      - name: Verify the same opt-in Release preview on iPhone and iPad simulators
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RIFT_ACTIVE_TMP/xu-preview.XXXXXX")"
          PYTHONPATH="$PWD/pinned-input/scripts:$PWD/.github/recovery/fighter-active-native-20261119" "$RIFT_ACTIVE_TMP/active-venv/bin/python" -s -B "$PWD/.github/recovery/fighter-xuxiao-protected-qualification-20261120/verify_xuxiao_qualified_ui.py" pinned-input "$work" "$(command -v xcodegen)" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Remove local staged assets
        if: always()
        shell: bash
        run: |
          if [ -n "${RIFT_ACTIVE_TMP:-}" ]; then rm -f -- "$RIFT_ACTIVE_TMP/active-recipient.zip"; fi
          rm -rf -- pinned-input/App/Resources/FighterPrivate pinned-input/Tests/PrivateResourceValidation
          if [ -n "${RIFT_ACTIVE_TMP:-}" ] && [[ "$RIFT_ACTIVE_TMP" == "$RUNNER_TEMP"/rift-active.* || "$RIFT_ACTIVE_TMP" == "$(cd -- "$RUNNER_TEMP" && pwd -P)"/rift-active.* ]]; then rm -rf -- "$RIFT_ACTIVE_TMP"; fi
