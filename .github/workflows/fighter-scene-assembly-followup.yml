name: Fighter scene assembly followup (one new native; conditional failed UI)

'on':
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths:
      - .github/workflows/fighter-scene-assembly-followup.yml
      - .github/scripts/fighter_scene_assembly_followup.py
      - .github/scripts/test_fighter_scene_assembly_followup.py
      - Tests/SiteTests/DuelSceneAssemblyFollowupTests.swift
      - App/Views/DuelWorld.swift

permissions:
  contents: read

jobs:
  followup:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' &&
      github.ref == 'refs/heads/codex/fighter-visual-acceptance-20261113-1200' &&
      github.run_attempt == 1 &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'Verify installed scene assembly followup 20261115'
    concurrency:
      group: fighter-private-visual-acceptance
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 65
    environment: fighter-private-assets
    env:
      EXPECTED_SCENE_ASSEMBLY_FOLLOWUP_HELPER_SHA256: "eb62428656ea69553d91df1db2ed01b1512b660f89518151aadc61e640a0030e"
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Pin the sole World candidate and every other 09f2 source input
        id: prepare
        timeout-minutes: 2
        run: python3 .github/scripts/fighter_scene_assembly_followup.py prepare
      - name: Select installed Xcode 26.6 and simulator tools
        timeout-minutes: 8
        run: python3 .github/scripts/fighter_scene_assembly_followup.py tools
      - name: Authenticate the unchanged existing 373-resource release
        id: stage
        timeout-minutes: 8
        env:
          FIGHTER_LIU_MODEL_KEY: ${{ secrets.FIGHTER_LIU_MODEL_KEY }}
          FIGHTER_PRESENTATION_KEY: ${{ secrets.FIGHTER_PRESENTATION_KEY }}
          FIGHTER_H17_D19_KEY: ${{ secrets.FIGHTER_H17_D19_KEY }}
        run: python3 .github/scripts/fighter_scene_assembly_followup.py stage
      - name: Build the native host and existing UI target together exactly once
        id: build
        timeout-minutes: 25
        run: python3 .github/scripts/fighter_scene_assembly_followup.py build
      - name: Prepare one installed iPhone 17 Pro Max simulator
        id: simulator
        timeout-minutes: 12
        run: python3 .github/scripts/fighter_scene_assembly_followup.py simulator
      - name: Execute only the new cold original-surface regression and collect its full log
        id: native
        if: always() && steps.build.outcome == 'success' && steps.simulator.outcome == 'success'
        timeout-minutes: 15
        run: python3 .github/scripts/fighter_scene_assembly_followup.py test
      - name: Preserve the original native PNG and independently verify its narrow pixel criterion
        id: native_export
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 5
        run: python3 .github/scripts/fighter_scene_assembly_followup.py export
      - name: Run only the previously failed real-control UI method after every new native gate
        id: ui
        if: always() && steps.native.outcome == 'success' && steps.native_export.outcome == 'success'
        timeout-minutes: 9
        run: python3 .github/scripts/fighter_scene_assembly_followup.py ui
      - name: Preserve conditional UI originals including partial failure evidence
        id: ui_export
        if: always() && steps.prepare.outcome == 'success' && (steps.ui.outcome == 'success' || steps.ui.outcome == 'failure')
        timeout-minutes: 5
        run: python3 .github/scripts/fighter_scene_assembly_followup.py export_ui
      - name: Seal bounded native and conditional UI evidence in one authenticated envelope
        id: seal
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 5
        run: python3 .github/scripts/fighter_scene_assembly_followup.py seal
      - uses: actions/upload-artifact@v4
        if: always() && steps.seal.outcome == 'success'
        with:
          name: fighter-scene-assembly-followup-${{ github.run_id }}-${{ github.run_attempt }}-encrypted
          path: |
            ${{ runner.temp }}/fighter-scene-assembly-followup/published/fighter-scene-assembly-followup-evidence.enc
            ${{ runner.temp }}/fighter-scene-assembly-followup/published/fighter-scene-assembly-followup-evidence.key.enc
            ${{ runner.temp }}/fighter-scene-assembly-followup/published/fighter-scene-assembly-followup-evidence.session-key.enc
            ${{ runner.temp }}/fighter-scene-assembly-followup/published/fighter-scene-assembly-followup-evidence.SHA256SUMS
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Clean only this run's simulator, staged media, products and plaintext
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 5
        run: python3 .github/scripts/fighter_scene_assembly_followup.py cleanup
      - name: Report native and conditional UI separately with pixel review still pending
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 1
        run: python3 .github/scripts/fighter_scene_assembly_followup.py report
