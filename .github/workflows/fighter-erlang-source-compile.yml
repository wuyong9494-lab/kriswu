name: Erlang source and public shader checks (unsigned only)

'on':
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths:
      - App/**
      - Sources/**
      - Shared/**
      - Widget/**
      - Tests/**
      - project.yml
      - scripts/build_fighter_network_rules.py
      - scripts/check_fighter_public_shaders.py
      - scripts/check_fighter_public_shaders.swift
      - .github/scripts/fighter_erlang_source_compile.py
      - .github/workflows/fighter-erlang-source-compile.yml

permissions:
  contents: read

jobs:
  erlang-source-compile:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' &&
      github.ref == 'refs/heads/codex/fighter-visual-acceptance-20261113-1200' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.head_commit.message == 'Verify Erlang integrated source 20261115'
    concurrency:
      group: fighter-erlang-source-and-shaders-20261115-compile
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      EXPECTED_ERLANG_COMPILE_HELPER_SHA256: '01f30dd6a79c00a40b51f1725a90fc211b10efa5b7a3bf5c76ff1e9b7185aaa3'
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /App/
            /Sources/
            /Shared/
            /Widget/
            /Tests/
            /project.yml
            /scripts/build_fighter_network_rules.py
            /scripts/check_fighter_public_shaders.py
            /scripts/check_fighter_public_shaders.swift
            /.github/scripts/fighter_erlang_source_compile.py
            /.github/workflows/fighter-erlang-source-compile.yml
      - name: Verify pinned source and compile the unsigned app once
        timeout-minutes: 18
        run: python3 -I -B -S .github/scripts/fighter_erlang_source_compile.py

  public-shader-check:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' &&
      github.ref == 'refs/heads/codex/fighter-visual-acceptance-20261113-1200' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.head_commit.message == 'Verify public fighter shaders 20261115'
    concurrency:
      group: fighter-erlang-source-and-shaders-20261115-shaders
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPECTED_ERLANG_COMPILE_HELPER_SHA256: '01f30dd6a79c00a40b51f1725a90fc211b10efa5b7a3bf5c76ff1e9b7185aaa3'
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /App/Services/DuelTriadSourceMorph.swift
            /App/Services/DuelSourceProjectedShadowRenderer.swift
            /scripts/check_fighter_public_shaders.py
            /scripts/check_fighter_public_shaders.swift
            /.github/scripts/fighter_erlang_source_compile.py
            /.github/workflows/fighter-erlang-source-compile.yml
      - name: Verify exact public sources and check their shader programs once
        timeout-minutes: 5
        run: |
          python3 -I -B -S - <<'PY'
          import hashlib, importlib.util, os, pathlib, subprocess, sys
          helper = pathlib.Path('.github/scripts/fighter_erlang_source_compile.py').resolve()
          expected = os.environ['EXPECTED_ERLANG_COMPILE_HELPER_SHA256']
          if hashlib.sha256(helper.read_bytes()).hexdigest() != expected:
              raise SystemExit('The reviewed source identity helper differs')
          spec = importlib.util.spec_from_file_location('source_identity', helper)
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          verifier.validate_event(expected_message=verifier.PUBLIC_SHADER_COMMIT_MESSAGE)
          verifier.no_private_resources()
          for name in ('App/Services/DuelTriadSourceMorph.swift',
                       'App/Services/DuelSourceProjectedShadowRenderer.swift',
                       'scripts/check_fighter_public_shaders.py',
                       'scripts/check_fighter_public_shaders.swift'):
              path = verifier.regular(verifier.ROOT / name, 128 * 1024)
              if verifier.sha256(path) != verifier.FOCUS_SHA256[name]:
                  raise SystemExit('A public shader source differs from its reviewed identity')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fighter-public-shaders-20261115'
          result = subprocess.run([sys.executable, '-I', '-B', '-S',
              'scripts/check_fighter_public_shaders.py', '--output', str(output)], timeout=255)
          raise SystemExit(result.returncode)
          PY
