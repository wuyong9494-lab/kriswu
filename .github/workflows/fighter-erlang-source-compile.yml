name: Erlang character source compile (unsigned build only)

'on':
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths:
      - App/**
      - Sources/**
      - Shared/**
      - Widget/**
      - Tests/**
      - project.yml
      - scripts/build_fighter_network_rules.py
      - .github/scripts/fighter_erlang_source_compile.py
      - .github/workflows/fighter-erlang-source-compile.yml

permissions:
  contents: read

jobs:
  erlang-source-compile:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' &&
      github.ref == 'refs/heads/codex/fighter-visual-acceptance-20261113-1200' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.head_commit.message == 'Verify Erlang source integration 20261115'
    concurrency:
      group: fighter-erlang-source-compile-20261115
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      EXPECTED_ERLANG_COMPILE_HELPER_SHA256: '139735ff6f9ce367a92cf94ddbd87d044229c4b79427d81195f70c7a471e12df'
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /App/
            /Sources/
            /Shared/
            /Widget/
            /Tests/
            /project.yml
            /scripts/build_fighter_network_rules.py
            /.github/scripts/fighter_erlang_source_compile.py
            /.github/workflows/fighter-erlang-source-compile.yml
      - name: Verify pinned source and compile the unsigned app once
        timeout-minutes: 18
        run: python3 -I -B -S .github/scripts/fighter_erlang_source_compile.py
