name: Fighter laboratory (unsigned only)
on:
  push:
    branches: ['codex/fighter-lab-*', 'codex/plan-fighter-recovery-20261108']
    paths:
      - 'App/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'project.yml'
      - '.github/private/**'
      - '.github/scripts/*fighter*'
      - '.github/workflows/fighter-lab.yml'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      private_character:
        description: Run actual character acceptance (requires separately staged model and key)
        type: boolean
        default: false
      private_personal_fighters:
        description: Validate actual Sun, Liu, autumn lobby and palace (requires approved encrypted assets)
        type: boolean
        default: false
      private_original_fighters:
        description: Validate original rigs, distinct katana/hammers, source controls and feedback (requires approved encrypted assets)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fighter-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.0.3
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Fight rules and existing app regressions
        shell: bash -eo pipefail {0}
        run: swift test --jobs 2 2>&1 | tee fighter-core.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fighter-core
          path: fighter-core.log
  envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify authenticated envelopes with synthetic data
        run: |
          python3 -m unittest discover -s .github/scripts -p test_fighter_private_model.py
          python3 -m unittest discover -s .github/scripts -p test_fighter_sf3_assets.py
          python3 -m unittest discover -s .github/scripts -p test_fighter_sf3_distinct.py
  device:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode and generate device project
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          brew install xcodegen openssl@3
          python3 .github/scripts/build_identity.py
          xcodegen generate
      - name: Compile device app without signing or distribution
        shell: bash -eo pipefail {0}
        run: |
          xcodebuild build -project ShiftReminder.xcodeproj -scheme ShiftReminder \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath fighter-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee fighter-device.log
          grep -E 'warning:.*(Sendable|concurrency|actor-isolated|nonisolated|data race|global actor|isolated|isolation)' \
            fighter-device.log | sort -u > fighter-concurrency.log || true
          test ! -s fighter-concurrency.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fighter-device
          path: |
            fighter-device.log
            fighter-concurrency.log
  native:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode and generate existing app
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          brew install xcodegen openssl@3
          python3 .github/scripts/build_identity.py
          # Use the App's existing demo path for the hosted unit tests, as the
          # UI tests already do. Production reminder permissions are unchanged.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project.yml')
          source = p.read_text()
          target = '    scheme:\n      testTargets:\n        - SiteTests'
          assert source.count(target) == 1
          p.write_text(source.replace(target, target + '\n      commandLineArguments:\n        "-demo": true'))
          PY
          xcodegen generate
      - name: Build native and UI test bundles
        id: test_build
        timeout-minutes: 15
        shell: bash -eo pipefail {0}
        run: |
          # Keep cold compilation outside the XCTest time budgets. Both schemes
          # are replayed below from these same Debug simulator products.
          for SCHEME in ShiftReminder ArenaFlow; do
            xcodebuild build-for-testing -project ShiftReminder.xcodeproj -scheme "$SCHEME" \
              -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath fighter-native CODE_SIGNING_ALLOWED=NO 2>&1 | tee "fighter-build-$SCHEME.log"
          done
      - name: Prepare iPhone 17 Pro Max simulator
        id: simulator
        timeout-minutes: 12
        shell: bash -eo pipefail {0}
        run: |
          python3 -u .github/scripts/prepare_star_simulator.py 2>&1 | tee fighter-simulator.log
          python3 -u .github/scripts/prepare_star_simulator.py --ready 2>&1 | tee -a fighter-simulator.log
      - name: Check interruption, input and SceneKit resource lifetime
        timeout-minutes: 15
        shell: bash -eo pipefail {0}
        run: |
          DEVICE=$(python3 -c "import json; print(json.load(open('star-test-device.json'))['udid'])")
          xcodebuild test-without-building -project ShiftReminder.xcodeproj -scheme ShiftReminder \
            -configuration Debug -destination "id=$DEVICE" -parallel-testing-enabled NO \
            -only-testing:SiteTests/GLTFMaterialTests -only-testing:SiteTests/DuelLifecycleTests \
            -only-testing:SiteTests/DuelCharacterTests/testOpeningFeedbackSurvivesFirstTickAndRestart \
            -derivedDataPath fighter-native -resultBundlePath fighter-lifecycle.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee fighter-lifecycle.log
      - name: Play both characters and restore portrait app
        if: ${{ !cancelled() && steps.test_build.outcome == 'success' && steps.simulator.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash -eo pipefail {0}
        run: |
          DEVICE=$(python3 -c "import json; print(json.load(open('star-test-device.json'))['udid'])")
          xcodebuild test-without-building -project ShiftReminder.xcodeproj -scheme ArenaFlow \
            -configuration Debug -destination "id=$DEVICE" -parallel-testing-enabled NO \
            -only-testing:ArenaFlowTests/DuelFlowTests \
            -derivedDataPath fighter-native -resultBundlePath fighter-flow.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee fighter-flow.log
      - name: Export rendered evidence
        if: always()
        run: |
          for result in fighter-lifecycle fighter-flow; do
            if [ -d "$result.xcresult" ]; then
              mkdir -p "fighter-evidence/$result"
              xcrun xcresulttool export attachments --path "$result.xcresult" --output-path "fighter-evidence/$result"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fighter-native
          path: |
            fighter-evidence
            fighter-*.log
            star-test-device.json
  character:
    # Use the existing repository secret; never write, print, or package the key.
    # The complete authorized encrypted resource sets are now committed on the
    # personal-fighter branch; its pushes must validate the actual assets.
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.private_character || inputs.private_personal_fighters || inputs.private_original_fighters)) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/codex/plan-fighter-recovery-20261108' ||
       github.ref == 'refs/heads/codex/fighter-lab-sf3-resources-20261108'))
    runs-on: macos-26
    timeout-minutes: 75
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      FIGHTER_PERSONAL_ASSETS: ${{ inputs.private_personal_fighters || (github.event_name == 'push' && github.ref == 'refs/heads/codex/fighter-lab-sf3-resources-20261108') }}
      FIGHTER_ORIGINAL_ASSETS: ${{ inputs.private_original_fighters || (github.event_name == 'push' && github.ref == 'refs/heads/codex/fighter-lab-sf3-resources-20261108') }}
    steps:
      - uses: actions/checkout@v5
      - name: Stage verified private character
        env:
          FIGHTER_LIU_MODEL_KEY: ${{ secrets.FIGHTER_LIU_MODEL_KEY }}
        run: |
          brew install openssl@3
          python3 .github/scripts/fighter_private_model.py stage
          if [ "$FIGHTER_PERSONAL_ASSETS" = "true" ]; then
            python3 .github/scripts/fighter_sf3_assets.py
          fi
          if [ "$FIGHTER_ORIGINAL_ASSETS" = "true" ]; then
            python3 .github/scripts/fighter_sf3_assets.py --original-rig
            python3 .github/scripts/fighter_sf3_distinct.py
          fi
      - name: Select Xcode and generate existing app
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          brew install xcodegen openssl@3
          python3 .github/scripts/build_identity.py
          # Use the App's existing demo path for the hosted unit tests, as the
          # UI tests already do. Production reminder permissions are unchanged.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project.yml')
          source = p.read_text()
          target = '    scheme:\n      testTargets:\n        - SiteTests'
          assert source.count(target) == 1
          p.write_text(source.replace(target, target + '\n      commandLineArguments:\n        "-demo": true'))
          PY
          xcodegen generate
      - name: Build native and UI test bundles
        id: test_build
        timeout-minutes: 15
        shell: bash -eo pipefail {0}
        run: |
          # Keep cold compilation outside the XCTest time budgets. Both schemes
          # are replayed below from these same Debug simulator products.
          for SCHEME in ShiftReminder ArenaFlow; do
            xcodebuild build-for-testing -project ShiftReminder.xcodeproj -scheme "$SCHEME" \
              -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath fighter-native CODE_SIGNING_ALLOWED=NO 2>&1 | tee "fighter-build-$SCHEME.log"
          done
      - name: Prepare iPhone 17 Pro Max simulator
        id: simulator
        timeout-minutes: 12
        shell: bash -eo pipefail {0}
        run: |
          python3 -u .github/scripts/prepare_star_simulator.py 2>&1 | tee fighter-simulator.log
          python3 -u .github/scripts/prepare_star_simulator.py --ready 2>&1 | tee -a fighter-simulator.log
      - name: Check interruption, input and SceneKit resource lifetime
        timeout-minutes: 15
        shell: bash -eo pipefail {0}
        run: |
          DEVICE=$(python3 -c "import json; print(json.load(open('star-test-device.json'))['udid'])")
          PERSONAL_TESTS=()
          if [ "$FIGHTER_PERSONAL_ASSETS" = "true" ]; then
            PERSONAL_TESTS=("-only-testing:SiteTests/DuelPersonalAssetTests")
          fi
          if [ "$FIGHTER_ORIGINAL_ASSETS" = "true" ]; then
            PERSONAL_TESTS+=("-only-testing:SiteTests/DuelOriginalRigAssetTests" "-only-testing:SiteTests/DuelOriginalRigAdapterTests" "-only-testing:SiteTests/DuelOriginalCombatTests" "-only-testing:SiteTests/DuelSourceControlsTests" "-only-testing:SiteTests/DuelSourceEffectsTests" "-only-testing:SiteTests/DuelWeaponEffectsTests" "-only-testing:SiteTests/DuelWeaponAssetTests" "-only-testing:SiteTests/DuelWeaponGameplayTests")
          fi
          xcodebuild test-without-building -project ShiftReminder.xcodeproj -scheme ShiftReminder \
            -configuration Debug -destination "id=$DEVICE" -parallel-testing-enabled NO \
            -only-testing:SiteTests/GLTFMaterialTests -only-testing:SiteTests/DuelLifecycleTests -only-testing:SiteTests/DuelCharacterTests \
            "${PERSONAL_TESTS[@]}" \
            -derivedDataPath fighter-native -resultBundlePath fighter-lifecycle.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee fighter-lifecycle.log
      - name: Play both characters and restore portrait app
        if: ${{ !cancelled() && steps.test_build.outcome == 'success' && steps.simulator.outcome == 'success' }}
        timeout-minutes: 18
        shell: bash -eo pipefail {0}
        run: |
          DEVICE=$(python3 -c "import json; print(json.load(open('star-test-device.json'))['udid'])")
          FLOW_TESTS=("-only-testing:ArenaFlowTests/DuelFlowTests")
          if [ "$FIGHTER_ORIGINAL_ASSETS" = "true" ]; then
            FLOW_TESTS+=("-only-testing:ArenaFlowTests/DuelWeaponFlowTests")
          fi
          # One recording covers both the explicit legacy regression and the
          # new source-controls/equipped-character UI flow.
          # The complete native-motion directory is sealed with the portrait evidence below.
          bash .github/scripts/fighter_native_video.sh "$DEVICE" -- \
            xcodebuild test-without-building -project ShiftReminder.xcodeproj -scheme ArenaFlow \
            -configuration Debug -destination "id=$DEVICE" -parallel-testing-enabled NO \
            "${FLOW_TESTS[@]}" \
            -derivedDataPath fighter-native -resultBundlePath fighter-flow.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee fighter-flow.log
      - name: Export rendered evidence
        if: always()
        timeout-minutes: 8
        shell: bash
        run: |
          failed=0
          for result in fighter-lifecycle fighter-flow; do
            if [ -d "$result.xcresult" ]; then
              mkdir -p "fighter-evidence/$result"
              if ! xcrun xcresulttool export attachments --path "$result.xcresult" --output-path "fighter-evidence/$result" >"fighter-export-$result.log" 2>&1; then
                echo "::warning::Could not export $result attachments; preserving diagnostic log"
                failed=1
              fi
            fi
          done
          exit "$failed"
      - name: Protect portrait evidence before upload
        if: always()
        timeout-minutes: 8
        env:
          FIGHTER_LIU_MODEL_KEY: ${{ secrets.FIGHTER_LIU_MODEL_KEY }}
        run: |
          if [ -d fighter-evidence ]; then
            python3 -c "import shutil; shutil.make_archive('fighter-evidence-private', 'zip', 'fighter-evidence')"
            python3 .github/scripts/fighter_private_model.py seal evidence fighter-evidence-private.zip fighter-evidence.enc
            rm -f fighter-evidence-private.zip
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fighter-character-private
          path: |
            fighter-evidence.enc
            fighter-*.log
            fighter-export-*.log
            star-test-device.json
