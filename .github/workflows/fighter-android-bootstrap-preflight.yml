name: Android bootstrap prerequisites (read only)

'on':
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths:
      - .github/workflows/fighter-android-bootstrap-preflight.yml
      - .github/scripts/fighter-android-bootstrap-preflight.py

permissions:
  contents: read

jobs:
  prerequisites:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' &&
      github.ref == 'refs/heads/codex/fighter-visual-acceptance-20261113-1200' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.head_commit.message == 'Verify Android bootstrap prerequisites 20261115'
    concurrency:
      group: fighter-android-bootstrap-preflight-20261115
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_PREFLIGHT_HELPER_SHA256: 9ea87cd647eea1d710394700b3f6c2999f57b1ea6fc9e091fb9216b9f594a656
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/fighter-android-bootstrap-preflight.yml
            /.github/scripts/fighter-android-bootstrap-preflight.py
      - name: Read one official catalog and inspect existing prerequisites
        timeout-minutes: 2
        run: python3 .github/scripts/fighter-android-bootstrap-preflight.py
