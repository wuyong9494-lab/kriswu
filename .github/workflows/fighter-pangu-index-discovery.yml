name: Pangu official bootstrap integration diagnostic

'on':
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths:
      - .github/workflows/fighter-pangu-index-discovery.yml
      - .github/scripts/fighter_pangu_index_discovery.py
      - .github/scripts/test_fighter_pangu_index_discovery.py

permissions:
  contents: read

jobs:
  bootstrap:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' &&
      github.ref == 'refs/heads/codex/fighter-visual-acceptance-20261113-1200' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.head_commit.message == 'Verify Pangu official bootstrap integration 20261115'
    concurrency:
      group: fighter-pangu-official-bootstrap-20261115
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/fighter-pangu-index-discovery.yml
            /.github/scripts/fighter_pangu_index_discovery.py
            /.github/scripts/test_fighter_pangu_index_discovery.py
            /.github/scripts/fighter_private_model.py
            /.github/scripts/fighter_recover_screenshots.py
            /.github/public/fighter-pangu-native-20261114.public.pem
      - name: Admit the exact source, first attempt and public recipients
        id: prepare
        timeout-minutes: 1
        run: python3 .github/scripts/fighter_pangu_index_discovery.py prepare
      - name: Observe one fixed official GET using runner default proxy and TLS
        id: capture
        timeout-minutes: 1
        run: python3 .github/scripts/fighter_pangu_index_discovery.py capture
      - name: Seal the bounded response without any resource secret
        id: seal
        if: always() && steps.prepare.outcome == 'success' && steps.capture.outcome == 'success'
        timeout-minutes: 1
        run: python3 .github/scripts/fighter_pangu_index_discovery.py seal
      - name: Upload only authenticated ciphertext and wrapped diagnostic keys
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pangu-bootstrap-private-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fighter-pangu-index-discovery/published/pangu-bootstrap-evidence.enc
            ${{ runner.temp }}/fighter-pangu-index-discovery/published/pangu-bootstrap-evidence.key.enc
            ${{ runner.temp }}/fighter-pangu-index-discovery/published/pangu-bootstrap-evidence.session-key.enc
            ${{ runner.temp }}/fighter-pangu-index-discovery/published/pangu-bootstrap-evidence.SHA256SUMS
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Report bootstrap outcome separately from unrecovered D19 resources
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 1
        run: python3 .github/scripts/fighter_pangu_index_discovery.py report
      - name: Remove this job's private plaintext
        if: always() && steps.prepare.outcome == 'success'
        run: python3 .github/scripts/fighter_pangu_index_discovery.py cleanup
