name: Exercise Xu practice movement on simulators
on:
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths:
      - '.github/workflows/rift-xu-smoke.yml'
      - '.github/recovery/fighter-signed-archive-20261120/package-check-support.patch'
      - '.github/recovery/fighter-signed-archive-20261120/production-source.patch'
      - '.github/recovery/fighter-xuxiao-internal-preview-20261120/xuxiao-practice.patch'
      - '.github/recovery/fighter-xuxiao-protected-qualification-20261120/xuxiao-shipping-accessibility.patch'
      - '.github/recovery/fighter-xuxiao-protected-qualification-20261120/xuxiao-preview-ui-test.patch'
permissions:
  contents: read
jobs:
  practice:
    name: Practice on ${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    runs-on: macos-26
    timeout-minutes: 65
    env:
      DEVICE: ${{ matrix.device }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/recovery/fighter-signed-archive-20261120/package-check-support.patch
            /.github/recovery/fighter-signed-archive-20261120/production-source.patch
            /.github/recovery/fighter-xuxiao-internal-preview-20261120/xuxiao-practice.patch
            /.github/recovery/fighter-xuxiao-protected-qualification-20261120/xuxiao-shipping-accessibility.patch
            /.github/recovery/fighter-xuxiao-protected-qualification-20261120/xuxiao-preview-ui-test.patch
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: 73a0cf1ef86e35f40ed99ed9cc0ec467f10f4826
          path: public-base
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /App/
            !/App/Resources/FighterPrivate/
            /Shared/
            /Sources/
            /Tests/
            !/Tests/PrivateResourceValidation/
            /Widget/
            /scripts/
            /project.yml
            /Package.swift
      - name: Assemble the Release preview from public source
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | grep -Fx 'Xcode 26.6'
          command -v xcodegen >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen --version | grep -E '(^|[^0-9.])2\.46\.0([^0-9.]|$)'
          work="$(mktemp -d "$RUNNER_TEMP/xu-practice.XXXXXX")"
          echo "XU_WORK=$work" >> "$GITHUB_ENV"
          recovery="$GITHUB_WORKSPACE/.github/recovery"
          cd public-base
          git apply "$recovery/fighter-signed-archive-20261120/package-check-support.patch"
          git apply "$recovery/fighter-signed-archive-20261120/production-source.patch"
          git apply "$recovery/fighter-xuxiao-internal-preview-20261120/xuxiao-practice.patch"
          candidate="$recovery/fighter-xuxiao-protected-qualification-20261120"
          git apply "$candidate/xuxiao-shipping-accessibility.patch"
          git apply "$candidate/xuxiao-preview-ui-test.patch"
          test ! -e App/Resources/FighterPrivate
          xcodegen generate --spec project.yml
          if ! xcodebuild -project ShiftReminder.xcodeproj -scheme ArenaFlow -sdk iphonesimulator \
              build-for-testing -configuration Release -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$work/derived" ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY= FIGHTER_XUXIAO_PROFILE_SHA256= L12_INTERNAL_PREVIEW_CONDITION=L12_INTERNAL_PREVIEW \
              FIGHTER_ASSET_RELEASE_SHA256=527e0195b7911e5b532aec92c37057f36a633952768670518565bde65605cbd3 \
              >"$work/build.log" 2>&1; then
            grep -inE 'error:|fatal:|failed|exception' "$work/build.log" | tail -n 50 | cut -c1-700 || true
            exit 1
          fi
      - name: Boot simulator and run the practice flow
        shell: bash
        run: |
          set -euo pipefail
          cd "$XU_WORK"
          device="$(python3 - <<'PY'
          import json, os, subprocess
          inventory = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "-j"]))
          runtime, = [r["identifier"] for r in inventory["runtimes"] if r.get("isAvailable") and ".iOS-" in r["identifier"] and r["version"] == "26.5"]
          types = inventory["devicetypes"]
          if os.environ["DEVICE"] == "iPhone":
              model, = [d for d in types if d["name"] == "iPhone 17 Pro Max"]
          else:
              model = min((d for d in types if d["name"].startswith("iPad")), key=lambda d: (not d["name"].startswith("iPad Pro 13-inch"), d["name"], d["identifier"]))
          print(subprocess.check_output(["xcrun", "simctl", "create", "Xu Practice " + model["name"], model["identifier"], runtime], text=True).strip())
          PY
          )"
          trap 'xcrun simctl shutdown "$device" >/dev/null 2>&1 || true; xcrun simctl delete "$device" || true' EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          app=derived/Build/Products/Release-iphonesimulator/ShiftReminder.app
          xcrun simctl install "$device" "$app"
          plans=(derived/Build/Products/ArenaFlow_*.xctestrun)
          test "${#plans[@]}" -eq 1 && test -f "${plans[0]}"
          selector='ArenaFlowTests/DuelXuXiaoPracticeFlowTests/testReplacementPracticePlaysAndReturnsToGames'
          status=0
          xcodebuild test-without-building -xctestrun "${plans[0]}" -destination "id=$device" \
            -parallel-testing-enabled NO -only-testing:"$selector" -resultBundlePath "$XU_WORK/flow.xcresult" \
            >"$XU_WORK/test.log" 2>&1 || status=$?
          if ! test -d flow.xcresult; then
            grep -inE 'error:|fatal:|failed' test.log | tail -n 20 | cut -c1-700 || true
            exit 1
          fi
          xcrun xcresulttool get test-results summary --path flow.xcresult >summary.json
          xcrun xcresulttool get test-results tests --path flow.xcresult >tests.json
          xcrun xcresulttool get log --path flow.xcresult --type console >console.log 2>/dev/null || true
          python3 - "$status" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          summary = json.loads(Path("summary.json").read_text())
          data = json.loads(Path("tests.json").read_text())
          def cases(value):
              if isinstance(value, dict):
                  if value.get("nodeType") == "Test Case":
                      yield value.get("nodeIdentifier", "").removesuffix("()")
                  for item in value.values():
                      yield from cases(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from cases(item)
          observed = list(cases(data))
          expected = "DuelXuXiaoPracticeFlowTests/testReplacementPracticePlaysAndReturnsToGames"
          counts = {k: summary.get(k) for k in ("totalTestCount", "passedTests", "failedTests", "skippedTests")}
          print(json.dumps({"simulator": os.environ["DEVICE"], "publicSourcePreview": True, **counts}))
          strings = [Path(f).read_text(errors="replace") for f in ("test.log", "summary.json", "tests.json", "console.log")]
          def string_values(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, dict):
                  for v in value.values():
                      yield from string_values(v)
              elif isinstance(value, list):
                  for v in value:
                      yield from string_values(v)
          for raw in tuple(strings):
              if raw.lstrip().startswith(("{", "[")):
                  try:
                      strings.extend(string_values(json.loads(raw)))
                  except ValueError:
                      pass
          stages = set()
          receipts = set()
          for raw in strings:
              stages.update(re.findall(r"\bxu-preview-[a-z0-9-]{1,50}", raw))
              for match in re.finditer(r"XU_PREVIEW_MOVEMENT\s+(\{[^\r\n}]{2,1900}\})", raw):
                  try:
                      facts = json.loads(match[1])
                  except ValueError:
                      continue
                  if (isinstance(facts, dict) and 1 <= len(facts) <= 48 and
                      all(re.fullmatch(r"[A-Za-z][A-Za-z0-9]{0,31}", k) and type(v) is int and abs(v) < 100000000
                          for k, v in facts.items())):
                      receipts.add(json.dumps(facts, sort_keys=True))
          for row in sorted(receipts)[:8]:
              print("XU_PREVIEW_MOVEMENT", row)
          print(json.dumps({"assertionStages": sorted(stages)[:64], "movementReceiptCount": len(receipts)}))
          passed = (sys.argv[1] == "0" and summary.get("result") == "Passed" and
                    list(counts.values()) == [1, 1, 0, 0] and len(observed) == 1 and
                    observed[0] in {expected, "ArenaFlowTests/" + expected})
          sys.exit(0 if passed else 1)
          PY
