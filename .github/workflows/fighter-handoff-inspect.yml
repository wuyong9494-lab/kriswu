name: Inspect handoff checkpoint

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: 'Dropbox shared URL for continuation zip'
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
            ref: codex/fighter-visual-acceptance-20261113-1200
            path: repo
      - name: Audit repo and handoff archive
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
        run: 'python3 -c "exec(''import os,re,sys,urllib.request,zipfile,subprocess\\nfrom pathlib import Path\\nT=Path(os.environ[\"RUNNER_TEMP\"])\\nR=Path(\"repo\")\\nbuf=[]\\ndef out(s=\"\"):\\n  print(s,flush=True)\\n  buf.append(str(s))\\ndef show(l,p):\\n  out(\"=== \"+l+\" ===\")\\n  out(p.read_text(errors=\"replace\") if p.exists() else \"MISSING: \"+str(p))\\nout(\"COMMIT_SHA=\"+subprocess.check_output([\"git\",\"-C\",\"repo\",\"rev-parse\",\"HEAD\"],text=True).strip())\\nu=os.environ[\"ARCHIVE_URL\"].strip()\\nu=u[:-4]+\"dl=1\" if u.endswith(\"dl=0\") else u\\nzp=T/\"handoff.zip\"\\nurllib.request.urlretrieve(u,zp)\\nup=T/\"zip_unpack\"\\nwith zipfile.ZipFile(zp) as z:\\n  z.extractall(up)\\nrdir=T/\"restored\"\\nrdir.mkdir(exist_ok=True)\\nrpys=list(up.rglob(\"restore.py\"))\\nif rpys:\\n  rpy=rpys[0]\\n  rt=rpy.read_text(errors=\"replace\")\\n  fl=[\"--target\"] if \"--target\" in rt else ([\"--dest\"] if \"--dest\" in rt else ([\"--output\"] if \"--output\" in rt else []))\\n  res=subprocess.run([sys.executable,str(rpy)]+fl+[str(rdir)],cwd=str(rpy.parent),capture_output=True,text=True)\\n  out(\"RESTORE_RC=\"+str(res.returncode)+\" OUT=\"+res.stdout+\" ERR=\"+res.stderr)\\n  if not any(rdir.rglob(\"*\")):\\n    res2=subprocess.run([sys.executable,str(rpy)],cwd=str(rdir),capture_output=True,text=True)\\n    out(\"RESTORE2_RC=\"+str(res2.returncode)+\" OUT=\"+res2.stdout+\" ERR=\"+res2.stderr)\\nout(\"=== A: WORKFLOWS ===\")\\nwf=R/\".github\"/\"workflows\"\\nfor f in sorted(wf.iterdir()):\\n  out(f.name+\" -> secrets: \"+str(sorted(set(re.findall(\"secrets\"+chr(46)+\"[A-Za-z0-9_]+\",f.read_text(errors=\"replace\"))))))\\nshow(\"fighter-android-official-client.yml\",wf/\"fighter-android-official-client.yml\")\\nout(\"=== B: PRIVATE ===\")\\npv=R/\".github\"/\"private\"\\nif pv.exists():\\n  for d in sorted(pv.iterdir()):\\n    out(\"SUBDIR: \"+d.name)\\n  for m in sorted(pv.rglob(\"manifest.json\")):\\n    show(str(m),m)\\nout(\"=== C: SCRIPTS & SWIFT ===\")\\nfor sd in [R/\"scripts\",R/\".github\"/\"scripts\"]:\\n  out(\"DIR \"+str(sd)+\": \"+str([str(x.relative_to(sd)) for x in sorted(sd.rglob(\"*\")) if x.is_file()] if sd.exists() else \"MISSING\"))\\nshow(\"DuelErlangAssetIdentity.swift\",R/\"App\"/\"Services\"/\"DuelErlangAssetIdentity.swift\")\\nshow(\"DuelReplayStateAuditTests.swift\",R/\"Tests\"/\"ShiftCoreTests\"/\"DuelReplayStateAuditTests.swift\")\\nout(\"=== D: RESTORED ===\")\\nfor p in sorted(rdir.rglob(\"*.py\")):\\n  out(\"PY: \"+str(p.relative_to(rdir))+\" (\"+str(p.stat().st_size)+\" bytes)\")\\nfor p in sorted(rdir.rglob(\"inventory-private.json\")):\\n  show(str(p.relative_to(rdir)),p)\\nc16=rdir/\"continued-20261116\"\\nfor p in (sorted(c16.glob(\"*.py\")) if c16.exists() else []):\\n  show(str(p.relative_to(rdir)),p)\\nxd=c16/\"xuxiao-dynamic-source-audit-v1\"\\nout(\"XUXIAO_JSONS: \"+str([x.name for x in sorted(xd.glob(\"*.json\"))] if xd.exists() else \"MISSING\"))\\nshow(\"resume-points-private.json\",xd/\"resume-points-private.json\")\\n(T/\"audit_report.txt\").write_text(chr(10).join(buf))'')"'
      
