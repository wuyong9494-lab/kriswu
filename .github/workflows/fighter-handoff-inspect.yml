name: Inspect handoff checkpoint

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: 'Dropbox shared URL for continuation zip'
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Pretty-print key character receipts and D20 resume points
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
        run: |
          python3 - <<'PY'
          import json, os, textwrap, urllib.request, zipfile
          from pathlib import Path

          url = os.environ["ARCHIVE_URL"].strip()
          if url.endswith("dl=0"):
              url = url[:-4] + "dl=1"
          dest = Path(os.environ["RUNNER_TEMP"]) / "111.zip"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=180) as resp, open(dest, "wb") as out:
              while True:
                  chunk = resp.read(1024 * 1024)
                  if not chunk:
                      break
                  out.write(chunk)

          targets = [
              "continued-20261116/xuxiao-dynamic-source-audit-v1/receipt-private.json",
              "continued-20261116/xuxiao-dynamic-source-audit-v1/resume-points-private.json",
              "continued-20261116/xuxiao-founder-source-v2/xuxiao-required-resources-v1.json",
              "continued-20261116/erlang-runtime-contour-v2/erlang-contour-media-binding-private.json",
              "continued-20261116/serpent-match-v2/match-integration-receipt-private.json",
              "continued-20261116/serpent-abilities-models-v1/receipt-private.json",
          ]
          out_lines = ["# Key Character Receipts & D20 Resume Points\n"]
          with zipfile.ZipFile(dest, "r") as zf:
              cp = json.loads(zf.read("checkpoint.json").decode("utf-8"))
              by_path = {item["path"]: item for item in cp["files"]}
              for p in targets:
                  if p in by_path:
                      raw = zf.read("blobs/" + by_path[p]["sha256"]).decode("utf-8", errors="replace")
                      try:
                          pretty = json.dumps(json.loads(raw), indent=2, ensure_ascii=False)
                      except Exception:
                          pretty = raw
                      wrapped = "\n".join(textwrap.fill(line, width=100, subsequent_indent="    ") if len(line) > 100 else line for line in pretty.splitlines())
                      out_lines.append(f"## `{p}`\n```json\n{wrapped[:15000]}\n```\n")

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(out_lines), encoding="utf-8")
          dest.unlink(missing_ok=True)
          PY
