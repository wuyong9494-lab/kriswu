{"name":"Inspect handoff checkpoint","on":{"workflow_dispatch":{"inputs":{"archive_url":{"description":"Archive URL","required":true,"type":"string"}}}},"jobs":{"d15-d13-details":{"runs-on":"ubuntu-24.04","steps":[{"uses":"actions/checkout@v4","with":{"ref":"codex/fighter-visual-acceptance-20261113-1200","path":"repo"}},{"name":"Restore and inspect D15/D13 details","env":{"ARCHIVE_URL":"${{ inputs.archive_url }}"},"run":"python3 - <<'PYEOF'\nimport os, sys, json, zipfile, subprocess, urllib.request\nfrom pathlib import Path\n\nu = os.environ['ARCHIVE_URL'].strip()\nif u.endswith('dl=0'):\n    u = u[:-4] + 'dl=1'\nT = Path(os.environ['RUNNER_TEMP'])\nzp = T / 'handoff.zip'\nurllib.request.urlretrieve(u, zp)\nup = T / 'zip_unpack'\nwith zipfile.ZipFile(zp) as z:\n    z.extractall(up)\nrdir = T / 'restored'\nrdir.mkdir(exist_ok=True)\nrpys = list(up.rglob('restore.py')) or list(Path('repo').rglob('restore.py'))\nif rpys:\n    rpy = rpys[0]\n    rt = rpy.read_text(errors='replace')\n    fl = ['--target'] if '--target' in rt else (['--dest'] if '--dest' in rt else (['--output'] if '--output' in rt else []))\n    subprocess.run([sys.executable, str(rpy)] + fl + [str(rdir)], cwd=str(rpy.parent), check=False)\n    if not any(rdir.rglob('*')):\n        subprocess.run([sys.executable, str(rpy)], cwd=str(rdir), check=False)\n\nout = []\ndef add(s):\n    out.append(s)\n\np1 = rdir / 'continued-20261116/erlang-runtime-contour-v2/erlang-contour-media-binding-private.json'\nadd('=== 1) erlang-contour-media-binding-private.json ===')\nadd(p1.read_text(errors='replace') if p1.exists() else f'MISSING: {p1}')\n\nd2 = rdir / 'continued-20261116/serpent-abilities-models-v1'\nadd('=== 2) serpent-abilities-models-v1 ===')\nif d2.exists():\n    for f in sorted(d2.rglob('*')):\n        if f.is_file():\n            add(f'{f.relative_to(d2)} : {f.stat().st_size} bytes')\n    for fn in ['SF3_D13_Cloud_Motion_Binding.json', 'SF3_D13_Bottle_Motion_Binding.json']:\n        fp = d2 / fn\n        add(f'--- {fn} ---')\n        if fp.exists():\n            txt = fp.read_text(errors='replace')\n            try:\n                obj = json.loads(txt)\n                add('Top-level keys: ' + str(list(obj.keys()) if isinstance(obj, dict) else type(obj).__name__))\n            except Exception as e:\n                add(f'JSON parse err: {e}')\n            add('\\n'.join(txt.splitlines()[:50]))\n        else:\n            add(f'MISSING: {fp}')\nelse:\n    add(f'MISSING: {d2}')\n\np3 = Path('repo/.github/scripts/fighter_android_official_client.py')\nadd('=== 3) fighter_android_official_client.py ===')\nif p3.exists():\n    lines = p3.read_text(errors='replace').splitlines()\n    add(f'Total lines: {len(lines)}')\n    kws = ['width', 'height', 'dpi', 'terms_activity', 'activity', 'tap', 'click', 'coord', 'cache', 'gamedata', 'config', 'bundle', 'sdcard', 'redroid', 'resolution', 'terms', 'continue']\n    shown = set()\n    for i, ln in enumerate(lines):\n        low = ln.lower()\n        if any(k in low for k in kws):\n            for j in range(max(0, i-1), min(len(lines), i+3)):\n                shown.add(j)\n    for j in sorted(shown):\n        add(f'{j+1}: {lines[j]}')\nelse:\n    add(f'MISSING: {p3}')\n\nfor sp in ['repo/App/Services/DuelErlangSwordEffects.swift', 'repo/App/Services/DuelErlangSkillEffects.swift']:\n    fp = Path(sp)\n    add(f'=== 4) {sp} (first 200 lines) ===')\n    if fp.exists():\n        lines = fp.read_text(errors='replace').splitlines()\n        add(f'Total lines: {len(lines)}')\n        add('\\n'.join(lines[:200]))\n    else:\n        add(f'MISSING: {fp}')\n\ntext = '\\n'.join(out)\nif len(text.encode('utf-8')) > 58000:\n    text = text.encode('utf-8')[:58000].decode('utf-8', errors='ignore') + '\\n...[TRUNCATED]'\nprint(text)\nPYEOF"}]},"d20-arm64-probe":{"runs-on":"ubuntu-24.04-arm","timeout-minutes":8,"steps":[{"uses":"actions/checkout@v4","with":{"ref":"codex/fighter-visual-acceptance-20261113-1200","path":"repo"}},{"name":"Install adb and load binder_linux","run":"sudo apt-get update && sudo apt-get install -y android-tools-adb && sudo modprobe binder_linux"},{"name":"Run ARM64 redroid probe for 19221.apk","run":"python3 - <<'PYEOF'\nimport os, re, sys, time, hashlib, subprocess, urllib.request\nfrom pathlib import Path\n\ndef sh(cmd, check=True, timeout=None):\n    return subprocess.run(cmd, shell=True, check=check, timeout=timeout, capture_output=True, text=True)\n\ncf = Path('repo/.github/scripts/fighter_android_official_client.py').read_text(errors='replace')\ndef find_int(pats, default):\n    for p in pats:\n        m = re.search(p, cf, re.I)\n        if m:\n            return int(m.group(1))\n    return default\n\nw = find_int([r'(?:WIDTH|SCREEN_W|ANDROID_W)\\w*\\s*=\\s*(\\d+)', r'redroid_width=(\\d+)'], 1280)\nh = find_int([r'(?:HEIGHT|SCREEN_H|ANDROID_H)\\w*\\s*=\\s*(\\d+)', r'redroid_height=(\\d+)'], 720)\ndpi = find_int([r'(?:DPI|SCREEN_DPI|ANDROID_DPI)\\w*\\s*=\\s*(\\d+)', r'redroid_dpi=(\\d+)'], 240)\n\nm_act = re.search(r'TERMS_ACTIVITY\\s*=\\s*[\\x27\\x22]([^\\x27\\x22]+)[\\x27\\x22]', cf)\nterms_act = m_act.group(1) if m_act else 'com.nekki.shadowfight3'\nm_main = re.search(r'(?:MAIN_ACTIVITY|LAUNCH_ACTIVITY)\\s*=\\s*[\\x27\\x22]([^\\x27\\x22]+)[\\x27\\x22]', cf)\nmain_act = m_main.group(1) if m_main else 'com.nekki.shadowfight3/com.unity3d.player.UnityPlayerActivity'\n\ndef find_xy(pats, dx, dy):\n    for p in pats:\n        m = re.search(p, cf, re.I)\n        if m:\n            return int(m.group(1)), int(m.group(2))\n    return dx, dy\n\ncb_x, cb_y = find_xy([r'(?:CHECKBOX|AGREE|TERMS_CHECK|CONSENT_CHECK)\\w*\\s*=\\s*\\(\\s*(\\d+)\\s*,\\s*(\\d+)\\s*\\)', r'checkbox.*?(\\d{2,4})\\s*,\\s*(\\d{2,4})'], int(w*0.25), int(h*0.7))\nct_x, ct_y = find_xy([r'(?:CONTINUE|ACCEPT|NEXT|TERMS_BTN|CONFIRM)\\w*\\s*=\\s*\\(\\s*(\\d+)\\s*,\\s*(\\d+)\\s*\\)', r'continue.*?(\\d{2,4})\\s*,\\s*(\\d{2,4})'], int(w*0.5), int(h*0.8))\nprint(f'Extracted config: w={w} h={h} dpi={dpi} main_act={main_act} terms_act={terms_act} cb=({cb_x},{cb_y}) ct=({ct_x},{ct_y})')\n\nsh(f'docker run -d --privileged --name redroid -p 5555:5555 redroid/redroid:12.0.0-arm64 androidboot.redroid_width={w} androidboot.redroid_height={h} androidboot.redroid_dpi={dpi} androidboot.redroid_gpu_mode=guest')\n\nfor i in range(60):\n    sh('adb connect localhost:5555', check=False)\n    r = sh('adb -s localhost:5555 shell getprop sys.boot_completed', check=False)\n    if r.stdout.strip() == '1':\n        print(f'Boot completed at {i*2}s')\n        break\n    time.sleep(2)\nelse:\n    raise RuntimeError('Android boot timeout')\n\napk_path = Path(os.environ['RUNNER_TEMP']) / '19221.apk'\nurllib.request.urlretrieve('https://sf3assets.nekki.com/builds/apk/7/19221.apk', apk_path)\nsha = hashlib.sha256(apk_path.read_bytes()).hexdigest()\nprint('APK sha256:', sha)\nassert sha == '3653dc2cd2a43aef50d93f66f26a0093a8c63911cb965b8482ee8fcf68ebe5f9', f'SHA mismatch: {sha}'\n\nr_inst = sh(f'adb -s localhost:5555 install --abi arm64-v8a \"{apk_path}\"')\nprint('Install:', r_inst.stdout.strip())\n\nsh('adb -s localhost:5555 logcat -b crash -c', check=False)\nr_start = sh(f'adb -s localhost:5555 shell am start -n {main_act}', check=False)\nif r_start.returncode != 0 or 'Error' in r_start.stderr:\n    sh('adb -s localhost:5555 shell monkey -p com.nekki.shadowfight3 -c android.intent.category.LAUNCHER 1', check=False)\n\nfor _ in range(25):\n    wout = sh('adb -s localhost:5555 shell dumpsys window | grep -E \"mCurrentFocus|mFocusedApp\"', check=False).stdout\n    if terms_act.split('/')[-1] in wout or 'shadowfight3' in wout:\n        break\n    time.sleep(2)\ntime.sleep(6)\nsh(f'adb -s localhost:5555 shell input tap {cb_x} {cb_y}', check=False)\ntime.sleep(1.5)\nsh(f'adb -s localhost:5555 shell input tap {ct_x} {ct_y}', check=False)\n\nkws = [b'wpn__imperial_gloves_01_01', b'arm__agl_49', b'helm__agl_49', b'rng__agl_knives_01_06', b'sets_d20', b'w_imperial_gloves', b'D20_stance_Emperor']\nfound_files = []\nt0 = time.time()\nwhile time.time() - t0 < 100:\n    cr = sh('adb -s localhost:5555 logcat -b crash -d', check=False).stdout.strip()\n    if cr and '--------- beginning of crash' != cr:\n        print('CRASH DETECTED:\\n' + cr[:2000])\n        break\n    for base in ['/sdcard/Android/data/com.nekki.shadowfight3/files/gamedata/Resources/Configs', '/data/media/0/Android/data/com.nekki.shadowfight3/files/gamedata/Resources/Configs']:\n        ls = sh(f'adb -s localhost:5555 shell ls -1 \"{base}\" 2>/dev/null', check=False).stdout.splitlines()\n        hits = [f.strip() for f in ls if f.strip().startswith(('bundles_', 'bundlesConfig_')) and f.strip().endswith('.bytes')]\n        if hits:\n            found_files = [f'{base}/{h}' for h in hits]\n            break\n    if found_files:\n        print('Found config files:', found_files)\n        break\n    time.sleep(4)\nelse:\n    print('Poll 100s finished; crash log:', sh('adb -s localhost:5555 logcat -b crash -d', check=False).stdout.strip()[:1000])\n\nfor fp in found_files:\n    if '/bundles_' in fp:\n        data = subprocess.run(['adb', '-s', 'localhost:5555', 'exec-out', 'cat', fp], capture_output=True).stdout\n        print(f'File: {fp} size={len(data)} sha256={hashlib.sha256(data).hexdigest()}')\n        for k in kws:\n            print(f'  {k.decode()}: {data.count(k)}')\nPYEOF"},{"name":"Cleanup container and temp","if":"always()","run":"docker rm -f redroid || true\nrm -rf \"$RUNNER_TEMP\"/* || true"}]}}}
