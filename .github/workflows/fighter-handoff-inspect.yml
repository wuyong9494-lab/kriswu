name: Inspect handoff checkpoint

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: 'Dropbox shared URL for continuation zip'
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
            ref: codex/fighter-visual-acceptance-20261113-1200
            path: repo
      - name: Audit repo and handoff archive
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
        run: 'python3 -c "exec(''import os,sys,json,urllib.request,zipfile,subprocess\\nfrom pathlib import Path\\nT=Path(os.environ[\"RUNNER_TEMP\"])\\nR=Path(\"repo\")\\nu=os.environ[\"ARCHIVE_URL\"].strip()\\nu=u.replace(\"dl=0\",\"dl=1\") if \"dl=0\" in u else (u+(\"&\" if \"?\" in u else \"?\")+\"dl=1\" if \"dl=1\" not in u else u)\\nzp=T/\"handoff.zip\"\\nreq=urllib.request.Request(u,headers={\"User-Agent\":\"Mozilla/5.0\"})\\nwith urllib.request.urlopen(req,timeout=120) as resp, open(zp,\"wb\") as f: f.write(resp.read())\\nprint(\"ZIP_BYTES\",zp.stat().st_size)\\nun=T/\"unpacked\"\\nun.mkdir(parents=True,exist_ok=True)\\nwith zipfile.ZipFile(zp,\"r\") as z: z.extractall(un)\\nprint(\"UNPACKED\",sorted(p.name for p in un.iterdir()))\\nrp=un/\"restore.py\"\\nif not rp.exists(): rp=next(un.rglob(\"restore.py\"))\\nprint(\"===RESTORE_PY_HEAD===\")\\nfor l in rp.read_text(encoding=\"utf-8\",errors=\"replace\").splitlines()[:40]: print(l)\\nrs=T/\"restored\"\\nrs.mkdir(parents=True,exist_ok=True)\\nfor a in [str(zp),str(un)]:\\n p=subprocess.run([sys.executable,str(rp),a,str(rs)],capture_output=True,text=True)\\n print(\"RESTORE_TRY\",Path(a).name,\"RC\",p.returncode)\\n if p.stdout: print(\"RESTORE_OUT\",p.stdout[:1000])\\n if p.stderr: print(\"RESTORE_ERR\",p.stderr[:1000])\\n if p.returncode==0 and any(rs.iterdir()): break\\nprint(\"===1A_RESTORED_FILES===\")\\nfor p in sorted(rs.rglob(\"*\")):\\n if p.is_file():\\n  rel=p.relative_to(rs).as_posix()\\n  sz=p.stat().st_size\\n  if p.suffix==\".py\" or (p.suffix in [\".json\",\".md\",\".txt\"] and sz<300000): print(f\"{rel} ({sz})\")\\n  if \"android_bundle_catalog\" in p.name or \"bundles\" in p.parts: print(f\"BUNDLE_MATCH: {rel} ({sz})\")\\nprint(\"===1B_SERPENT_INVENTORY===\")\\np=rs/\"continued-20261116/serpent-body-audio-gap-v1/inventory-private.json\"\\nprint(p.read_text(encoding=\"utf-8\",errors=\"replace\") if p.exists() else \"MISSING\")\\nprint(\"===1C_CONTINUED_PY===\")\\ncd=rs/\"continued-20261116\"\\nfor p in sorted(cd.rglob(\"*.py\")) if cd.exists() else []:\\n print(f\"--- {p.relative_to(rs).as_posix()} ---\")\\n print(p.read_text(encoding=\"utf-8\",errors=\"replace\"))\\nprint(\"===1D_XUXIAO_DYNAMIC_AUDIT===\")\\nd=rs/\"continued-20261116/xuxiao-dynamic-source-audit-v1\"\\nfor p in sorted(d.rglob(\"*.json\")) if d.exists() else []:\\n print(f\"--- {p.relative_to(rs).as_posix()} ---\")\\n print(p.read_text(encoding=\"utf-8\",errors=\"replace\"))\\nprint(\"===1E_ERLANG_CONTOUR_V2===\")\\nd=rs/\"continued-20261116/erlang-runtime-contour-v2\"\\nfor p in sorted(d.rglob(\"*.json\")) if d.exists() else []:\\n if p.stat().st_size<200000:\\n  print(f\"--- {p.relative_to(rs).as_posix()} ---\")\\n  print(p.read_text(encoding=\"utf-8\",errors=\"replace\"))\\nprint(\"===1F_XUXIAO_FOUNDER_V2===\")\\nd=rs/\"continued-20261116/xuxiao-founder-source-v2\"\\nfor p in sorted(d.rglob(\"*.json\")) if d.exists() else []:\\n obj=json.loads(p.read_text(encoding=\"utf-8\",errors=\"replace\"))\\n print(f\"--- {p.relative_to(rs).as_posix()} ---\")\\n if isinstance(obj,dict):\\n  print(\"keys:\",list(obj.keys()))\\n  for k,v in obj.items():\\n   if isinstance(v,list): print(f\"  {k}: list len={len(v)} sample={json.dumps(v[:2],ensure_ascii=False)}\")\\n   elif isinstance(v,dict): print(f\"  {k}: dict len={len(v)} sample_keys={list(v.keys())[:5]}\")\\n   else: print(f\"  {k}: {repr(v)[:200]}\")\\n elif isinstance(obj,list):\\n  print(\"list len:\",len(obj),\"sample:\",json.dumps(obj[:2],ensure_ascii=False))\\nprint(\"===2A_SWIFT_FILES===\")\\nfor sub in [\"App/Services\",\"App/Views\",\"Sources/ShiftCore\"]:\\n d=R/sub\\n print(sub,[p.relative_to(R).as_posix() for p in sorted(d.rglob(\"*.swift\"))] if d.exists() else \"MISSING\")\\nprint(\"===2B_REPO_FILES===\")\\nfiles=[\".github/workflows/fighter-testflight.yml\",\".github/workflows/fighter-character-audio-20261116.yml\",\".github/workflows/fighter-display-network-20261116.yml\",\".github/scripts/fighter_android_official_client.py\",\".github/scripts/fighter_android_sdk_install.py\",\".github/scripts/fighter_h17_d19_native.py\",\"scripts/rebind_erlang_contour_media.py\",\"scripts/bind_serpent_match_runtime.py\",\"App/Services/DuelWeaponAssets.swift\",\"App/Services/DuelCharacter.swift\"]\\nfor rel in files:\\n p=R/rel\\n print(f\"===FILE: {rel}===\")\\n print(p.read_text(encoding=\"utf-8\",errors=\"replace\") if p.exists() else \"MISSING\")'')"'
      
