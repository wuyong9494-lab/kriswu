name: Inspect handoff checkpoint

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: 'Dropbox shared URL for continuation zip'
        required: true
        type: string

permissions:
  contents: read

jobs:
  arm64-probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: uname -a && nproc && free -h && ls -la /dev/kvm || true
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
            ref: codex/fighter-visual-acceptance-20261113-1200
            path: repo
      - name: Audit repo and handoff archive
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
        run: 'python3 -c "import os,sys,urllib.request,zipfile,subprocess;from pathlib import Path;T=Path(os.environ[\"RUNNER_TEMP\"]);R=Path(\"repo\");u=os.environ[\"ARCHIVE_URL\"].strip();u=u.replace(\"dl=0\",\"dl=1\") if \"dl=0\" in u else (u+(\"&\" if \"?\" in u else \"?\")+\"dl=1\" if \"dl=1\" not in u else u);zp=T/\"handoff.zip\";req=urllib.request.Request(u,headers={\"User-Agent\":\"Mozilla/5.0\"});open(zp,\"wb\").write(urllib.request.urlopen(req,timeout=120).read());un=T/\"unpacked\";un.mkdir(parents=True,exist_ok=True);zipfile.ZipFile(zp).extractall(un);rp=un/\"restore.py\" if (un/\"restore.py\").exists() else next(un.rglob(\"restore.py\"));rs=T/\"restored\";rs.mkdir(parents=True,exist_ok=True);subprocess.run([sys.executable,str(rp),str(zp),str(rs)]).returncode==0 or subprocess.run([sys.executable,str(rp),str(un),str(rs)],check=True);rs_files=[\"continued-20261116/xuxiao-dynamic-source-audit-v1/official-download-resolver.json\",\"continued-20261116/xuxiao-dynamic-source-audit-v1/receipt-private.json\",\"continued-20261116/xuxiao-dynamic-source-audit-v1/resume-points-private.json\",\"continued-20261116/xuxiao-founder-source-v2/xuxiao-required-resources-v1.json\",\"continued-20261116/xuxiao-founder-source-v2/xuxiao-original-equipment-levels-v1.json\",\"continued-20261116/xuxiao-founder-source-v2/receipt-private.json\",\"continued-20261116/erlang-final-test-receipt-private.json\",\"continued-20261116/serpent-match-v2/match-integration-receipt-private.json\",\"continued-20261116/serpent-body-audio-v1/serpent-body-audio-receipt-private.json\"];repo_files=[\".github/scripts/fighter_android_official_client.py\",\".github/scripts/fighter_h17_d19_native.py\",\"scripts/pack_fighter_source_release.py\",\"scripts/bind_serpent_match_runtime.py\",\"App/Services/DuelFighterAssetReleaseLoader.swift\",\"App/Services/DuelWeaponAssets.swift\"];[print(f\"=== FILE: {p} ===\n\"+(p.read_text(encoding=\"utf-8\",errors=\"replace\") if p.exists() else \"[MISSING]\")) for p in [rs/f for f in rs_files]+[R/f for f in repo_files]]"'
        
