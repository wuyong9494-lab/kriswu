{"name":"Inspect handoff checkpoint","on":{"workflow_dispatch":{"inputs":{"archive_url":{"description":"Archive URL","required":true,"type":"string"}}}},"jobs":{"d15-d13-hashes":{"runs-on":"ubuntu-24.04","steps":[{"name":"Inspect D15 and D13 hashes","shell":"bash","run":"DL_URL=$(python3 -c 'import sys; u=sys.argv[1]; print(u[:-4]+\"dl=1\" if u.endswith(\"dl=0\") else u)' \"${{ inputs.archive_url }}\")\ncurl -fsSL \"$DL_URL\" -o \"$RUNNER_TEMP/handoff.zip\"\nunzip -q \"$RUNNER_TEMP/handoff.zip\" -d \"$RUNNER_TEMP/unpacked\"\npython3 \"$RUNNER_TEMP/unpacked/restore.py\" \"$RUNNER_TEMP/handoff.zip\" \"$RUNNER_TEMP/restored\"\ncat \"$RUNNER_TEMP/restored/continued-20261116/erlang-runtime-contour-v2/erlang-contour-media-binding-private.json\"\necho \"=== D15 MORPH ===\"\nsha256sum \"$RUNNER_TEMP/restored/continued-20261116/erlang-runtime-contour-v2/\"*Morph* \"$RUNNER_TEMP/restored/continued-20261116/erlang-runtime-contour-v2/\"*Companion* \"$RUNNER_TEMP/restored/continued-20261116/erlang-runtime-contour-v2/\"*.json* 2>/dev/null || ls -la \"$RUNNER_TEMP/restored/continued-20261116/erlang-runtime-contour-v2/\"\necho \"=== D13 ABILITY MODELS ===\"\nls -la \"$RUNNER_TEMP/restored/continued-20261116/serpent-abilities-models-v1/\"\necho \"=== D13 bindings ===\"\nfor f in SF3_D13_Cloud_Motion_Binding.json SF3_D13_Bottle_Motion_Binding.json d13-ability-models-private.json; do p=\"$RUNNER_TEMP/restored/continued-20261116/serpent-abilities-models-v1/$f\"; if [ -f \"$p\" ]; then echo \"=== $f ===\"; head -n 60 \"$p\"; else echo \"MISSING: $p\"; fi; done\nrm -rf \"$RUNNER_TEMP/handoff.zip\" \"$RUNNER_TEMP/unpacked\" \"$RUNNER_TEMP/restored\""}]},"d20-arm64-redroid":{"runs-on":"ubuntu-24.04-arm","timeout-minutes":8,"steps":[{"name":"Checkout repo","uses":"actions/checkout@v4","with":{"ref":"codex/fighter-visual-acceptance-20261113-1200","path":"repo"}},{"name":"Install adb and mount binderfs","shell":"bash","run":"sudo apt-get update && sudo apt-get install -y android-tools-adb\nsudo modprobe binder_linux\nsudo mkdir -p /dev/binderfs\nsudo mount -t binder binder /dev/binderfs || true\nsudo chmod 666 /dev/binderfs/* || true\nls -la /dev/binderfs"},{"name":"Pull and start redroid","shell":"bash","run":"IMG=\"redroid/redroid:12.0.0_64only-latest\"\ndocker pull \"$IMG\" || { IMG=\"redroid/redroid:12.0.0-latest\"; docker pull \"$IMG\"; }\ndocker run -d --privileged --name redroid -p 5555:5555 -v /dev/binderfs:/dev/binderfs \"$IMG\" androidboot.redroid_width=1920 androidboot.redroid_height=1080 androidboot.redroid_dpi=320 androidboot.redroid_gpu_mode=guest"},{"name":"Wait for redroid boot","shell":"bash","run":"BOOT=\"\"\nfor i in $(seq 1 30); do\n  if ! docker ps -q -f name=redroid | grep -q .; then\n    echo \"redroid container exited\"\n    docker logs redroid || true\n    exit 1\n  fi\n  adb connect localhost:5555 || true\n  BOOT=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r' || true)\n  echo \"Attempt $i: sys.boot_completed=$BOOT\"\n  if [ \"$BOOT\" = \"1\" ]; then\n    break\n  fi\n  sleep 2\ndone\n[ \"$BOOT\" = \"1\" ] || { docker logs redroid || true; exit 1; }"},{"name":"Download and install APK","shell":"bash","run":"curl -fsSL \"https://sf3assets.nekki.com/builds/apk/7/19221.apk\" -o \"$RUNNER_TEMP/19221.apk\"\necho \"3653dc2cd2a43aef50d93f66f26a0093a8c63911cb965b8482ee8fcf68ebe5f9  $RUNNER_TEMP/19221.apk\" | sha256sum -c -\nadb -s localhost:5555 install --abi arm64-v8a \"$RUNNER_TEMP/19221.apk\""},{"name":"Launch SF3 and tap","shell":"bash","run":"adb -s localhost:5555 shell am start -n com.nekki.shadowfight3/com.nekki.unityplugins.NekkiNativeActivity\nsleep 18\nadb -s localhost:5555 exec-out screencap -p > \"$RUNNER_TEMP/s.png\"\npython3 -c 'import struct,sys; d=open(sys.argv[1],\"rb\").read(24); w,h=struct.unpack(\">II\",d[16:24]); print(f\"PNG size: {w}x{h}\")' \"$RUNNER_TEMP/s.png\"\nadb -s localhost:5555 shell input tap 428 869\nsleep 3\nadb -s localhost:5555 shell input tap 1444 874"},{"name":"Poll Configs and inspect bundles","shell":"bash","run":"PREV_SIZES=\"\"\nPULLED=0\nfor i in $(seq 1 18); do\n  sleep 5\n  echo \"=== Poll $i ===\"\n  adb -s localhost:5555 shell pidof com.nekki.shadowfight3 || true\n  CFGS=$(adb -s localhost:5555 shell ls -la /sdcard/Android/data/com.nekki.shadowfight3/files/gamedata/Resources/Configs 2>/dev/null | tr -d '\\r' || true)\n  echo \"$CFGS\"\n  adb -s localhost:5555 logcat -b crash -d | tail -n 20 || true\n  CUR_SIZES=$(echo \"$CFGS\" | grep 'bundles_.*\\.bytes' | awk '{print $5\":\"$NF}' | sort || true)\n  if [ -n \"$CUR_SIZES\" ] && [ \"$CUR_SIZES\" = \"$PREV_SIZES\" ]; then\n    echo \"bundles_*.bytes stable across 2 polls\"\n    mkdir -p \"$RUNNER_TEMP/bundles\"\n    adb -s localhost:5555 pull /sdcard/Android/data/com.nekki.shadowfight3/files/gamedata/Resources/Configs \"$RUNNER_TEMP/bundles/\" || true\n    PULLED=1\n    break\n  fi\n  PREV_SIZES=\"$CUR_SIZES\"\ndone\nif [ \"$PULLED\" = \"1\" ]; then\n  python3 -c 'import os,sys,hashlib,re; root=sys.argv[1]; keys=[b\"wpn__imperial_gloves_01_01\",b\"wpn__imperial_gloves_01_01a\",b\"arm__agl_49\",b\"helm__agl_49\",b\"rng__agl_knives_01_06\",b\"sets_d20\",b\"w_imperial_gloves\",b\"D20_stance_Emperor\"]; [print(f\"{fn}: size={len(d)} sha256={hashlib.sha256(d).hexdigest()} matches={dict((k.decode(),d.count(k)) for k in keys)} sf3_urls={[u.decode() for u in re.findall(rb\"https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]*sf3[A-Za-z0-9._~:/?#@!$&()*+,;=%-]*\",d)[:5]]}\") for dp,_,fns in os.walk(root) for fn in sorted(fns) if \"bundles_\" in fn and fn.endswith(\".bytes\") for d in [open(os.path.join(dp,fn),\"rb\").read()]]' \"$RUNNER_TEMP/bundles\"\nfi"},{"name":"Cleanup","if":"always()","shell":"bash","run":"docker rm -f redroid || true\nrm -rf \"$RUNNER_TEMP\"/* || true"}]}}}
