name: Duel Original Minimal CI

on:
  push:
    branches:
      - codex/duel-original-minimal-20261120
    paths-ignore:
      - '.github/releases/**'
      - '.github/workflows/duel-original-testflight.yml'
      - '.github/scripts/duel_testflight_delivery.py'
  workflow_dispatch:

concurrency:
  group: duel-original-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: ${{ matrix.family }} Duel Minimal Regression
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Verify real 3D rigged character pack
        env:
          PACK_URL: ${{ secrets.DUEL_CHARACTERS_PACK_URL }}
        run: |
          set -euo pipefail
          if [ -n "${PACK_URL:-}" ]; then
            rm -rf /tmp/duel-characters-pack.zip /tmp/duel-characters-unpack
            mkdir -p /tmp/duel-characters-unpack App/Resources/DuelCharacters
            RESOLVED_URL="$(python3 -c '
            import os, re
            u = os.environ["PACK_URL"].strip()
            if "dropbox.com" in u:
                if "dl=0" in u:
                    u = re.sub(r"([?&])dl=0\b", r"\1dl=1", u)
                elif "dl=1" not in u:
                    u += ("&" if "?" in u else "?") + "dl=1"
            print(u)
            ')"
            curl -fsSL --retry 3 --connect-timeout 20 -o /tmp/duel-characters-pack.zip "$RESOLVED_URL"
            unzip -q -o /tmp/duel-characters-pack.zip -d /tmp/duel-characters-unpack
            find /tmp/duel-characters-unpack -type f \( -name 'DuelChar_*.glb' -o -name 'DuelChar_*.json' -o -name 'DuelWeapon*.glb' \) -exec cp -f {} App/Resources/DuelCharacters/ \;
            rm -rf /tmp/duel-characters-pack.zip /tmp/duel-characters-unpack
          fi
          echo "Real 3D rigged character pack:"
          ls -lh App/Resources/DuelCharacters/
          for hero in wuYong liuQuanwei sunDeng xuXiao; do
            test -s "App/Resources/DuelCharacters/DuelChar_${hero}.glb" || { echo "Missing DuelChar_${hero}.glb!"; exit 1; }
            test -s "App/Resources/DuelCharacters/DuelChar_${hero}.json" || { echo "Missing DuelChar_${hero}.json!"; exit 1; }
            test -s "App/Resources/DuelCharacters/DuelWeapon_${hero}.glb" || { echo "Missing DuelWeapon_${hero}.glb!"; exit 1; }
          done
          test -s "App/Resources/DuelCharacters/DuelWeaponL_sunDeng.glb" || { echo "Missing DuelWeaponL_sunDeng.glb!"; exit 1; }
          echo "TEST_RUNNER_DUEL_REQUIRE_RIGGED_CHARACTERS=1" >> "$GITHUB_ENV"
      - name: Install XcodeGen & generate project
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Boot ${{ matrix.family }} simulator
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          fam = os.environ["FAMILY"]
          data = json.load(sys.stdin)["devices"]
          cands = []
          for rt, devs in data.items():
              if "iOS" not in rt: continue
              for d in devs:
                  if d.get("isAvailable") and fam in d.get("name", ""):
                      cands.append((rt, d["name"], d["udid"]))
          cands.sort(key=lambda x: (x[0], "Pro" in x[1], x[1]))
          print(cands[-1][2])
          ')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Run DuelOriginalMinimalFlowTests on ${{ matrix.family }}
        run: |
          set -o pipefail
          rm -rf duel-minimal.xcresult duel-test.log
          status=0
          xcodebuild test \
            -project ShiftReminder.xcodeproj \
            -scheme ArenaFlow \
            -destination "id=$DEVICE" \
            -only-testing:ArenaFlowTests/DuelOriginalMinimalFlowTests \
            -resultBundlePath duel-minimal.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee duel-test.log | tail -n 160 || status=$?
          echo "=== Test Summary & Character Status ==="
          grep -E "\[duel-character-status\]|Test Case .* (passed|failed)|Executed|error:" duel-test.log | tail -n 60 || true
          exit $status
      - name: Extract screenshots
        if: always()
        run: |
          mkdir -p duel-screenshots
          if [ -d duel-minimal.xcresult ]; then
            xcrun xcresulttool export attachments --path duel-minimal.xcresult --output-path duel-screenshots || true
          fi
          ls -la duel-screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel-minimal-${{ matrix.family }}-screenshots
          path: duel-screenshots
          if-no-files-found: ignore
