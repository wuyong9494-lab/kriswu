name: Fighter character audio native continuation
'on':
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths: [App/**, Sources/**, Tests/**, scripts/build_fighter_network_rules.py, .github/scripts/fighter_character_audio_native.py, .github/workflows/fighter-character-audio-20261116.yml]
permissions:
  contents: read
jobs:
  native:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' && github.run_attempt == 1 &&
      github.event.head_commit.message == 'Bind serpent match audio and recovered character sources 20261116'
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: fighter-character-audio-20261116
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Prepare exact unsigned source regression
        run: python3 .github/scripts/fighter_character_audio_native.py prepare
      - name: Compile app widget and native tests once
        run: python3 .github/scripts/fighter_character_audio_native.py build
      - name: Start installed iPhone 17 Pro Max simulator
        run: python3 .github/scripts/fighter_character_audio_native.py simulator
      - name: Run six new audio lifecycle tests
        run: python3 .github/scripts/fighter_character_audio_native.py test
      - name: Verify exact result counts
        if: always()
        run: python3 .github/scripts/fighter_character_audio_native.py export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fighter-character-audio-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fighter-character-audio-20261116/*.log
            ${{ runner.temp }}/fighter-character-audio-20261116/*.json
          retention-days: 3
          if-no-files-found: error
      - name: Remove this run's simulator
        if: always()
        run: python3 .github/scripts/fighter_character_audio_native.py cleanup
