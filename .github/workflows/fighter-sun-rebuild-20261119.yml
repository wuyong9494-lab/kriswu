name: Rebuild and compare the exact Sun model (metadata only)
on:
  push:
    branches: [codex/fighter-visual-acceptance-20261113-1200]
    paths: ['.github/workflows/fighter-sun-rebuild-20261119.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: fighter-sun-rebuild-20261119
  cancel-in-progress: false
jobs:
  sun-rebuild-receipt:
    if: >-
      github.repository == 'wuyong9494-lab/kriswu' &&
      github.ref == 'refs/heads/codex/fighter-visual-acceptance-20261113-1200' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.event.before == '027b185cc1d0e20e51cd1e5f616d4d76fdfa3631' &&
      github.event.head_commit.message == 'Check reconstructed Sun 70-motion model under protection' &&
      github.event.deleted == false && github.event.forced == false
    runs-on: macos-26
    timeout-minutes: 12
    environment: fighter-private-assets
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/recovery/fighter-serpent-20261119/verify_serpent_receipt.py
            /.github/recovery/fighter-sun-20261119/
            /.github/workflows/fighter-sun-rebuild-20261119.yml
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: 73a0cf1ef86e35f40ed99ed9cc0ec467f10f4826
          path: pinned-input
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/scripts/fighter_base_recovery.py
            /.github/scripts/fighter_h17_d19_native.py
            /.github/scripts/fighter_shared_root_native.py
            /.github/scripts/fighter_integration_recipient.py
            /.github/private/fighter-h17-d19/
      - name: Check scope and install the fixed numeric dependency (no resource key)
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 027b185cc1d0e20e51cd1e5f616d4d76fdfa3631
          test "$(git -C pinned-input rev-parse HEAD)" = 73a0cf1ef86e35f40ed99ed9cc0ec467f10f4826
          d=.github/recovery/fighter-sun-20261119
          diff -u <(printf '%s\n' "$d/input-pins.json" "$d/inputs.cms.b64" "$d/rebuild_sun_glb_exact.py" "$d/verify_protected.py" .github/workflows/fighter-sun-rebuild-20261119.yml | LC_ALL=C sort) <(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)
          python3 -m venv "$RUNNER_TEMP/sun-venv"
          "$RUNNER_TEMP/sun-venv/bin/python" -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --no-deps numpy==2.3.5
      - name: Fetch the fixed encrypted recipient artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          gh api --method GET repos/wuyong9494-lab/kriswu/actions/artifacts/14303639959/zip > "$RUNNER_TEMP/sun-recipient-14303639959.zip"
      - name: Verify ciphertext pins before decryption
        shell: bash
        run: |
          export PATH="/opt/homebrew/opt/openssl@3/bin:/usr/local/opt/openssl@3/bin:$PATH"
          PYTHONPATH="$PWD/.github/recovery/fighter-serpent-20261119:$PWD/pinned-input/.github/scripts:$PWD/pinned-input/scripts" "$RUNNER_TEMP/sun-venv/bin/python" -s -B .github/recovery/fighter-sun-20261119/verify_protected.py pinned-input "$RUNNER_TEMP/sun-recipient-14303639959.zip"
      - name: Compare the 65, 68, and 70-motion model byte identities
        shell: bash
        env:
          FIGHTER_H17_D19_KEY: ${{ secrets.FIGHTER_H17_D19_KEY }}
        run: |
          export PATH="/opt/homebrew/opt/openssl@3/bin:/usr/local/opt/openssl@3/bin:$PATH"
          PYTHONPATH="$PWD/.github/recovery/fighter-serpent-20261119:$PWD/pinned-input/.github/scripts:$PWD/pinned-input/scripts" "$RUNNER_TEMP/sun-venv/bin/python" -s -B .github/recovery/fighter-sun-20261119/verify_protected.py pinned-input "$RUNNER_TEMP/sun-recipient-14303639959.zip" --protected
      - name: Remove downloaded encrypted artifact
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/sun-recipient-14303639959.zip"
