name: WuMind Layout Check

on:
  push:
    branches: [codex/wumind-video-search-fix-20261127, codex/wumind-flagship-next]
    paths:
      - 'App/Views/SettingsView.swift'
      - 'Tests/ArenaFlowTests/DutyDetailReviewTests.swift'
      - 'App/Views/WuMindView.swift'
      - 'App/Views/WuMindWorkbenchView.swift'
      - 'App/Views/WuMindComposerSubviews.swift'
      - 'App/Views/WuMindInlineBuildCard.swift'
      - 'App/Views/WuMindInChatConnectorsSheet.swift'
      - 'App/Services/WuMindChatBuildService.swift'
      - 'Tests/ArenaFlowTests/DeepSeekChatNavigationTests.swift'
      - 'Tests/ArenaFlowTests/WuMindStudioNavigationTests.swift'
      - '.github/workflows/wumind-layout-check.yml'
  workflow_dispatch:
    inputs:
      families:
        description: JSON array of simulator families
        required: false
        default: '["iPhone","iPad"]'
      cases:
        description: Tests to run in the selected suite (one XCTestCase or XCTestCase/method per line)
        required: false
        default: ''
      suites:
        description: JSON array of simulator suites
        required: false
        default: '["chat","navigation","tools","games","directory","appearance"]'

permissions:
  contents: read

concurrency:
  group: wumind-layout-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    name: ${{ matrix.device }} / ${{ matrix.suite }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.families || github.ref_name == 'codex/wumind-flagship-next' && '["iPhone","iPad"]' || '["iPhone"]') }}
        suite: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.suites || github.ref_name == 'codex/wumind-flagship-next' && '["selected"]' || '["chat"]') }}
    env:
      SUITE: ${{ matrix.suite }}
      SELECTED_TESTS: |
        ${{ inputs.cases }}
      FLAGSHIP_TARGETS: |-
        DutyDetailReviewTests/testBurdenMemberUpcomingReviewAndVoiceFromDutyWorkspace
        DeepSeekChatNavigationTests/testWuMindVideoGenerationStageLayoutWithoutNetwork
        WuMindStudioNavigationTests/testShareLocalPDFToTenderInboxFromWorkbench
        DeepSeekChatNavigationTests/testDeepSubpageHidesBottomTabBarAndRestoresOnPop
        DeepSeekChatNavigationTests/testChatCodePreviewRunsAndSavesAnEditableVersion
        DeepSeekChatNavigationTests/testOpenChatFromHomeAndReturn
        DeepSeekChatNavigationTests/testProviderChooserOpensWithoutContactingAI
        DeepSeekChatNavigationTests/testLongHistoryReachesBothEndsAndKeepsReadingPositionDuringStreaming
      FLAGSHIP_PUSH: ${{ github.event_name == 'push' && github.ref_name == 'codex/wumind-flagship-next' }}
      TARGETED_PUSH: ${{ contains(github.event.head_commit.message, '[wumind targeted check]') }}
      TARGETED_TESTS: |-
        DeepSeekChatNavigationTests/testLongHistoryReachesBothEndsAndKeepsReadingPositionDuringStreaming
        WuMindStudioNavigationTests/testShareLocalPDFToTenderInboxFromWorkbench
      DEVICE_FAMILY: ${{ matrix.device }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and generate project
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.6.app
          sudo xcode-select -s /Applications/Xcode_26.6.app
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 scripts/test_validate_wumind_gateway_build.py
          xcodegen generate
      - name: Run focused WuMind recovery, editing and chat checks
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          items = [(runtime, d["name"], d["udid"]) for runtime, rows in devices.items() if "iOS" in runtime for d in rows if d.get("isAvailable") and d["name"].startswith(os.environ["DEVICE_FAMILY"])]
          items.sort(key=lambda v: (v[0], "Pro" in v[1], v[1]))
          print(items[-1][2])')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          if [[ "$DEVICE_FAMILY" == "iPhone" ]]; then appearance=light; else appearance=dark; fi
          if [[ "$SUITE" == "appearance" || "$SUITE" == "selected-alternate" ]]; then
            if [[ "$DEVICE_FAMILY" == "iPhone" ]]; then appearance=dark; else appearance=light; fi
          fi
          xcrun simctl ui "$DEVICE" appearance "$appearance"
          if [[ "$SUITE" == "chat" ]]; then
            xcodebuild test -project ShiftReminder.xcodeproj -scheme ShiftReminder \
              -destination "id=$DEVICE" -parallel-testing-enabled NO \
              -only-testing:SiteTests/WuMindFlagshipAcceptanceTests \
              -only-testing:SiteTests/WuMindLiveAcceptanceTests \
              -resultBundlePath wumind-acceptance.xcresult CODE_SIGNING_ALLOWED=NO \
              | tee wumind-acceptance.log | tail -n 80
            xcrun simctl uninstall "$DEVICE" com.kriswu.shiftreminder || true
          fi
          if [[ "$FLAGSHIP_PUSH" == true ]]; then
            SELECTED_TESTS="$FLAGSHIP_TARGETS"
            if [[ "$TARGETED_PUSH" == true ]]; then SELECTED_TESTS="$TARGETED_TESTS"; fi
          fi
          case "$SUITE" in
            chat)
              tests=(DeepSeekChatNavigationTests/testPersonalKeySetupFromChat
                     DeepSeekChatNavigationTests/testStreamingScrollAndStopOnIdenticalOfflineInput
                     DeepSeekChatNavigationTests/testChatCodePreviewRunsAndSavesAnEditableVersion
                     DeepSeekChatNavigationTests/testWuMindTranscriptDefaultsToFoldedAndCanScroll
                     DeepSeekChatNavigationTests/testWuMindVideoGenerationStageLayoutWithoutNetwork)
              ;;
            navigation)
              tests=(DeepSeekChatNavigationTests/testWorkspaceLauncherHomeColdStartRoundTripAndDraftPreservation
                     DeepSeekChatNavigationTests/testDutyLargeTextCalendarFromLauncher
                     DeepSeekChatNavigationTests/testGroundStationAddSaveWithKeyboardOpenAndReEdit
                     DeepSeekChatNavigationTests/testDeepSubpageHidesBottomTabBarAndRestoresOnPop
                     DeepSeekChatNavigationTests/testDutySettingsOpensEncryptedSync
                     DutyRecordNavigationTests/testCreateEditAndReopenNoteFromWorkspace
                     DeepSeekChatNavigationTests/testWuMindAdminBillingNonOcclusion
                     DeepSeekChatNavigationTests/testExternalRoleOpensProfileAndPhoneLogin
                     DeepSeekChatNavigationTests/testExternalLoginFormAllowsKeyboardDismissAndMethodSwitch)
              ;;
            tools)
              tests=(DeepSeekChatNavigationTests/testWuMindCleanLayoutAndToolSearch
                     DeepSeekChatNavigationTests/testWorkspaceManagementEditorsOpenWithValidSaveStates
                     DeepSeekChatNavigationTests/testWorkbenchOpensOriginalTenToolsDirectly
                     DeepSeekChatNavigationTests/testDutyWorkbenchPassPlanAndTenderNavigation)
              ;;
            other-pages)
              tests=(AccountAndSettingsPageReviewTests DutyDetailReviewTests GameDirectoryReviewTests
                     WuMindStudioNavigationTests)
              if [[ "$DEVICE_FAMILY" == "iPhone" ]]; then
                tests+=(DutyPageReviewTests/testStatisticsAndWorkPagesFromSettingsDirectory)
              fi
              ;;
            selected|selected-alternate)
              tests=()
              while IFS= read -r name; do
                [[ "$name" =~ ^[[:space:]]*$ ]] && continue
                [[ "$name" =~ ^[A-Za-z_][A-Za-z_0-9]*(/test[A-Za-z_0-9]+)?$ ]] || exit 2
                tests+=("$name")
              done <<< "$SELECTED_TESTS"
              (( ${#tests[@]} > 0 )) || exit 2
              ;;
            note)
              tests=(DutyRecordNavigationTests/testCreateEditAndReopenNoteFromWorkspace)
              ;;
            offline-states)
              tests=(OfflineStateReviewTests TileFlowTests/testResultReplayIsReadOnlyAndReturnsToSameResult)
              ;;
            history-studios)
              tests=(DeepSeekChatNavigationTests/testLongHistoryReachesBothEndsAndKeepsReadingPositionDuringStreaming
                     DeepSeekChatNavigationTests/testWorkbenchOpensOriginalTenToolsDirectly
                     DeepSeekChatNavigationTests/testWuMindCleanLayoutAndToolSearch)
              ;;
            appearance)
              tests=(DutyDeepLinkReviewTests
                     DutyPageReviewTests/testMemberRowsAndHolidaySummaryFromDirectory
                     DeepSeekChatNavigationTests/testDutyLargeTextCalendarFromLauncher
                     DeepSeekChatNavigationTests/testWuMindCleanLayoutAndToolSearch)
              ;;
            directory-details)
              tests=(DutyPageReviewTests/testMemberRowsAndHolidaySummaryFromDirectory)
              ;;
            directory)
              tests=(DutyPageReviewTests)
              ;;
            games)
              tests=(StarRailFlowTests/testLargeTextBoardCanPickFromListAndReviewTheSameMove
                     StarTrialFlowTests/testBrandPrimaryEntryAndAccessibleListPicking
                     TileFlowTests/testJourneyStartsPicksUndoesAndReturnsHome
                     DuelFlowTests/testLargestTextKeepsLobbySelectionAndPracticeReachable)
              ;;
            *) exit 2 ;;
          esac
          selectors=()
          signing=(CODE_SIGNING_ALLOWED=NO)
          for name in "${tests[@]}"; do
            selectors+=("-only-testing:ArenaFlowTests/$name")
            if [[ "$name" == WuMindStudioNavigationTests || "$name" == WuMindStudioNavigationTests/testShareLocalPDFToTenderInboxFromWorkbench ]]; then
              # The simulated app and its extension need their App Group entitlements for the handoff.
              signing=(CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-)
            fi
          done
          xcodebuild test -project ShiftReminder.xcodeproj -scheme ArenaFlow \
            -destination "id=$DEVICE" -parallel-testing-enabled NO \
            "${selectors[@]}" -resultBundlePath wumind-layout.xcresult "${signing[@]}" \
            | tee wumind-layout.log | tail -n 100
      - name: Extract layout proof
        if: always()
        run: |
          mkdir -p wumind-layout-proof
          if [ -f wumind-acceptance.log ]; then cp wumind-acceptance.log wumind-layout-proof/; fi
          if [ -f wumind-layout.log ]; then cp wumind-layout.log wumind-layout-proof/; fi
          if [ -d wumind-layout.xcresult ]; then
            xcrun xcresulttool export attachments --path wumind-layout.xcresult --output-path wumind-layout-proof
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wumind-layout-proof-${{ matrix.device }}-${{ matrix.suite }}
          path: wumind-layout-proof/
          if-no-files-found: ignore
